function renderResumoPorFuncao(){
  /* Consolidação por função: soma valores já calculados pela RPC
     fechamento_evento por colaborador (fechamentoDados) — não recalcula
     nenhuma regra financeira nova, só agrupa e soma o que já veio pronto. */
  const porFuncao={};
  fechamentoDados.forEach(f=>{
    const k=f.funcao||'—';
    if(!porFuncao[k]) porFuncao[k]={funcao:k, valorFuncao:f.valor_diaria, colaboradores:0, diasTrabalhados:0, valorTotal:0, valorAdicional:0, desconto:0, total:0};
    const g=porFuncao[k];
    g.colaboradores+=1;
    g.diasTrabalhados+=(f.dias_trabalhados||0);
    g.valorTotal+=(f.valor_diaria!=null?(f.valor_base||0):0);
    g.valorAdicional+=(f.valor_excedente||0);
    g.desconto+=(f.desconto||0);
    g.total+=(f.total_receber||0);
  });
  const linhas=Object.values(porFuncao);
  if(!linhas.length) return `<div class="empty"><b>Sem dados para resumir</b></div>`;
  const totais=linhas.reduce((acc,l)=>({
    colaboradores:acc.colaboradores+l.colaboradores, diasTrabalhados:acc.diasTrabalhados+l.diasTrabalhados,
    valorTotal:acc.valorTotal+l.valorTotal, valorAdicional:acc.valorAdicional+l.valorAdicional,
    desconto:acc.desconto+l.desconto, total:acc.total+l.total
  }),{colaboradores:0,diasTrabalhados:0,valorTotal:0,valorAdicional:0,desconto:0,total:0});
  return `
    <table>
      <thead><tr><th>Função</th><th>Valor/Função</th><th>Colaboradores</th><th>Dias trabalhados</th><th>Valor Total</th><th>Valor adicional</th><th>Descontos</th><th>Total</th></tr></thead>
      <tbody>
        ${linhas.map(l=>`
          <tr>
            <td>${escapeHtml(l.funcao)}</td>
            <td class="mono">${l.valorFuncao!=null?brl(l.valorFuncao):'sem valor cadastrado'}</td>
            <td class="mono">${l.colaboradores}</td>
            <td class="mono">${l.diasTrabalhados}</td>
            <td class="mono">${brl(l.valorTotal)}</td>
            <td class="mono">${brl(l.valorAdicional)}</td>
            <td class="mono">${brl(l.desconto)}</td>
            <td class="mono">${brl(l.total)}</td>
          </tr>`).join('')}
      </tbody>
      <tfoot>
        <tr style="font-weight:700;">
          <td>Total geral</td><td></td>
          <td class="mono">${totais.colaboradores}</td>
          <td class="mono">${totais.diasTrabalhados}</td>
          <td class="mono">${brl(totais.valorTotal)}</td>
          <td class="mono">${brl(totais.valorAdicional)}</td>
          <td class="mono">${brl(totais.desconto)}</td>
          <td class="mono">${brl(totais.total)}</td>
        </tr>
      </tfoot>
    </table>
  `;
}
const DIAS_SEMANA_ABREV = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
function numeroPlano(v){
  const n=Number(v)||0;
  return Number.isInteger(n) ? String(n) : n.toFixed(2).replace('.',',');
}
function renderFechamentoPorDatas(){
  /* Visão só de apresentação/impressão — usa exatamente os mesmos
     dados já carregados (fechamentoDados, presencasNovas, eventoDias),
     sem recalcular nenhum valor financeiro novo. O valor de cada dia é
     só o valor/diária da função daquele colaborador (repetido dia a
     dia em que ele trabalhou, segundo o registro real do Checkout),
     seguido das horas adicionais daquele dia específico, se houver. */
  if(!fechamentoDados.length || !eventoDias.length) return `<div class="empty"><b>Sem dados suficientes para esta visão</b></div>`;
  const ehVigilante=f=>baseDaFuncaoDisplay(normalizaFuncaoDisplay(f.funcao))==='VIGILANTE';
  const vigilantes=fechamentoDados.filter(ehVigilante);
  const demais=fechamentoDados.filter(f=>!ehVigilante(f));
  const colspanDatas=2+eventoDias.length+4+1; // Colaborador+Função/Valor + 1 por dia + Valor Total/Adic./Desc./Total + Assinatura
  const gerarTabela=(lista)=>{
    const grupos=agruparPorFuncaoPrincipal(lista, f=>f.funcao, f=>f.nome);
    return `
    <table class="tabela-fechamento-datas">
      <thead><tr>
        <th>Colaborador</th>
        <th>Função / Valor</th>
        ${eventoDias.map(d=>`<th>${formatDate(d.data)} ${DIAS_SEMANA_ABREV[new Date(d.data+'T00:00:00').getDay()]}</th>`).join('')}
        <th>Valor Total</th><th>Adic.</th><th>Desc.</th><th>Total</th><th class="col-assinatura">Assinatura</th>
      </tr></thead>
      <tbody>
        ${linhasComTituloDeGrupo(grupos, colspanDatas, (f)=>`
          <tr>
            <td>${escapeHtml(f.nome)}</td>
            <td>${escapeHtml(f.funcao)} / ${f.valor_diaria!=null?numeroPlano(f.valor_diaria):'—'}</td>
            ${eventoDias.map(d=>{
              const pr=presencaDoDia(f.participacao_id, d.id);
              if(!pr || !pr.entrada_ts) return `<td></td>`;
              const he=horasExtraDe(pr);
              return `<td>${f.valor_diaria!=null?numeroPlano(f.valor_diaria):''}${he?` (${he}h)`:''}</td>`;
            }).join('')}
            <td>${brl(f.valor_base)}</td>
            <td>${brl(f.valor_excedente)}</td>
            <td>${brl(f.desconto)}</td>
            <td>${brl(f.total_receber)}</td>
            <td class="col-assinatura"></td>
          </tr>`)}
      </tbody>
    </table>`;
  };
  /* Resumo do Diretor: líder soma junto com a função principal, como
     pedido explicitamente nesta rodada — usa a mesma regra de
     agrupamento das demais telas (base + líder no mesmo bloco). */
  const gruposDiretor=agruparPorFuncaoPrincipal(fechamentoDados, f=>f.funcao, f=>f.nome);
  const linhasResumo=gruposDiretor.map(g=>({
    funcao:g.funcao, qtd:g.itens.length, total:g.itens.reduce((s,f)=>s+(f.total_receber||0),0)
  }));
  const totalGeral=linhasResumo.reduce((s,g)=>s+g.total,0);
  const qtdGeral=linhasResumo.reduce((s,g)=>s+g.qtd,0);
  return `
    <div style="margin-bottom:14px;"><button class="btn btn-ghost btn-sm" id="btnPrint">Imprimir / Exportar PDF</button></div>
    ${vigilantes.length ? `<div class="folha-fechamento"><div class="card-title">Vigilantes</div>${gerarTabela(vigilantes)}</div>` : ''}
    ${demais.length ? `<div class="folha-fechamento"><div class="card-title">Demais Funções</div>${gerarTabela(demais)}</div>` : ''}
    <div class="folha-fechamento">
      <div class="card-title">Resumo para o Diretor</div>
      <table class="tabela-fechamento-datas">
        <thead><tr><th>Função</th><th>Nº de colaboradores</th><th>Total a pagar</th></tr></thead>
        <tbody>
          ${linhasResumo.map(g=>`<tr><td>${escapeHtml(g.funcao)}</td><td>${g.qtd}</td><td>${brl(g.total)}</td></tr>`).join('')}
          <tr><td>TOTAL GERAL</td><td>${qtdGeral}</td><td>${brl(totalGeral)}</td></tr>
        </tbody>
      </table>
    </div>
  `;
}

/* ================= CPFs AUTORIZADOS (dentro do detalhe do evento) ================= */
function formatCpf(v){
  const d=(v||'').replace(/\D/g,'').slice(0,11);
  if(d.length>9) return d.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/,'$1.$2.$3-$4');
  if(d.length>6) return d.replace(/(\d{3})(\d{3})(\d{1,3})/,'$1.$2.$3');
  if(d.length>3) return d.replace(/(\d{3})(\d{1,3})/,'$1.$2');
  return d;
}
function maskCpfInput(el){ el.value=formatCpf(el.value); }
/* Máscara de celular brasileiro: (DD) 9 NNNN-NNNN, formatada
   progressivamente enquanto digita/cola/apaga. Armazenamento
   continua sendo feito só com os dígitos (ver uso em renderPublic). */
function formatTelefone(v){
  const d=(v||'').replace(/\D/g,'').slice(0,11);
  if(d.length===0) return '';
  if(d.length<=2) return `(${d}`;
  if(d.length<=3) return `(${d.slice(0,2)}) ${d.slice(2)}`;
  if(d.length<=7) return `(${d.slice(0,2)}) ${d.slice(2,3)} ${d.slice(3)}`;
  return `(${d.slice(0,2)}) ${d.slice(2,3)} ${d.slice(3,7)}-${d.slice(7)}`;
}
function maskTelefoneInput(el){ el.value=formatTelefone(el.value); }
async function loadCpfsAutorizadosEvento(){
  if(!currentEventId){ cpfsAutorizadosLista=[]; return; }
  const {data,error}=await sb.rpc('listar_cpfs_autorizados_evento',{p_evento_id:currentEventId});
  if(error){ console.error(error); cpfsAutorizadosLista=[]; return; }
  cpfsAutorizadosLista=data||[];
}
function filtrarCpfsAutorizados(){
  const buscaDigits=cpfsAutorizadosBusca.replace(/\D/g,'');
  const buscaTexto=cpfsAutorizadosBusca.trim().toLowerCase();
  return cpfsAutorizadosLista.filter(c=>{
    if(!cpfsAutorizadosBusca.trim()) return true;
    const matchCpf = buscaDigits && (c.cpf||'').includes(buscaDigits);
    const matchNome = (c.nome||'').toLowerCase().includes(buscaTexto);
    return matchCpf || matchNome;
  });
}

async function collectPayments(){
  const finalizedEvents = events.filter(e=>e.status==='finalizado');
  const rows=[];
  for(const ev of finalizedEvents){
    const s=(await sGet('staff:'+ev.id))||[];
    s.filter(c=>c.escalado&&c.compareceu).forEach(c=>{
      rows.push({eventoId:ev.id, evento:ev.evento, cliente:ev.cliente, data:c.data, staffId:c.id, nome:c.nome, entrada:c.entrada, saida:c.saida, valor:calcValor(c,ev), pago:!!c.pago, dataPagamento:c.dataPagamento||''});
    });
  }
  return rows;
}

    return;
  }
  main.innerHTML=`<div class="empty">Carregando pagamentos...</div>`;
  const rows=await collectPayments();
  const eventosFinalizados=events.filter(e=>e.status==='finalizado');
  main.innerHTML=`
    <div class="page-head"><div><h2>Pagamentos</h2><div class="sub">Colaboradores com fechamento aprovado pelo gestor</div></div></div>
    <div class="toolbar">
      <input type="text" id="fNome" placeholder="Buscar por nome">
      <select id="fEvento"><option value="">Todos os eventos</option>${eventosFinalizados.map(e=>`<option value="${e.id}">${escapeHtml(e.evento)}</option>`).join('')}</select>
      <input type="date" id="fDe" title="De">
      <input type="date" id="fAte" title="Até">
      <div class="spacer"></div>
    </div>
    <div class="section-title">Pendentes</div>
    <div id="pendTable"></div>
    <div class="section-title">Histórico de pagamentos</div>
    <div id="pagoTable"></div>
  `;

  function applyFilters(list){
    const nome=document.getElementById('fNome').value.trim().toLowerCase();
    const eventoId=document.getElementById('fEvento').value;
    const de=document.getElementById('fDe').value;
    const ate=document.getElementById('fAte').value;
    return list.filter(r=>{
      if(nome && !r.nome.toLowerCase().includes(nome)) return false;
      if(eventoId && r.eventoId!==eventoId) return false;
      if(de && r.data && r.data<de) return false;
      if(ate && r.data && r.data>ate) return false;
      return true;
    });
  }

  function drawTables(){
    const filtered=applyFilters(rows);
    const pendentes=filtered.filter(r=>!r.pago);
    const pagos=filtered.filter(r=>r.pago);

    document.getElementById('pendTable').innerHTML = pendentes.length ? `
      <div class="add-row" style="justify-content:flex-end;">
        <button class="btn btn-teal btn-sm" id="btnPagarSelecionados">Registrar pagamento dos selecionados</button>
      </div>
      <table>
        <thead><tr><th><input type="checkbox" id="chkAll"></th><th>Nome</th><th>Evento</th><th>Cliente</th><th>Data</th><th>Valor</th><th>Status</th></tr></thead>
        <tbody>
          ${pendentes.map(r=>`
            <tr data-eventoid="${r.eventoId}" data-staffid="${r.staffId}">
              <td><input type="checkbox" class="chk-pay"></td>
              <td>${escapeHtml(r.nome)}</td>
              <td>${escapeHtml(r.evento)}</td>
              <td>${escapeHtml(r.cliente)}</td>
              <td class="mono">${r.data?formatDate(r.data):'—'}</td>
              <td class="mono">${brl(r.valor)}</td>
              <td><span class="badge pendente">Pendente</span></td>
            </tr>`).join('')}
        </tbody>
      </table>` : `<div class="empty" style="padding:20px;"><b>Nenhum pagamento pendente</b>Tudo certo com os filtros atuais.</div>`;

    document.getElementById('pagoTable').innerHTML = pagos.length ? `
      <table>
        <thead><tr><th>Nome</th><th>Evento</th><th>Data do evento</th><th>Valor</th><th>Pago em</th></tr></thead>
        <tbody>
          ${pagos.map(r=>`<tr>
            <td>${escapeHtml(r.nome)}</td><td>${escapeHtml(r.evento)}</td>
            <td class="mono">${r.data?formatDate(r.data):'—'}</td><td class="mono">${brl(r.valor)}</td>
            <td class="mono">${r.dataPagamento?formatDate(r.dataPagamento):'—'}</td></tr>`).join('')}
        </tbody>
      </table>` : `<div class="empty" style="padding:20px;"><b>Nenhum pagamento registrado ainda</b></div>`;

    const chkAll=document.getElementById('chkAll');
    if(chkAll) chkAll.onchange=(e)=>{ document.querySelectorAll('.chk-pay').forEach(c=>c.checked=e.target.checked); };

    const btnPagar=document.getElementById('btnPagarSelecionados');
    if(btnPagar) btnPagar.onclick=async ()=>{
      const selected=[...document.querySelectorAll('.chk-pay:checked')].map(c=>c.closest('tr'));
      if(!selected.length){ showToast('Selecione ao menos um colaborador.'); return; }
      const byEvent={};
      selected.forEach(tr=>{
        const eid=tr.dataset.eventoid, sid=tr.dataset.staffid;
        (byEvent[eid]=byEvent[eid]||[]).push(sid);
      });
      for(const eid in byEvent){
        const s=(await sGet('staff:'+eid))||[];
        s.forEach(c=>{ if(byEvent[eid].includes(c.id)){ c.pago=true; c.dataPagamento=todayISO(); } });
        await sSet('staff:'+eid, s);
      }
      showToast('Pagamento registrado.');
      renderPagamentos(main);
    };
  }

  document.getElementById('fNome').oninput=drawTables;
  document.getElementById('fEvento').onchange=drawTables;
  document.getElementById('fDe').onchange=drawTables;
  document.getElementById('fAte').onchange=drawTables;
  drawTables();
}

/* ================= RELATÓRIOS ================= */
async function renderRelatorios(main){
  main.innerHTML=`<div class="empty">Carregando relatórios...</div>`;
  const monthEvents=events.filter(e=>e.data && e.data.slice(0,7)===dashMonth);
  eventStatsCache={};
  const stats=await Promise.all(monthEvents.map(e=>getEventStats(e.id)));
  const total=stats.reduce((s,st)=>s+st.valorTotal,0);
  main.innerHTML=`
    <div class="page-head"><div><h2>Relatórios</h2><div class="sub">Eventos do mês — operacional e financeiro</div></div>
      <input type="month" id="relMonth" value="${dashMonth}"></div>
    <div class="stat-grid" style="margin-bottom:20px;">
      <div class="stat-card"><div class="label">Eventos no mês</div><div class="value">${monthEvents.length}</div></div>
      <div class="stat-card"><div class="label">Total a pagar</div><div class="value">${maskValor(total)}</div></div>
    </div>
    ${monthEvents.length ? `
    <table>
      <thead><tr><th>Cliente</th><th>Evento</th><th>Data</th><th>Status</th><th>Escalados</th><th>Total</th><th></th></tr></thead>
      <tbody>
        ${monthEvents.map((e,i)=>`<tr>
          <td>${escapeHtml(e.cliente)}</td><td>${escapeHtml(e.evento)}</td><td class="mono">${formatPeriodo(e)}</td>
          <td><span class="badge ${e.status}">${e.status==='aberto'?'Em aberto':'Finalizado'}</span></td>
          <td class="mono">${stats[i].escaladosCount}</td><td class="mono">${maskValor(stats[i].valorTotal)}</td>
          <td><button class="btn btn-ghost btn-sm btn-abrir-rel" data-id="${e.id}">Abrir</button></td>
        </tr>`).join('')}
      </tbody>
    </table>` : `<div class="empty"><b>Nenhum evento neste mês</b></div>`}
  `;
  document.getElementById('relMonth').onchange=(e)=>{ dashMonth=e.target.value; renderRelatorios(main); };
  main.querySelectorAll('.btn-abrir-rel').forEach(btn=>{
    btn.onclick=async ()=>{ currentEventId=btn.dataset.id; await loadStaffForCurrent(); await loadInteressadosForCurrent(); await loadDiasEscalaPresenca(); section='evento'; subTab='aprovacao'; renderShell(); };
  });
}

/* ================= DETAIL HANDLERS ================= */
function attachDetailHandlers(){
  const linkBtn=document.getElementById('btnCopyLink');
  if(linkBtn) linkBtn.onclick=()=>copyText(eventLink(currentEventId));
  const linkBtnStatus=document.getElementById('btnCopyLinkStatus');
  if(linkBtnStatus) linkBtnStatus.onclick=()=>copyText(eventLinkStatus(currentEventId));

  const btnNewFuncaoEvento=document.getElementById('btnNewFuncaoEvento');
  if(btnNewFuncaoEvento) btnNewFuncaoEvento.onclick=()=>openFuncaoEventoForm();
  document.querySelectorAll('.btn-del-funcao-evento').forEach(btn=>{
    btn.onclick=async (e)=>{
      const nome=e.target.closest('.client-card').dataset.funcao;
      if(!confirm(`Excluir o valor de "${nome}" neste evento? Colaboradores com essa função ficarão sem valor cadastrado aqui.`)) return;
      const ev=currentEvent();
      ev.valoresFuncao=(ev.valoresFuncao||[]).filter(f=>f.funcao!==nome);
      await saveEvents();
      renderShell();
    };
  });
  const buscaFuncaoInput=document.getElementById('buscaFuncaoEvento');
  if(buscaFuncaoInput){
    /* Filtro é só manipulação de DOM (mostra/esconde cartões) — de
       propósito, sem chamar renderShell() a cada tecla, para não
       perder o foco/cursor do campo de busca enquanto o gestor digita. */
    buscaFuncaoInput.oninput=()=>{ buscaFuncaoEventoTexto=buscaFuncaoInput.value; filtrarFuncoesEvento(); };
    filtrarFuncoesEvento();
  }
  document.querySelectorAll('.input-valor-funcao-direto').forEach(inp=>{
    inp.onchange=async ()=>{
      const nome=inp.closest('.client-card').dataset.funcao;
      const ev=currentEvent();
      const entry=(ev.valoresFuncao||[]).find(f=>f.funcao===nome);
      if(!entry) return;
      const bruto=inp.value.trim();
      if(bruto===''){ entry.valorDia=null; }
      else{
        const novoValor=parseFloat(bruto);
        if(isNaN(novoValor) || novoValor<0){ showToast('Informe um valor numérico válido.'); inp.value=entry.valorDia!=null?entry.valorDia:''; return; }
        entry.valorDia=novoValor;
      }
      const r=await saveEvents();
      if(r && r.ok){ renderShell(); }
      else{ showToast('Erro ao salvar valor: '+(r && r.error && r.error.message ? r.error.message : 'tente novamente.')); }
    };
  });

  document.querySelectorAll('.btn-approve').forEach(btn=>{
    btn.onclick=async (e)=>{
      const id=e.target.closest('.interesse-row').dataset.id;
      const p=interessados.find(i=>i.id===id);
      staff.push({id:uid(), eventId:currentEventId, nome:p.nome, cpf:p.cpf||'', telefone:p.telefone||'', funcao:p.funcao||'', escalado:true, compareceu:false, data:currentEvent().data||'', entrada:'', saida:'', diasTrabalhados:1, pago:false});
      p.status='aprovado';
      await saveStaff(); await saveInteressados();
      subTab='escala';
      renderShell();
      showToast('Convocação aprovada.');
    };
  });
  document.querySelectorAll('.btn-reject').forEach(btn=>{
    btn.onclick=async (e)=>{ const id=e.target.closest('.interesse-row').dataset.id; const p=interessados.find(i=>i.id===id); p.status='recusado'; await saveInteressados(); renderShell(); };
  });

  const btnAdd=document.getElementById('btnAddStaff');
  if(btnAdd) btnAdd.onclick=async ()=>{
    const nome=document.getElementById('newNome').value.trim();
    const cpf=document.getElementById('newCpf').value.trim();
    const telefone=document.getElementById('newTelefone').value.trim();
    const funcao=document.getElementById('newFuncao').value.trim();
    if(!nome){ showToast('Informe o nome do colaborador.'); return; }
    staff.push({id:uid(), eventId:currentEventId, nome, cpf, telefone, funcao, escalado:true, compareceu:false, data:currentEvent().data||'', entrada:'', saida:'', diasTrabalhados:1, pago:false});
    await saveStaff(); renderShell(); showToast('Colaborador adicionado.');
  };
  const btnNotifyAll=document.getElementById('btnNotifyAll');
  if(btnNotifyAll) btnNotifyAll.onclick=()=>{
    const ev=currentEvent();
    const alvos=staff.filter(c=>c.telefone && c.telefone.trim());
    if(!alvos.length){ showToast('Nenhum colaborador com telefone cadastrado.'); return; }
    if(!confirm(`Isso vai abrir ${alvos.length} aba(s) do WhatsApp, uma por colaborador. Em cada uma, você só precisa clicar em "Enviar". Continuar?`)) return;
    alvos.forEach((c,i)=>{
      let numero=(c.telefone||'').replace(/\D/g,'');
      if(numero.length===10 || numero.length===11) numero='55'+numero; // adiciona DDI Brasil se a pessoa não colocou
      const texto=encodeURIComponent(`Olá ${c.nome}, você foi convocado(a) para o evento "${ev.evento}" (${formatPeriodo(ev)}). Aguardamos você!`);
      setTimeout(()=>window.open(`https://wa.me/${numero}?text=${texto}`,'_blank'), i*400);
    });
  };
  document.querySelectorAll('.chk-escalado').forEach(chk=>{
    chk.onchange=async (e)=>{ const id=e.target.closest('tr').dataset.id; const c=staff.find(s=>s.id===id); c.escalado=e.target.checked; await saveStaff(); renderShell(); };
  });
  document.querySelectorAll('.btn-remove-staff').forEach(btn=>{
    btn.onclick=async (e)=>{ const id=e.target.closest('tr').dataset.id; const c=staff.find(s=>s.id===id); if(!confirm(`Remover ${c.nome} deste evento?`)) return; staff=staff.filter(s=>s.id!==id); await saveStaff(); renderShell(); };
  });
  document.querySelectorAll('.stamp-toggle').forEach(el=>{
    el.onclick=async (e)=>{ const id=e.target.closest('tr').dataset.id; const c=staff.find(s=>s.id===id); c.compareceu=!c.compareceu; if(c.compareceu){ if(!c.data) c.data=currentEvent().data||''; if(c.diasTrabalhados==null) c.diasTrabalhados=1; } await saveStaff(); renderShell(); };
  });
  ['f-data','f-entrada','f-saida','f-dias'].forEach(cls=>{
    document.querySelectorAll('.'+cls).forEach(inp=>{
      inp.onchange=async (e)=>{ const id=e.target.closest('tr').dataset.id; const c=staff.find(s=>s.id===id); const field=cls==='f-data'?'data':cls==='f-entrada'?'entrada':cls==='f-saida'?'saida':'diasTrabalhados'; c[field]=e.target.value; await saveStaff(); renderShell(); };
    });
  });
  const btnPrint=document.getElementById('btnPrint');
  if(btnPrint) btnPrint.onclick=()=>window.print();
  const btnAprovar=document.getElementById('btnAprovar');
  if(btnAprovar) btnAprovar.onclick=async ()=>{
    if(!confirm('Confirma o fechamento da equipe? Após aprovar, o evento fica disponível na área de Pagamentos.')) return;
    currentEvent().status='finalizado';
    await saveEvents();
    renderShell();
    showToast('Fechamento aprovado.');
  };
  const btnReabrir=document.getElementById('btnReabrir');
  if(btnReabrir) btnReabrir.onclick=async ()=>{
    currentEvent().status='aberto';
    await saveEvents();
    renderShell();
    showToast('Evento reaberto para ajustes.');
  };
}

/* ================= INIT ================= */
loadAll();
</script>

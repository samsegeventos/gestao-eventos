function renderEscalaHorarioDias(){
  if(!gestorUnlocked) return lockScreenHtml('A escala e o horário por dia só ficam visíveis para o gestor.');
  if(!eventoDias.length) return `<div class="empty"><b>Este evento ainda não tem dias gerados</b>Salve novamente o cadastro do evento (data/data fim/horário) para gerar os dias automaticamente.<div class="mono" style="margin-top:10px;font-size:11px;color:var(--muted);">Diagnóstico: evento_id consultado = "${escapeHtml(currentEventId||'')}" · ${ultimoErroEventoDias ? 'erro do Supabase: '+escapeHtml(ultimoErroEventoDias) : 'consulta OK, 0 linhas retornadas (possível RLS bloqueando o papel authenticated)'}</div></div>`;
  if(!participacoesNovas.length) return `<div class="empty"><b>Nenhuma participação confirmada ainda</b>Colaboradores aparecem aqui depois que confirmam sua participação pelo link público (CPF autorizado).</div>`;

  /* Regra definitiva: só quem já foi aprovado (Pré-Escala → Escala
     Oficial) fica disponível para ser escalado por dia — aprovação não
     escala automaticamente nenhum dia específico, só libera a pessoa
     para aparecer aqui. Cruza por CPF com "interessados" (já carregado
     ao abrir o evento). Se o retorno de listar_participacoes_evento não
     trouxer CPF em nenhum registro (campo ausente), mantém a lista
     completa em vez de esconder todo mundo por causa de uma coluna que
     talvez não exista nessa RPC — evita piorar o que já funcionava. */
  const algumTemCpf = participacoesNovas.some(p=>p.cpf);
  let listaExibida = participacoesNovas;
  if(algumTemCpf){
    const cpfsAprovados = new Set(
      interessados.filter(i=>(i.status||'pendente')==='aprovado').map(i=>(i.cpf||'').replace(/\D/g,''))
    );
    listaExibida = participacoesNovas.filter(p=>cpfsAprovados.has((p.cpf||'').replace(/\D/g,'')));
  }
  if(!listaExibida.length){
    return `<div class="empty"><b>Nenhum colaborador aprovado ainda</b>Aprove candidatos na Pré-Escala (Escala Oficial) para eles ficarem disponíveis aqui.</div>`;
  }

  return `
    <div class="card-title">Escala por dia</div>
    <div class="card-sub">Marque em quais dias específicos cada colaborador está previsto para trabalhar. Lista de todos os dias do evento lado a lado — não há um único "dia selecionado" nesta tabela.</div>
    ${(()=>{
      const grupos=agruparPorFuncaoPrincipal(listaExibida, p=>p.funcao, p=>p.nome);
      const colspanEscala=2+eventoDias.length;
      return `
        ${renderResumoQuantidadesFuncao(grupos)}
        <table>
          <thead><tr><th>#</th><th>Colaborador</th>${eventoDias.map(d=>`<th>${formatarDataComDiaSemana(d.data)}</th>`).join('')}</tr></thead>
          <tbody>
            ${linhasComTituloDeGrupo(grupos, colspanEscala, (p,numero)=>`
              <tr data-participacao-id="${pid(p)}">
                <td class="mono">${numero}</td>
                <td>${escapeHtml(nomeExibicao(p.nome))}</td>
                ${eventoDias.map(d=>`<td style="text-align:center;"><label class="checkbox-wrap"><input type="checkbox" class="chk-escala-dia" data-dia-id="${d.id}" ${escaladoNoDia(pid(p), d.id)?'checked':''}></label></td>`).join('')}
              </tr>`)}
          </tbody>
        </table>
      `;
    })()}
    <div class="card-title" style="margin-top:28px;">Dias do evento — horário</div>
    <div class="card-sub">Horário de cada dia — clique em "Editar" para ajustar um dia específico.</div>
    <table>
      <thead><tr><th>Data</th><th>Início</th><th>Fim</th><th></th></tr></thead>
      <tbody>
        ${eventoDias.map(d=>`
          <tr data-dia-id="${d.id}">
            <td>${formatarDataComDiaSemana(d.data)}</td>
            <td class="mono">${(d.hora_inicio||'').slice(0,5)}</td>
            <td class="mono">${(d.hora_fim||'').slice(0,5)}</td>
            <td><button class="btn btn-ghost btn-sm btn-editar-horario-dia">Editar horário</button></td>
          </tr>`).join('')}
      </tbody>
    </table>
  `;
}
function attachEscalaHorarioHandlers(){
  document.querySelectorAll('.btn-editar-horario-dia').forEach(btn=>{
    btn.onclick=async ()=>{
      const tr=btn.closest('tr'); const diaId=Number(tr.dataset.diaId);
      const dia=eventoDias.find(d=>d.id===diaId); if(!dia) return;
      const novoInicioRaw=prompt('Horário de início (HH:MM):', (dia.hora_inicio||'').slice(0,5));
      if(novoInicioRaw===null) return;
      const novoInicio=normalizarHora(novoInicioRaw);
      if(!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(novoInicio.trim())){ showToast('Horário de início inválido. Use HH:MM.'); return; }
      const novoFimRaw=prompt('Horário de fim (HH:MM):', (dia.hora_fim||'').slice(0,5));
      if(novoFimRaw===null) return;
      const novoFim=normalizarHora(novoFimRaw);
      if(!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(novoFim.trim())){ showToast('Horário de fim inválido. Use HH:MM.'); return; }
      const r=await chamarRpcGestor('atualizar_horario_dia',{p_evento_dia_id:diaId, p_hora_inicio:novoInicio, p_hora_fim:novoFim});
      if(r.ok){ showToast('Horário atualizado.'); await loadDiasEscalaPresenca(); renderShell(); }
    };
  });
  document.querySelectorAll('.chk-escala-dia').forEach(chk=>{
    chk.onchange=async ()=>{
      const tr=chk.closest('tr'); const participacaoId=Number(tr.dataset.participacaoId); const diaId=Number(chk.dataset.diaId);
      const r=await chamarRpcGestor('definir_escala_dia',{p_participacao_id:participacaoId, p_evento_dia_id:diaId, p_escalado:chk.checked});
      if(r.ok){ showToast('Escala atualizada.'); await loadDiasEscalaPresenca(); renderShell(); }
      else { chk.checked=!chk.checked; } // reverte visualmente se o banco recusou (ex: conflito, presença já registrada)
    };
  });
}

/* ================= ETAPA 2 — CHECKOUT/PRESENÇA POR DIA ================= */
function renderCheckoutDias(){
  if(!gestorUnlocked) return lockScreenHtml('O checkout de entrada/saída só fica visível para o gestor.');
  if(!eventoDias.length) return `<div class="empty"><b>Este evento ainda não tem dias gerados</b>Salve novamente o cadastro do evento para gerar os dias.<div class="mono" style="margin-top:10px;font-size:11px;color:var(--muted);">Diagnóstico: evento_id consultado = "${escapeHtml(currentEventId||'')}" · ${ultimoErroEventoDias ? 'erro do Supabase: '+escapeHtml(ultimoErroEventoDias) : 'consulta OK, 0 linhas retornadas (possível RLS bloqueando o papel authenticated)'}</div></div>`;
  const diaId=diaSelecionadoPresenca || eventoDias[0].id;
  const escaladosNoDia = participacoesNovas.filter(p=>escaladoNoDia(pid(p), diaId));
  return `
    <div class="card-title">Checkout por dia</div>
    <div class="card-sub">Selecione o dia, registre a entrada e a saída (horário real do servidor). Depois da saída, informe se houve hora extra.</div>
    <div class="field" style="max-width:280px;">
      <label>Dia</label>
      <select id="selDiaPresenca">
        ${eventoDias.map(d=>`<option value="${d.id}" ${d.id===diaId?'selected':''}>${formatDate(d.data)} (${(d.hora_inicio||'').slice(0,5)}–${(d.hora_fim||'').slice(0,5)})</option>`).join('')}
      </select>
    </div>
    ${escaladosNoDia.length ? (()=>{
      const grupos=agruparPorFuncaoPrincipal(escaladosNoDia, p=>p.funcao, p=>p.nome);
      return `
        ${renderResumoQuantidadesFuncao(grupos)}
        <table>
          <thead><tr><th>#</th><th>Colaborador</th><th>Função</th><th>Telefone</th><th>Entrada</th><th>Saída</th><th>Horas adicionais</th><th></th></tr></thead>
          <tbody>
            ${linhasComTituloDeGrupo(grupos, 8, (p,numero)=>{
              const pr=presencaDoDia(pid(p), diaId);
              const temEntrada=pr && pr.entrada_ts;
              const temSaida=pr && pr.saida_ts;
              return `<tr data-participacao-id="${pid(p)}">
                <td class="mono">${numero}</td>
                <td>${escapeHtml(nomeExibicao(p.nome))}</td>
                <td>${escapeHtml(p.funcao||'—')}</td>
                <td class="mono">${p.telefone?`<a href="tel:${escapeHtml(p.telefone)}" style="color:inherit;">${escapeHtml(formatTelefone(p.telefone))}</a>`:'—'}</td>
                <td class="mono">${temEntrada?new Date(pr.entrada_ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'—'}</td>
                <td class="mono">${temSaida?new Date(pr.saida_ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'—'}</td>
                <td class="mono">${horasExtraDe(pr)!=null ? horasExtraDe(pr)+'h' : (temSaida?'não informado':'—')}</td>
                <td>
                  ${!temEntrada ? `<button class="btn btn-teal btn-sm btn-entrada">Registrar entrada</button>` : ''}
                  ${temEntrada && !temSaida ? `<button class="btn btn-amber btn-sm btn-saida">Registrar saída</button>` : ''}
                  ${temSaida && (horasExtraDe(pr)==null) && !horasExtraAguardandoQtd.has(pid(p)) ? `
                    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                      <span style="font-size:12px;color:var(--muted);">Fez hora extra?</span>
                      <button class="btn btn-teal btn-sm btn-hora-extra-sim">Sim</button>
                      <button class="btn btn-ghost btn-sm btn-hora-extra-nao">Não</button>
                    </div>` : ''}
                  ${temSaida && (horasExtraDe(pr)==null) && horasExtraAguardandoQtd.has(pid(p)) ? `
                    <div style="display:flex;align-items:center;gap:6px;">
                      <input type="number" class="input-qtd-hora-extra mono" min="0" step="1" style="width:64px;" placeholder="0">
                      <button class="btn btn-teal btn-sm btn-confirmar-hora-extra">Confirmar</button>
                    </div>` : ''}
                  ${temSaida && (horasExtraDe(pr)!=null) ? `<button class="btn btn-ghost btn-sm btn-corrigir-hora-extra">Corrigir hora extra</button>` : ''}
                </td>
              </tr>`;
            })}
          </tbody>
        </table>
      `;
    })() : `<div class="empty"><b>Ninguém escalado para este dia</b>Escale colaboradores em "Escala &amp; Horário por Dia".</div>`}
  `;
}
let horasExtraAguardandoQtd = new Set(); // ids (pid) com o campo de quantidade aberto na tela, transitório
function attachCheckoutHandlers(){
  const sel=document.getElementById('selDiaPresenca');
  if(sel) sel.onchange=()=>{ diaSelecionadoPresenca=Number(sel.value); horasExtraAguardandoQtd.clear(); renderShell(); };
  document.querySelectorAll('.btn-entrada').forEach(btn=>{
    btn.onclick=async ()=>{
      const participacaoId=Number(btn.closest('tr').dataset.participacaoId);
      const r=await chamarRpcGestor('registrar_entrada_presenca',{p_participacao_id:participacaoId, p_evento_dia_id:diaSelecionadoPresenca});
      if(r.ok){ showToast('Entrada registrada.'); await loadDiasEscalaPresenca(); renderShell(); }
    };
  });
  document.querySelectorAll('.btn-saida').forEach(btn=>{
    btn.onclick=async ()=>{
      const participacaoId=Number(btn.closest('tr').dataset.participacaoId);
      const r=await chamarRpcGestor('registrar_saida_presenca',{p_participacao_id:participacaoId, p_evento_dia_id:diaSelecionadoPresenca});
      if(!r.ok) return;
      showToast('Saída registrada.');
      /* Não pergunta mais com confirm()/prompt(): depois de recarregar,
         a própria linha passa a mostrar os botões "Sim"/"Não" (já que
         temSaida=true e horas_extra ainda é null neste ponto). */
      await loadDiasEscalaPresenca(); renderShell();
    };
  });
  document.querySelectorAll('.btn-hora-extra-nao').forEach(btn=>{
    btn.onclick=async ()=>{
      const participacaoId=Number(btn.closest('tr').dataset.participacaoId);
      const r=await chamarRpcGestor('registrar_horas_extra',{p_participacao_id:participacaoId, p_evento_dia_id:diaSelecionadoPresenca, p_horas_extra:0});
      if(r.ok){ showToast('Sem hora extra registrada.'); await loadDiasEscalaPresenca(); renderShell(); }
    };
  });
  document.querySelectorAll('.btn-hora-extra-sim').forEach(btn=>{
    btn.onclick=()=>{
      const participacaoId=Number(btn.closest('tr').dataset.participacaoId);
      horasExtraAguardandoQtd.add(participacaoId);
      renderShell();
    };
  });
  document.querySelectorAll('.btn-corrigir-hora-extra').forEach(btn=>{
    btn.onclick=()=>{
      const participacaoId=Number(btn.closest('tr').dataset.participacaoId);
      horasExtraAguardandoQtd.add(participacaoId);
      renderShell();
    };
  });
  document.querySelectorAll('.btn-confirmar-hora-extra').forEach(btn=>{
    btn.onclick=async ()=>{
      const tr=btn.closest('tr'); const participacaoId=Number(tr.dataset.participacaoId);
      const input=tr.querySelector('.input-qtd-hora-extra');
      const valor=input.value.trim();
      const horas=parseInt(valor,10);
      if(valor==='' || isNaN(horas) || horas<0 || String(horas)!==valor){
        showToast('Informe um número inteiro maior ou igual a zero (ex: 0, 1, 2, 3).');
        return;
      }
      const r=await chamarRpcGestor('registrar_horas_extra',{p_participacao_id:participacaoId, p_evento_dia_id:diaSelecionadoPresenca, p_horas_extra:horas});
      if(r.ok){
        horasExtraAguardandoQtd.delete(participacaoId);
        showToast(horas>0?`${horas} hora(s) extra registrada(s).`:'Sem hora extra registrada.');
        await loadDiasEscalaPresenca(); renderShell();
      }
    };
  });
}

function renderFechamentoNovo(){
  if(!gestorUnlocked) return lockScreenHtml('O fechamento financeiro só fica visível para o gestor.');
  if(!fechamentoDados.length) return `<div class="empty"><b>Ainda sem colaboradores com dias trabalhados</b>O fechamento só mostra quem já teve entrada e saída registradas.</div>`;
  return `

function abreviarLider(funcaoReal){
  /* Só exibição, só nesta impressão — nunca altera a função real
     salva nem a chave usada para agrupar. */
  return (funcaoReal||'').replace(/ LÍDER DE EQUIPE\b/, ' LÍDER');
}
function ordenarFuncoesParaPresidencia(chaves){
  /* Ordem oficial das funções BASE; dentro da mesma base, variações
     não-líder vêm antes das variações líder (ordem alfabética/numérica
     entre si em ambos os casos) — cobre tanto "AUX. DE SERVIÇOS GERAIS"
     vs "AUX. DE SERVIÇOS GERAIS 2" quanto múltiplas variações de líder.
     Análise própria (não usa baseDaFuncaoDisplay, que não trata
     variações numeradas) — remove um possível número de variação no
     final ANTES de checar o sufixo de líder, para "AUX. DE SERVIÇOS
     GERAIS 2" ficar reconhecido como base "AUX. DE SERVIÇOS GERAIS". */
  const analisar=(funcaoNorm)=>{
    const semNumero=funcaoNorm.replace(/ \d+$/, '');
    const ehLider=semNumero.endsWith(' LÍDER DE EQUIPE');
    const base=ehLider ? semNumero.slice(0, -' LÍDER DE EQUIPE'.length) : semNumero;
    return {base, ehLider};
  };
  return [...chaves].sort((a,b)=>{
    const na=normalizaFuncaoDisplay(a), nb=normalizaFuncaoDisplay(b);
    const infoA=analisar(na), infoB=analisar(nb);
    if(infoA.base!==infoB.base){
      const ia=ORDEM_OFICIAL_FUNCOES_BASE.indexOf(infoA.base), ib=ORDEM_OFICIAL_FUNCOES_BASE.indexOf(infoB.base);
      if(ia!==-1 && ib!==-1) return ia-ib;
      if(ia!==-1) return -1;
      if(ib!==-1) return 1;
      return infoA.base.localeCompare(infoB.base,'pt-BR');
    }
    if(infoA.ehLider!==infoB.ehLider) return infoA.ehLider?1:-1; // função principal antes do líder
    return na.localeCompare(nb,'pt-BR');
  });
}
function renderResumoPorFuncao(){
  /* "Impressão p/ Presidência" — consolidação por função REAL exata
     (não por função-base): líderes ficam em linha própria, logo
     abaixo da função principal correspondente, porque podem ter
     valor/função diferente. Variações da mesma função com valores
     diferentes (ex: "AUX. DE SERVIÇOS GERAIS 2") também ficam em
     linhas separadas, automaticamente, por já agrupar pela string
     exata da função. Soma valores já calculados pela RPC

  }),{colaboradores:0,diasTrabalhados:0,valorTotal:0,valorAdicional:0,desconto:0,total:0});
  const cabecalhoRepetido=()=>`

  return `

        </tr>
      </thead>
      <tbody>
        ${linhas.map(l=>`
          <tr>
            <td class="col-func-presidencia">${escapeHtml(abreviarLider(l.funcao).toUpperCase())}</td>
            <td>${l.valorFuncao!=null?brl(l.valorFuncao):'SEM VALOR CADASTRADO'}</td>

          </tr>`).join('')}
        <tr style="font-weight:700;">
          <td>TOTAL GERAL</td><td></td>
          <td>${totais.colaboradores}</td>
          <td>${totais.diasTrabalhados}</td>
          <td>${brl(totais.valorTotal)}</td>

        </tr>
      </tbody>

  `;
}
const DIAS_SEMANA_ABREV = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
function numeroPlano(v){
  const n=Number(v)||0;
  return Number.isInteger(n) ? String(n) : n.toFixed(2).replace('.',',');
}
function periodoImpressao(ev){
  /* Formato específico para o cabeçalho de impressão: "DD/MM/AAAA A
     DD/MM/AAAA" (ou só uma data, se o evento for de um dia só) —
     mesma fonte de dados que já existe (ev.data/ev.dataFim), sem
     inventar nada. formatPeriodo() já existe mas usa "–" em vez de
     "A"; mantive as duas funções separadas para não alterar o que já
     usa formatPeriodo() em outro lugar. */
  if(!ev) return '';
  if(ev.dataFim && ev.dataFim!==ev.data) return `${formatDate(ev.data)} A ${formatDate(ev.dataFim)}`;
  return formatDate(ev.data);
}
const MESES_PT = ['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
function mesReferencia(ev){
  /* Sempre a partir da PRIMEIRA data do evento (ev.data), nunca da
     última — mesmo que o evento cruze a virada do mês/ano. */
  if(!ev || !ev.data) return '';
  const [y,m]=ev.data.split('-');
  return `${MESES_PT[Number(m)-1]}/${y}`;
}
function formatDiaMes(iso){ if(!iso) return ''; const [,m,d]=iso.split('-'); return `${d}/${m}`; }
function formatDiaSomente(iso){ if(!iso) return ''; const [,,d]=iso.split('-'); return d; }
function agruparPorFuncaoExataOrdenada(lista, getFuncao, getNome){
  /* Só para o FECHAMENTO EVENTO PRESIDÊNCIA: aqui o líder forma seu
     PRÓPRIO grupo, logo abaixo do grupo da função principal — ao
     contrário da regra usada em todas as outras telas do sistema
     (onde o líder fica dentro do mesmo grupo). Reaproveita
     ordenarFuncoesParaPresidencia() (já existente) para a ordem dos
     grupos — base antes do líder, seguindo a ordem oficial — e
     abreviarLider() (já existente) para o título do grupo. */
  const grupos={};
  lista.forEach(item=>{
    const norm=normalizaFuncaoDisplay(getFuncao(item)) || 'SEM FUNÇÃO INFORMADA';
    if(!grupos[norm]) grupos[norm]=[];
    grupos[norm].push(item);
  });
  const chavesOrdenadas=ordenarFuncoesParaPresidencia(Object.keys(grupos));
  return chavesOrdenadas.map(k=>{
    const itens=[...grupos[k]].sort((a,b)=>(getNome(a)||'').localeCompare(getNome(b)||'','pt-BR'));
    return {funcao:abreviarLider(k), itens};
  });
}
function funcaoParaImpressaoHTML(funcaoReal){
  /* Só exibição: função líder quebra em duas linhas ("FUNÇÃO" /
     "LÍDER") para melhor aproveitamento de largura na tabela — nunca
     altera a função real salva nos dados. Não usar em telas fora da
     impressão do fechamento (a Impressão p/ Presidência tem sua
     própria regra de abreviação de uma linha só, já implementada). */
  const norm=normalizaFuncaoDisplay(funcaoReal);
  const sufixo=' LÍDER DE EQUIPE';
  if(norm.endsWith(sufixo)) return `${escapeHtml(norm.slice(0,-sufixo.length))}<br>LÍDER`;
  return escapeHtml(norm||'—');
}
function renderTabelaFechamentoImpressao(mostrarCpf, mostrarAssinaturaData, listagemUnica){
  /* Função única compartilhada entre "FECHAMENTO GESTOR / IMPRESSÃO"
     (mostrarCpf=true, mostrarAssinaturaData=true, listagemUnica=false
     — mantém a separação em duas folhas Vigilantes/Grupo Anjos da Paz,
     sem alteração nesta rodada) e "FECHAMENTO EVENTO PRESIDÊNCIA /
     IMPRESSÃO" (mostrarCpf=false, mostrarAssinaturaData=false,
     listagemUnica=true — uma única listagem sequencial, sem separar
     Vigilantes das demais funções) — mesma estrutura, mesma fonte de
     dados (fechamentoDados, presencasNovas, eventoDias), sem
     recalcular nenhum valor financeiro novo e sem duplicar a lógica
     em dois lugares. O valor de cada dia é só o valor/diária da
     função daquele colaborador (repetido dia a dia em que ele
     trabalhou, segundo o registro real do Checkout), seguido das
     horas adicionais daquele dia específico, se houver. Só existe UMA
     coluna de valor ("VALOR" = valor_base) — a coluna "VALOR/DIA" foi
     removida por duplicar essa informação. */
  if(!fechamentoDados.length || !eventoDias.length) return `<div class="empty"><b>Sem dados suficientes para esta visão</b></div>`;
  const ev=currentEvent();
  const ehVigilante=f=>baseDaFuncaoDisplay(normalizaFuncaoDisplay(f.funcao))==='VIGILANTE';
  const vigilantes=fechamentoDados.filter(ehVigilante);
  const demais=fechamentoDados.filter(f=>!ehVigilante(f));
  // Nome + Função [+ CPF] + 1 por dia + Dias + Valor + Adic./Desc./Total [+ Assinatura + Data]
  const colspanDatas=(mostrarCpf?3:2)+eventoDias.length+5+(mostrarAssinaturaData?2:0); // Dias,Valor,Adic,Desc,Total = 5 colunas fixas depois dos dias
  /* Cabeçalho de UMA linha só, repetido em cada página impressa
     (thead nativo, com display:table-header-group): cliente + nome do
     evento + período à esquerda, mês de referência à direita. Os
     títulos "VIGILANTES"/"GRUPO ANJOS DA PAZ" NÃO entram aqui — ficam
     só no título de cada seção (fora da tabela); o cabeçalho da
     página começa direto em cliente + evento. */
  const cabecalhoRepetido=()=>`
    <tr class="linha-cabecalho-impressao"><th colspan="${colspanDatas}">
      <div style="display:flex; justify-content:space-between; align-items:baseline; gap:12px;">
        <span>${ev.cliente?escapeHtml(nomeExibicao(ev.cliente))+' — ':''}${escapeHtml(nomeExibicao(ev.evento))} — ${escapeHtml(periodoImpressao(ev)).toUpperCase()}</span>
        <span>${escapeHtml(mesReferencia(ev))}</span>
      </div>
    </th></tr>`;
  /* colgroup + table-layout:fixed: garante que a largura de cada
     coluna é a MESMA sempre, em qualquer bloco/folha e com qualquer
     quantidade de dias — não depende do conteúdo de cada linha para
     calcular largura, que era a causa do desalinhamento em eventos
     com muitos dias. */
  const colgroup=(()=>{
    const antesDosDias = mostrarCpf ? ['15%','12%','9%'] : ['18%','15%'];             // Nome,Função[,CPF]
    const depoisDosDias = mostrarAssinaturaData
      ? ['4%','8%','7%','7%','8%','15%','7%']    // Dias,Valor,Adic,Desc,Total,Assinatura,Data
      : ['5%','10%','9%','9%','10%'];             // Dias,Valor,Adic,Desc,Total (mais espaço, sem assinatura/data)
    const fixas=[...antesDosDias, ...depoisDosDias];
    const somaFixas=fixas.reduce((s,v)=>s+parseFloat(v),0);
    const larguraDia=eventoDias.length ? ((100-somaFixas)/eventoDias.length).toFixed(2)+'%' : '3%';
    return `<colgroup>
      ${antesDosDias.map(w=>`<col style="width:${w}">`).join('')}
      ${eventoDias.map(()=>`<col style="width:${larguraDia}">`).join('')}
      ${depoisDosDias.map(w=>`<col style="width:${w}">`).join('')}
    </colgroup>`;
  })();
  /* Fonte de referência 11px; eventos com muitos dias reduzem
     moderadamente em vez de cortar/quebrar qualquer informação — o
     navegador ainda permite diminuir a escala de impressão livremente
     por cima disso. */
  const fontePx=Math.max(9, Math.min(11, 11 - Math.max(0, eventoDias.length-8)*0.25)).toFixed(1);
  const gerarTabela=(lista, titulo, funcaoAgrupamento, conteudoExtra)=>{
    const grupos=(funcaoAgrupamento||agruparPorFuncaoPrincipal)(lista, f=>f.funcao, f=>f.nome);
    const totalGrupo=(itens)=>itens.reduce((s,f)=>s+(f.total_receber||0),0);
    return `
    <div class="folha-fechamento">
    ${titulo?`<div class="card-title" style="margin-bottom:6px;">${escapeHtml(titulo)}</div>`:''}
    <table class="tabela-fechamento-datas" style="font-size:${fontePx}px;">
      ${colgroup}
      <thead>
        ${cabecalhoRepetido()}
        <tr>
          <th class="col-nome">NOME</th>
          <th class="col-func-presidencia">FUNÇÃO</th>
          ${mostrarCpf?'<th>CPF</th>':''}
          ${eventoDias.map(d=>`<th class="col-dia">${formatDiaSomente(d.data)}</th>`).join('')}
          <th>DIAS</th>
          <th>VALOR</th>
          <th>ADIC.</th><th>DESC.</th><th>TOTAL</th>
          ${mostrarAssinaturaData?'<th class="col-assinatura">ASSINATURA</th><th class="col-data-manual">DATA</th>':''}
        </tr>
      </thead>
      <tbody>
        ${linhasComTituloDeGrupo(grupos, colspanDatas, (f)=>`
          <tr>
            <td class="col-nome">${escapeHtml(nomeExibicao(f.nome))}</td>
            <td class="col-func-presidencia">${funcaoParaImpressaoHTML(f.funcao)}</td>
            ${mostrarCpf?`<td>${f.cpf?formatCpf(f.cpf):'—'}</td>`:''}
            ${eventoDias.map(d=>{
              const pr=presencaDoDia(f.participacao_id, d.id);
              if(!pr || !pr.entrada_ts) return `<td class="col-dia">-</td>`;
              const he=horasExtraDe(pr);
              return `<td class="col-dia">${f.valor_diaria!=null?numeroPlano(f.valor_diaria):''}${he?` (${he}h)`:''}</td>`;
            }).join('')}
            <td>${f.dias_trabalhados}</td>
            <td>${f.valor_diaria!=null?brl(f.valor_base):'—'}</td>
            <td>${valorOuTraco(f.valor_excedente)}</td>
            <td>${valorOuTraco(f.desconto)}</td>
            <td>${brl(f.total_receber)}</td>
            ${mostrarAssinaturaData?'<td class="col-assinatura"></td><td class="col-data-manual"></td>':''}
          </tr>`, totalGrupo)}
      </tbody>
    </table>
    ${conteudoExtra||''}
    </div>`;
  };
  if(listagemUnica){
    /* Fechamento Evento Presidência: uma única listagem sequencial,
       sem separar Vigilantes das demais funções. Aqui (só aqui) o
       líder forma um grupo PRÓPRIO, logo abaixo da função principal —
       agruparPorFuncaoExataOrdenada() cuida disso; a ordem das
       funções continua a oficial do sistema. Sem quebra de página
       forçada entre grupos — é uma única <table>.
       IMPORTANTE: o resumo final (.totals) é passado como
       conteudoExtra para ficar DENTRO do mesmo .folha-fechamento que
       envolve a tabela — não como elemento irmão depois dela. Isso é
       o que impede a quebra de página forçada entre a listagem e o
       resumo: a regra de impressão .folha-fechamento{page-break-after:

       .folha-fechamento, o que tirava dela a condição de :last-child
       e reativava a quebra forçada logo após a tabela — exatamente
       onde não devia. */
    const totalGeral=fechamentoDados.reduce((s,f)=>s+(f.total_receber||0),0);
    const resumoFinal=`
      <div class="totals" style="margin-top:10px; page-break-inside:avoid;">
        <div class="item"><div class="label">Total de colaboradores</div><div class="value" style="font-size:16px;">${fechamentoDados.length}</div></div>
        <div class="item"><div class="label">Total a pagar no evento</div><div class="value">${brl(totalGeral)}</div></div>
      </div>`;
    return `
      <div style="margin-bottom:14px;"><button class="btn btn-ghost btn-sm" id="btnPrint">Imprimir / Exportar PDF</button></div>
      ${gerarTabela(fechamentoDados, null, agruparPorFuncaoExataOrdenada, resumoFinal)}
    `;
  }
  return `
    <div style="margin-bottom:14px;"><button class="btn btn-ghost btn-sm" id="${mostrarCpf?'btnPrintFechamentoEvento':'btnPrint'}">Imprimir / Exportar PDF</button></div>
    ${vigilantes.length ? gerarTabela(vigilantes,'VIGILANTES') : ''}
    ${demais.length ? gerarTabela(demais,'GRUPO ANJOS DA PAZ') : ''}
  `;
}
function attachFechamentoHandlers(){
  const btnCol=document.getElementById('btnVisaoColaborador');

  if(btnFunc) btnFunc.onclick=()=>{ fechamentoVisao='funcao'; renderShell(); };

/* ================= CPFs AUTORIZADOS (dentro do detalhe do evento) ================= */
function formatCpf(v){
  const d=(v||'').replace(/\D/g,'').slice(0,11);
  if(d.length>9) return d.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/,'$1.$2.$3-$4');
  if(d.length>6) return d.replace(/(\d{3})(\d{3})(\d{1,3})/,'$1.$2.$3');
  if(d.length>3) return d.replace(/(\d{3})(\d{1,3})/,'$1.$2');
  return d;
}
function maskCpfInput(el){ el.value=formatCpf(el.value); }
/* Máscara de celular brasileiro: (DD) 9 NNNN-NNNN, formatada
   progressivamente enquanto digita/cola/apaga. Armazenamento
   continua sendo feito só com os dígitos (ver uso em renderPublic). */
function formatTelefone(v){
  const d=(v||'').replace(/\D/g,'').slice(0,11);
  if(d.length===0) return '';
  if(d.length<=2) return `(${d}`;
  if(d.length<=3) return `(${d.slice(0,2)}) ${d.slice(2)}`;
  if(d.length<=7) return `(${d.slice(0,2)}) ${d.slice(2,3)} ${d.slice(3)}`;
  return `(${d.slice(0,2)}) ${d.slice(2,3)} ${d.slice(3,7)}-${d.slice(7)}`;
}
function maskTelefoneInput(el){ el.value=formatTelefone(el.value); }
/* ================= CRACHÁ: máscaras MG e validações (novo) =================
   Ambas seguem o mesmo padrão de formatX(v)/maskXInput(el) já usado
   por CPF/telefone: strip de tudo que não é dígito (o que também
   resolve "colar valor já formatado" — MG e pontuação são removidos
   e reconstruídos do zero, nunca duplicados) + limite de dígitos +
   reconstrução progressiva da máscara. */
function formatIdentidadeMG(v){
  const d=(v||'').replace(/\D/g,'').slice(0,8);
  if(!d) return '';
  let out='MG'+d.slice(0,2);
  if(d.length>2) out+='.'+d.slice(2,5);
  if(d.length>5) out+='.'+d.slice(5,8);
  return out;
}
function maskIdentidadeInput(el){ el.value=formatIdentidadeMG(el.value); }
function formatNumeroDpfMG(v){
  const d=(v||'').replace(/\D/g,'').slice(0,11);
  if(!d) return '';
  let out='MG'+d.slice(0,7);
  if(d.length>7) out+='/'+d.slice(7,11);
  return out;
}
function maskNumeroDpfInput(el){ el.value=formatNumeroDpfMG(el.value); }
function contarDigitos(valorFormatado){ return (valorFormatado||'').replace(/\D/g,'').length; }
/* Extrai o máximo de informação real de um erro do Supabase/RPC — não
   deixa nenhum erro silencioso. message/details/hint/code, quando
   existirem, todos aparecem para o usuário; nunca só um texto genérico. */
function formatarErroSupabase(err){
  if(!err) return 'MOTIVO: ERRO INESPERADO AO PROCESSAR O CADASTRO.';
  const partes=[];
  if(err.message) partes.push('Motivo: '+err.message);
  if(err.details) partes.push('Detalhes: '+err.details);
  if(err.hint) partes.push('Informação: '+err.hint);
  if(err.code) partes.push('Código: '+err.code);
  if(partes.length) return partes.join('<br>');
  return 'MOTIVO: ERRO INESPERADO AO PROCESSAR O CADASTRO.';
}
/* Reciclagem tem validade de 1 ano a partir da própria data e precisa
   cobrir TODO o período do evento (da primeira à última data
   cadastrada) — comparação por string ISO (YYYY-MM-DD), que já ordena
   cronologicamente sem precisar de objetos Date/fuso horário. */
function somaUmAnoIso(isoDate){
  const [y,m,d]=isoDate.split('-');
  return `${String(Number(y)+1).padStart(4,'0')}-${m}-${d}`;
}
function validarReciclagemParaEvento(dataReciclagemIso, ev){
  const dataInicial=ev.data;
  const dataFinal=ev.dataFim || ev.data;
  const validadeFinal=somaUmAnoIso(dataReciclagemIso);
  if(dataReciclagemIso > dataInicial){
    return {valido:false, dataInicial, dataFinal, validadeFinal, motivo:'posterior'};
  }
  if(validadeFinal < dataFinal){
    return {valido:false, dataInicial, dataFinal, validadeFinal, motivo:'vence_durante'};
  }
  return {valido:true, dataInicial, dataFinal, validadeFinal};
}
/* Regra específica do link PRINCIPAL do evento para Vigilantes (fluxo
   integrado desta rodada): só verifica se a validade (reciclagem + 1
   ano) cobre a DATA FINAL do evento — diferente de
   validarReciclagemParaEvento() (que também bloqueia reciclagem
   posterior à data inicial), que continua intocada e usada só no link
   específico de crachá já existente. Não reaproveitei a mesma função
   para não alterar uma regra já aprovada em outro fluxo. */
function reciclagemValidaAteFinalEvento(dataReciclagemIso, ev){
  if(!dataReciclagemIso) return false;
  const dataFinal=ev.dataFim || ev.data;
  return somaUmAnoIso(dataReciclagemIso) >= dataFinal;
}

   Cadastro central e permanente de colaboradores, independente de
   evento — identificado por CPF único. Depende da RPC
   'listar_colaboradores_banco' (authenticated) — ver observação sobre
   Supabase no relatório desta rodada; ainda não criada no banco. */
async function loadColaboradoresBanco(){
  if(!gestorUnlocked){ colaboradoresBanco=[]; return; }
  const {data,error}=await sb.rpc('listar_colaboradores_banco',{});
  if(error){ console.error(error); colaboradoresBanco=[]; return; }
  colaboradoresBanco=data||[];
}
function buscarColaboradorPorCpf(cpf){
  const norm=String(cpf||'').replace(/\D/g,'');
  return colaboradoresBanco.find(c=>String(c.cpf||'').replace(/\D/g,'')===norm) || null;
}
function filtrarColaboradoresBanco(){
  const buscaDigits=(colaboradoresBuscaCpf||colaboradoresBuscaNome).replace(/\D/g,'');
  const buscaTexto=colaboradoresBuscaNome.trim().toLowerCase();
  if(!colaboradoresBuscaNome.trim() && !colaboradoresBuscaCpf.trim()) return colaboradoresBanco;
  return colaboradoresBanco.filter(c=>{
    const matchCpf = buscaDigits && String(c.cpf||'').replace(/\D/g,'').includes(buscaDigits);
    const matchNome = buscaTexto && (c.nome||'').toLowerCase().includes(buscaTexto);
    return matchCpf || matchNome;
  });
}

   Fonte da lista de escalados: staff[] (Escala Oficial) — nunca a
   Pré-Escala. Fonte dos dados cadastrais: colaboradoresBanco (Banco
   de Colaboradores), casado por CPF. */
const CAMPOS_OBRIGATORIOS_CRACHA = ['nome','cpf','identidade','data_curso','reciclagem','numero_dpf']; // fácil de ajustar depois — sem foto, sem telefone, sem e-mail, sem data de nascimento
function statusCrachaColaborador(cadastro){
  if(!cadastro) return {completo:false, faltando:['todos os dados (colaborador ainda não preencheu o formulário)']};
  const rotulos={nome:'nome', cpf:'CPF', identidade:'identidade', data_curso:'data do curso', reciclagem:'reciclagem', numero_dpf:'Nº DPF'};
  const faltando=CAMPOS_OBRIGATORIOS_CRACHA.filter(campo=>!cadastro[campo]).map(campo=>rotulos[campo]);

function abrirJanelaImpressaoCrachas(selecionados){
  const CRACHAS_POR_PAGINA=4;
  const grupos=[];
  for(let i=0;i<selecionados.length;i+=CRACHAS_POR_PAGINA){
    grupos.push(selecionados.slice(i,i+CRACHAS_POR_PAGINA));
  }

  const conjuntoHtml=(s)=>{
    const cad=buscarColaboradorPorCpf(s.cpf);
    const nome=nomeExibicao(s.nome);
    return `
      <div class="conjunto-cracha">
        <div class="face-frente">
          <div class="frente-topo">
            <div class="frente-logo-wrap"><img class="frente-logo" src="data:image/png;base64,${LOGO_SAMSEG_BASE64}" alt="SAMSEG"></div>
            <div class="frente-foto-espaco"></div>
          </div>
          <div class="frente-titulo">SEGURANÇA EVENTUAL</div>
          <div class="frente-nome">NOME: ${escapeHtml(nome)}</div>
        </div>
        <div class="face-verso">
          <div class="verso-header">
            <div>VÁLIDO SOMENTE EM EVENTOS DA EMPRESA</div>
            <div class="verso-header-empresa">SAMSEG SEGURANÇA PRIVADA</div>
          </div>
          <div class="verso-grid">
            <div class="verso-cel"><b>IDENTIDADE:</b><span>${escapeHtml(formatIdentidadeMG(cad.identidade||''))}</span></div>
            <div class="verso-cel"><b>DATA DO CURSO</b><span>${cad.data_curso?formatDate(cad.data_curso):''}</span></div>
            <div class="verso-cel"><b>CPF:</b><span>${formatCpf(cad.cpf)}</span></div>
            <div class="verso-cel"><b>RECICLAGEM</b><span>${cad.reciclagem?formatDate(cad.reciclagem):''}</span></div>
            <div class="verso-cel verso-dpf"><b>Nº DPF:</b><span>${escapeHtml(formatNumeroDpfMG(cad.numero_dpf||''))}</span></div>
          </div>
          <div class="verso-assinatura">
            <div class="verso-assinatura-linha"></div>
            <div class="verso-responsavel">RESPONSÁVEL LEGAL</div>
          </div>
        </div>
      </div>`;
  };

  const paginasHtml=grupos.map(grupo=>`
    <div class="pagina-crachas">
      ${grupo.map(conjuntoHtml).join('')}
    </div>`).join('');

function filtrarCpfsAutorizados(){
  const buscaDigits=cpfsAutorizadosBusca.replace(/\D/g,'');
  const buscaTexto=cpfsAutorizadosBusca.trim().toLowerCase();
  return cpfsAutorizadosLista.filter(c=>{
    if(!cpfsAutorizadosBusca.trim()) return true;
    const matchCpf = buscaDigits && (c.cpf||'').includes(buscaDigits);
    const matchNome = (c.nome||'').toLowerCase().includes(buscaTexto);
    return matchCpf || matchNome;
  });
}

function attachCpfsAutorizadosHandlers(){
  const cpfInp=document.getElementById('novoCpfAut');
  const selFuncao=document.getElementById('novaFuncaoAutSelect');
  const txtFuncao=document.getElementById('novaFuncaoAutTexto');
  if(cpfInp) cpfInp.oninput=(e)=>{
    maskCpfInput(e.target);
    /* Trocar/editar o CPF nunca pode manter uma função de uma
       consulta anterior — sempre volta para "sem seleção", exigindo
       escolha manual de novo. */
    if(selFuncao) selFuncao.value='';
    if(txtFuncao){ txtFuncao.value=''; if(selFuncao) txtFuncao.style.display='none'; }
  };
  const nomeAutInp=document.getElementById('novoNomeAut');
  if(nomeAutInp) nomeAutInp.oninput=()=>{
    const pos=nomeAutInp.selectionStart;
    nomeAutInp.value=nomeAutInp.value.toUpperCase();
    nomeAutInp.setSelectionRange(pos,pos);
  };
  const buscaInp=document.getElementById('buscaCpfAutorizado');
  if(buscaInp) buscaInp.oninput=(e)=>{
    // Filtra só em memória e atualiza somente a tabela — nunca recria
    // o próprio input de busca, para não perder o foco a cada tecla.
    cpfsAutorizadosBusca=e.target.value;
    const tabela=document.getElementById('cpfsAutorizadosTabela');
    if(tabela){
      tabela.innerHTML=renderCpfsAutorizadosLista(filtrarCpfsAutorizados());
      attachCpfsAutorizadosRowHandlers();
    }
  };
  if(selFuncao && txtFuncao){
    selFuncao.onchange=()=>{ txtFuncao.style.display = selFuncao.value==='__outra__' ? '' : 'none'; };
  }
  const btnAdd=document.getElementById('btnAddCpfAut');
  if(btnAdd) btnAdd.onclick=async ()=>{
    const cpf=document.getElementById('novoCpfAut').value.trim();
    const nome=nomeExibicao(document.getElementById('novoNomeAut').value);
    /* Se existem funções cadastradas no evento (Valores por Função),
       usa o dropdown com os nomes padronizados — evita "Vigilante"
       vs "VIGILANTE " vs "vigilante" viraram funções diferentes. Só
       cai no texto livre se o gestor escolher "+ Outra função" ou se
       o evento ainda não tem nenhuma função cadastrada. */
    let funcao;
    if(selFuncao){
      funcao = selFuncao.value==='__outra__' ? txtFuncao.value.trim() : selFuncao.value;
    } else {
      funcao = txtFuncao.value.trim();
    }
    if(!cpf){ showToast('Informe o CPF.'); return; }
    if(!funcao){ showToast('Informe a função.'); return; }
    const r=await chamarRpcGestor('upsert_cpf_autorizado',{p_evento_id:currentEventId, p_cpf:cpf, p_nome:nome||null, p_funcao:funcao});
    if(r.ok){ showToast('CPF autorizado.'); await loadCpfsAutorizadosEvento(); renderShell(); }
  };
  attachCpfsAutorizadosRowHandlers();
}
function attachCpfsAutorizadosRowHandlers(){
  document.querySelectorAll('.btn-editar-cpf-aut').forEach(btn=>{
    btn.onclick=async ()=>{
      const cpf=btn.closest('tr').dataset.cpf;
      const atual=cpfsAutorizadosLista.find(c=>c.cpf===cpf);
      const novoNomeDigitado=prompt('Nome:', atual.nome||'');
      if(novoNomeDigitado===null) return;
      const novoNome=nomeExibicao(novoNomeDigitado);
      const ev=currentEvent();
      const funcoesEvento=(ev && ev.valoresFuncao)||[];
      const dicaFuncoes = funcoesEvento.length ? `\n\nFunções já cadastradas neste evento:\n${funcoesEvento.map(f=>'- '+f.funcao).join('\n')}` : '';
      const novaFuncao=prompt('Função:'+dicaFuncoes, atual.funcao||'');
      if(novaFuncao===null) return;
      if(!novaFuncao.trim()){ showToast('Função é obrigatória.'); return; }
      const r=await chamarRpcGestor('upsert_cpf_autorizado',{p_evento_id:currentEventId, p_cpf:cpf, p_nome:novoNome, p_funcao:novaFuncao.trim()});
      if(r.ok){ showToast('Autorização atualizada.'); await loadCpfsAutorizadosEvento(); renderShell(); }
    };
  });
  document.querySelectorAll('.btn-desautorizar').forEach(btn=>{
    btn.onclick=async ()=>{
      const cpf=btn.closest('tr').dataset.cpf;
      if(!confirm(`Desautorizar o CPF ${formatCpf(cpf)} neste evento? Ele não conseguirá mais confirmar participação, a menos que seja reativado depois.`)) return;
      const r=await chamarRpcGestor('desautorizar_cpf_evento',{p_evento_id:currentEventId, p_cpf:cpf});
      if(r.ok){ showToast('CPF desautorizado.'); await loadCpfsAutorizadosEvento(); renderShell(); }
    };
  });
  document.querySelectorAll('.btn-reativar').forEach(btn=>{
    btn.onclick=async ()=>{
      const cpf=btn.closest('tr').dataset.cpf;
      const r=await chamarRpcGestor('upsert_cpf_autorizado',{p_evento_id:currentEventId, p_cpf:cpf, p_nome:null, p_funcao:null});
      if(r.ok){ showToast('CPF reativado.'); await loadCpfsAutorizadosEvento(); renderShell(); }
    };
  });
  document.querySelectorAll('.btn-excluir-cpf-aut').forEach(btn=>{
    btn.onclick=async ()=>{
      const cpf=btn.closest('tr').dataset.cpf;
      const atual=cpfsAutorizadosLista.find(c=>c.cpf===cpf);
      /* Exclusão completa e em cascata (CPF Autorizado + Pré-Escala +
         Escala Oficial + Escala por Dia, e também Banco de
         Colaboradores se for Vigilante) — a decisão de permitir ou
         não fica inteiramente com a RPC no servidor, que verifica
         check-in/checkout de verdade antes de apagar qualquer coisa.
         Não há mais checagem só no cliente aqui: os arrays locais
         (interessados/staff) não têm como saber com segurança se já
         existe check-in/checkout, então bloquear por aqui só
         impediria exclusões legítimas sem proteger nada de verdade. */
      if(!confirm(`ATENÇÃO!\n\nVocê está prestes a excluir TODOS os dados deste colaborador neste evento — CPF Autorizado, Pré-Escala, Escala Oficial e Escala por Dia. Se ele for Vigilante, também será removido do Banco de Colaboradores.\n\nSó é permitido se ele ainda não tiver check-in/check-out registrado neste evento.\n\nColaborador: ${nomeExibicao(atual&&atual.nome)||'(sem nome)'}\nCPF: ${formatCpf(cpf)}\n\nEsta ação não pode ser desfeita.`)) return;
      const r=await chamarRpcGestor('excluir_colaborador_evento',{p_evento_id:currentEventId, p_cpf:cpf});
      if(r.ok){
        showToast('Cadastro excluído em todas as áreas do evento.');
        await loadCpfsAutorizadosEvento();
        await loadInteressadosForCurrent();
        await loadStaffForCurrent();
        await loadDiasEscalaPresenca();
        renderShell();
      }
    };
  });
}

async function collectPayments(){
  const finalizedEvents = events.filter(e=>e.status==='finalizado');
  const rows=[];
  for(const ev of finalizedEvents){
    const s=(await sGet('staff:'+ev.id))||[];
    s.filter(c=>c.escalado&&c.compareceu).forEach(c=>{
      rows.push({eventoId:ev.id, evento:ev.evento, cliente:ev.cliente, data:c.data, staffId:c.id, nome:c.nome, entrada:c.entrada, saida:c.saida, valor:calcValor(c,ev), pago:!!c.pago, dataPagamento:c.dataPagamento||''});
    });
  }
  return rows;
}
async function renderPagamentos(main){
  if(!gestorUnlocked){
    main.innerHTML=`<div class="page-head"><div><h2>Pagamentos</h2><div class="sub">Colaboradores com fechamento aprovado pelo gestor</div></div></div>${lockScreenHtml()}`;
    attachLockHandler(()=>renderPagamentos(main));
    return;
  }
  main.innerHTML=`<div class="empty">Carregando pagamentos...</div>`;
  const rows=await collectPayments();
  const eventosFinalizados=events.filter(e=>e.status==='finalizado');
  main.innerHTML=`
    <div class="page-head"><div><h2>Pagamentos</h2><div class="sub">Colaboradores com fechamento aprovado pelo gestor</div></div></div>
    <div class="toolbar">
      <input type="text" id="fNome" placeholder="Buscar por nome">
      <select id="fEvento"><option value="">Todos os eventos</option>${eventosFinalizados.map(e=>`<option value="${e.id}">${escapeHtml(e.evento)}</option>`).join('')}</select>
      <input type="date" id="fDe" title="De">
      <input type="date" id="fAte" title="Até">
      <div class="spacer"></div>
    </div>
    <div class="section-title">Pendentes</div>
    <div id="pendTable"></div>
    <div class="section-title">Histórico de pagamentos</div>
    <div id="pagoTable"></div>
  `;

  function applyFilters(list){
    const nome=document.getElementById('fNome').value.trim().toLowerCase();
    const eventoId=document.getElementById('fEvento').value;
    const de=document.getElementById('fDe').value;
    const ate=document.getElementById('fAte').value;
    return list.filter(r=>{
      if(nome && !r.nome.toLowerCase().includes(nome)) return false;
      if(eventoId && r.eventoId!==eventoId) return false;
      if(de && r.data && r.data<de) return false;
      if(ate && r.data && r.data>ate) return false;
      return true;
    });
  }

  function drawTables(){
    const filtered=applyFilters(rows);
    const pendentes=filtered.filter(r=>!r.pago);
    const pagos=filtered.filter(r=>r.pago);

    document.getElementById('pendTable').innerHTML = pendentes.length ? `
      <div class="add-row" style="justify-content:flex-end;">
        <button class="btn btn-teal btn-sm" id="btnPagarSelecionados">Registrar pagamento dos selecionados</button>
      </div>
      <table>
        <thead><tr><th><input type="checkbox" id="chkAll"></th><th>Nome</th><th>Evento</th><th>Cliente</th><th>Data</th><th>Valor</th><th>Status</th></tr></thead>
        <tbody>
          ${pendentes.map(r=>`
            <tr data-eventoid="${r.eventoId}" data-staffid="${r.staffId}">
              <td><input type="checkbox" class="chk-pay"></td>
              <td>${escapeHtml(nomeExibicao(r.nome))}</td>
              <td>${escapeHtml(r.evento)}</td>
              <td>${escapeHtml(r.cliente)}</td>
              <td class="mono">${r.data?formatDate(r.data):'—'}</td>
              <td class="mono">${brl(r.valor)}</td>
              <td><span class="badge pendente">Pendente</span></td>
            </tr>`).join('')}
        </tbody>
      </table>` : `<div class="empty" style="padding:20px;"><b>Nenhum pagamento pendente</b>Tudo certo com os filtros atuais.</div>`;

    document.getElementById('pagoTable').innerHTML = pagos.length ? `
      <table>
        <thead><tr><th>Nome</th><th>Evento</th><th>Data do evento</th><th>Valor</th><th>Pago em</th></tr></thead>
        <tbody>
          ${pagos.map(r=>`<tr>
            <td>${escapeHtml(nomeExibicao(r.nome))}</td><td>${escapeHtml(r.evento)}</td>
            <td class="mono">${r.data?formatDate(r.data):'—'}</td><td class="mono">${brl(r.valor)}</td>
            <td class="mono">${r.dataPagamento?formatDate(r.dataPagamento):'—'}</td></tr>`).join('')}
        </tbody>
      </table>` : `<div class="empty" style="padding:20px;"><b>Nenhum pagamento registrado ainda</b></div>`;

    const chkAll=document.getElementById('chkAll');
    if(chkAll) chkAll.onchange=(e)=>{ document.querySelectorAll('.chk-pay').forEach(c=>c.checked=e.target.checked); };

    const btnPagar=document.getElementById('btnPagarSelecionados');
    if(btnPagar) btnPagar.onclick=async ()=>{
      const selected=[...document.querySelectorAll('.chk-pay:checked')].map(c=>c.closest('tr'));
      if(!selected.length){ showToast('Selecione ao menos um colaborador.'); return; }
      const byEvent={};
      selected.forEach(tr=>{
        const eid=tr.dataset.eventoid, sid=tr.dataset.staffid;
        (byEvent[eid]=byEvent[eid]||[]).push(sid);
      });
      for(const eid in byEvent){
        const s=(await sGet('staff:'+eid))||[];
        s.forEach(c=>{ if(byEvent[eid].includes(c.id)){ c.pago=true; c.dataPagamento=todayISO(); } });
        await sSet('staff:'+eid, s);
      }
      showToast('Pagamento registrado.');
      renderPagamentos(main);
    };
  }

  document.getElementById('fNome').oninput=drawTables;
  document.getElementById('fEvento').onchange=drawTables;
  document.getElementById('fDe').onchange=drawTables;
  document.getElementById('fAte').onchange=drawTables;
  drawTables();
}

async function renderRelatorios(main){
  main.innerHTML=`<div class="empty">Carregando relatórios...</div>`;
  const monthEvents=events.filter(e=>e.data && e.data.slice(0,7)===dashMonth);
  eventStatsCache={};
  const stats=await Promise.all(monthEvents.map(e=>getEventStats(e.id)));
  const total=stats.reduce((s,st)=>s+st.valorTotal,0);
  main.innerHTML=`
    <div class="page-head"><div><h2>Relatórios</h2><div class="sub">Eventos do mês — operacional e financeiro</div></div>
      <input type="month" id="relMonth" value="${dashMonth}"></div>
    <div class="stat-grid" style="margin-bottom:20px;">
      <div class="stat-card"><div class="label">Eventos no mês</div><div class="value">${monthEvents.length}</div></div>
      <div class="stat-card"><div class="label">Total a pagar</div><div class="value">${maskValor(total)}</div></div>
    </div>
    ${monthEvents.length ? `
    <table>
      <thead><tr><th>Cliente</th><th>Evento</th><th>Data</th><th>Status</th><th>Escalados</th><th>Total</th><th></th></tr></thead>
      <tbody>
        ${monthEvents.map((e,i)=>`<tr>
          <td>${escapeHtml(e.cliente)}</td><td>${escapeHtml(e.evento)}</td><td class="mono">${formatPeriodo(e)}</td>
          <td><span class="badge ${e.status}">${e.status==='aberto'?'Em aberto':'Finalizado'}</span></td>
          <td class="mono">${stats[i].escaladosCount}</td><td class="mono">${maskValor(stats[i].valorTotal)}</td>
          <td><button class="btn btn-ghost btn-sm btn-abrir-rel" data-id="${e.id}">Abrir</button></td>
        </tr>`).join('')}
      </tbody>
    </table>` : `<div class="empty"><b>Nenhum evento neste mês</b></div>`}
  `;
  document.getElementById('relMonth').onchange=(e)=>{ dashMonth=e.target.value; renderRelatorios(main); };
  main.querySelectorAll('.btn-abrir-rel').forEach(btn=>{
    btn.onclick=async ()=>{ currentEventId=btn.dataset.id; await loadStaffForCurrent(); await loadInteressadosForCurrent(); await loadDiasEscalaPresenca(); section='evento'; subTab='aprovacao'; renderShell(); };
  });
}

/* ================= DETAIL HANDLERS ================= */
function attachDetailHandlers(){
  const linkBtn=document.getElementById('btnCopyLink');
  if(linkBtn) linkBtn.onclick=()=>copyText(eventLink(currentEventId));
  const linkBtnStatus=document.getElementById('btnCopyLinkStatus');
  if(linkBtnStatus) linkBtnStatus.onclick=()=>copyText(eventLinkStatus(currentEventId));

  const btnNewFuncaoEvento=document.getElementById('btnNewFuncaoEvento');
  if(btnNewFuncaoEvento) btnNewFuncaoEvento.onclick=()=>openFuncaoEventoForm();
  document.querySelectorAll('.btn-del-funcao-evento').forEach(btn=>{
    btn.onclick=async (e)=>{
      const nome=e.target.closest('.client-card').dataset.funcao;
      if(!confirm(`Excluir o valor de "${nome}" neste evento? Colaboradores com essa função ficarão sem valor cadastrado aqui.`)) return;
      const ev=currentEvent();
      ev.valoresFuncao=(ev.valoresFuncao||[]).filter(f=>f.funcao!==nome);
      await saveEvents();
      renderShell();
    };
  });
  const buscaFuncaoInput=document.getElementById('buscaFuncaoEvento');
  if(buscaFuncaoInput){
    /* Filtro é só manipulação de DOM (mostra/esconde cartões) — de
       propósito, sem chamar renderShell() a cada tecla, para não
       perder o foco/cursor do campo de busca enquanto o gestor digita. */
    buscaFuncaoInput.oninput=()=>{ buscaFuncaoEventoTexto=buscaFuncaoInput.value; filtrarFuncoesEvento(); };
    filtrarFuncoesEvento();
  }
  document.querySelectorAll('.input-valor-funcao-direto').forEach(inp=>{
    inp.onchange=async ()=>{
      const nome=inp.closest('.client-card').dataset.funcao;
      const ev=currentEvent();
      const entry=(ev.valoresFuncao||[]).find(f=>f.funcao===nome);
      if(!entry) return;
      const bruto=inp.value.trim();
      if(bruto===''){ entry.valorDia=null; }
      else{
        const novoValor=parseFloat(bruto);
        if(isNaN(novoValor) || novoValor<0){ showToast('Informe um valor numérico válido.'); inp.value=entry.valorDia!=null?entry.valorDia:''; return; }
        entry.valorDia=novoValor;
      }
      const r=await saveEvents();
      if(r && r.ok){ renderShell(); }
      else{ showToast('Erro ao salvar valor: '+(r && r.error && r.error.message ? r.error.message : 'tente novamente.')); }
    };
  });

  document.querySelectorAll('.btn-approve').forEach(btn=>{
    btn.onclick=async (e)=>{
      const id=e.target.closest('.interesse-row').dataset.id;
      const p=interessados.find(i=>i.id===id);
      staff.push({id:uid(), eventId:currentEventId, nome:p.nome, cpf:p.cpf||'', telefone:p.telefone||'', funcao:p.funcao||'', escalado:true, compareceu:false, data:currentEvent().data||'', entrada:'', saida:'', diasTrabalhados:1, pago:false});
      p.status='aprovado';
      await saveStaff(); await saveInteressados();
      subTab='escala';
      renderShell();
      showToast('Convocação aprovada.');
    };
  });
  document.querySelectorAll('.btn-reject').forEach(btn=>{
    btn.onclick=async (e)=>{ const id=e.target.closest('.interesse-row').dataset.id; const p=interessados.find(i=>i.id===id); p.status='recusado'; await saveInteressados(); renderShell(); };
  });

  const btnAdd=document.getElementById('btnAddStaff');
  if(btnAdd) btnAdd.onclick=async ()=>{
    const nome=document.getElementById('newNome').value.trim();
    const cpf=document.getElementById('newCpf').value.trim();
    const telefone=document.getElementById('newTelefone').value.trim();
    const funcao=document.getElementById('newFuncao').value.trim();
    if(!nome){ showToast('Informe o nome do colaborador.'); return; }
    staff.push({id:uid(), eventId:currentEventId, nome, cpf, telefone, funcao, escalado:true, compareceu:false, data:currentEvent().data||'', entrada:'', saida:'', diasTrabalhados:1, pago:false});
    await saveStaff(); renderShell(); showToast('Colaborador adicionado.');
  };
  const btnNotifyAll=document.getElementById('btnNotifyAll');
  if(btnNotifyAll) btnNotifyAll.onclick=()=>{
    const ev=currentEvent();
    const alvos=staff.filter(c=>c.telefone && c.telefone.trim());
    if(!alvos.length){ showToast('Nenhum colaborador com telefone cadastrado.'); return; }
    if(!confirm(`Isso vai abrir ${alvos.length} aba(s) do WhatsApp, uma por colaborador. Em cada uma, você só precisa clicar em "Enviar". Continuar?`)) return;
    alvos.forEach((c,i)=>{
      let numero=(c.telefone||'').replace(/\D/g,'');
      if(numero.length===10 || numero.length===11) numero='55'+numero; // adiciona DDI Brasil se a pessoa não colocou
      const texto=encodeURIComponent(`Olá ${c.nome}, você foi convocado(a) para o evento "${ev.evento}" (${formatPeriodo(ev)}). Aguardamos você!`);
      setTimeout(()=>window.open(`https://wa.me/${numero}?text=${texto}`,'_blank'), i*400);
    });
  };
  document.querySelectorAll('.chk-escalado').forEach(chk=>{
    chk.onchange=async (e)=>{ const id=e.target.closest('tr').dataset.id; const c=staff.find(s=>s.id===id); c.escalado=e.target.checked; await saveStaff(); renderShell(); };
  });
  document.querySelectorAll('.btn-remove-staff').forEach(btn=>{
    btn.onclick=async (e)=>{ const id=e.target.closest('tr').dataset.id; const c=staff.find(s=>s.id===id); if(!confirm(`Remover ${c.nome} deste evento?`)) return; staff=staff.filter(s=>s.id!==id); await saveStaff(); renderShell(); };
  });
  document.querySelectorAll('.stamp-toggle').forEach(el=>{
    el.onclick=async (e)=>{ const id=e.target.closest('tr').dataset.id; const c=staff.find(s=>s.id===id); c.compareceu=!c.compareceu; if(c.compareceu){ if(!c.data) c.data=currentEvent().data||''; if(c.diasTrabalhados==null) c.diasTrabalhados=1; } await saveStaff(); renderShell(); };
  });
  ['f-data','f-entrada','f-saida','f-dias'].forEach(cls=>{
    document.querySelectorAll('.'+cls).forEach(inp=>{
      inp.onchange=async (e)=>{ const id=e.target.closest('tr').dataset.id; const c=staff.find(s=>s.id===id); const field=cls==='f-data'?'data':cls==='f-entrada'?'entrada':cls==='f-saida'?'saida':'diasTrabalhados'; c[field]=e.target.value; await saveStaff(); renderShell(); };
    });
  });
  const btnPrint=document.getElementById('btnPrint');
  if(btnPrint) btnPrint.onclick=()=>window.print();
  const btnPrintFechamentoEvento=document.getElementById('btnPrintFechamentoEvento');
  if(btnPrintFechamentoEvento) btnPrintFechamentoEvento.onclick=()=>window.print();
  const btnVisaoFechamentoGestor=document.getElementById('btnVisaoFechamentoGestor');
  if(btnVisaoFechamentoGestor) btnVisaoFechamentoGestor.onclick=()=>{
    /* Guarda também no JS (não só o atributo disabled do HTML) — o
       bloqueio não pode ser contornado nem se o disabled falhar por
       algum motivo. */
    const ev=currentEvent();
    if(!ev || ev.status==='aberto'){
      showToast('Aprove e encerre o Fechamento Evento Presidência antes de liberar a impressão do Fechamento do Gestor.');
      return;
    }
    aprovacaoVisao='gestor'; renderShell();
  };
  const btnVisaoFechamentoPresidencia=document.getElementById('btnVisaoFechamentoPresidencia');
  if(btnVisaoFechamentoPresidencia) btnVisaoFechamentoPresidencia.onclick=()=>{ aprovacaoVisao='presidencia'; renderShell(); };
  const btnAprovar=document.getElementById('btnAprovar');
  if(btnAprovar) btnAprovar.onclick=async ()=>{
    if(!confirm('Confirma o fechamento da equipe? Após aprovar, o evento fica disponível na área de Pagamentos.')) return;
    currentEvent().status='finalizado';
    await saveEvents();
    renderShell();
    showToast('Fechamento aprovado.');
  };
  const btnReabrir=document.getElementById('btnReabrir');
  if(btnReabrir) btnReabrir.onclick=async ()=>{
    currentEvent().status='aberto';
    await saveEvents();
    renderShell();
    showToast('Evento reaberto para ajustes.');
  };
}

/* ================= INIT ================= */
loadAll();
</script>

</body>
</html>

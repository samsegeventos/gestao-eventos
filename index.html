<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samseg — Gestão de Eventos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14161c; --surface:#1c1f28; --surface-2:#23262f; --line:#333744;
    --amber:#e8a33d; --teal:#4fb3a9; --red:#e2574c; --text:#edeae3; --muted:#8b8f9b;
    --sidebar-w:230px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh;
  }
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  select,input,button,textarea{
    font-family:'Inter',sans-serif; font-size:14px; color:var(--text);
    background:var(--surface-2); border:1px solid var(--line); border-radius:7px; padding:9px 11px; outline:none;
  }
  select:focus,input:focus,textarea:focus{border-color:var(--amber);}
  .btn{cursor:pointer; font-weight:600; border:1px solid var(--line); background:var(--surface-2); color:var(--text); transition:all .15s ease; white-space:nowrap;}
  .btn:hover{border-color:var(--muted);}
  .btn-amber{background:var(--amber); color:#14161c; border-color:var(--amber);}
  .btn-amber:hover{filter:brightness(1.08);}
  .btn-teal{background:var(--teal); color:#14161c; border-color:var(--teal);}
  .btn-teal:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent;}
  .btn-danger{color:var(--red); border-color:rgba(226,87,76,0.4); background:transparent;}
  .btn-danger:hover{background:rgba(226,87,76,0.1);}
  .btn-sm{padding:6px 10px; font-size:12.5px; border-radius:6px;}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}
  .card-title{font-size:16px; font-weight:600; margin:0 0 2px;}
  .card-sub{color:var(--muted); font-size:12.5px; margin:0 0 16px;}
  .resumo-funcoes{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:10px 14px; margin-bottom:16px; font-size:12.5px; line-height:1.7;}
  .resumo-funcoes b{color:var(--text);}
  .grupo-funcao-titulo{font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:0.3px; margin:20px 0 8px; padding-bottom:6px; border-bottom:1px solid var(--line); color:var(--amber);}
  .grupo-funcao-titulo:first-of-type{margin-top:4px;}
  .grupo-funcao-count{color:var(--muted); font-weight:400; text-transform:none;}
  .linha-titulo-grupo td{background:rgba(232,163,61,0.07); font-weight:700; font-size:12.5px; text-transform:uppercase; letter-spacing:0.3px; color:var(--amber); padding:8px 10px; border-bottom:1px solid var(--line);}
  .badge{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; letter-spacing:0.4px; text-transform:uppercase; font-family:'JetBrains Mono',monospace; border:1.5px solid;}
  .badge.aberto{color:var(--amber); border-color:var(--amber); background:rgba(232,163,61,0.08);}
  .badge.finalizado{color:var(--teal); border-color:var(--teal); background:rgba(79,179,169,0.08);}
  .badge.pendente{color:var(--amber); border-color:var(--amber); background:rgba(232,163,61,0.08);}
  .badge.pago{color:var(--teal); border-color:var(--teal); background:rgba(79,179,169,0.08);}
  .empty{text-align:center; color:var(--muted); padding:40px 20px; font-size:13.5px;}
  .empty b{color:var(--text); display:block; font-family:'Space Grotesk',sans-serif; font-size:15px; margin-bottom:6px;}
  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--surface-2); border:1px solid var(--line); color:var(--text); padding:10px 18px; border-radius:8px; font-size:13px; opacity:0; transition:all .25s ease; pointer-events:none; z-index:80; max-width:90vw; text-align:center;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ---------- layout ---------- */
  .shell{display:flex; min-height:100vh;}
  .sidebar{
    width:var(--sidebar-w); flex-shrink:0; background:var(--surface); border-right:1px solid var(--line);
    padding:20px 14px; position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:4px 8px 20px; border-bottom:1px solid var(--line); margin-bottom:14px;}
  .punch-icon{width:30px;height:30px;border-radius:6px; background:var(--amber); color:#14161c; display:flex;align-items:center;justify-content:center; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12px; flex-shrink:0;}
  .brand-name{font-size:13.5px; font-weight:700; line-height:1.2;}
  .brand-sub{font-size:10.5px; color:var(--muted);}

  .nav-group{margin-bottom:6px;}
  .nav-label{font-size:10px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); padding:10px 10px 6px;}
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:7px; cursor:pointer;
    font-size:13.5px; color:var(--muted); font-weight:500; margin-bottom:2px; transition:all .12s ease;
  }
  .nav-item:hover{background:var(--surface-2); color:var(--text);}
  .nav-item.active{background:rgba(232,163,61,0.1); color:var(--amber); font-weight:600;}
  .nav-item .ic{width:16px; text-align:center; flex-shrink:0;}
  .nav-sub{margin-left:8px; padding-left:14px; border-left:1px solid var(--line); margin-bottom:8px; display:none;}
  .nav-sub.open{display:block;}
  .nav-sub .nav-item{font-size:12.5px; padding:7px 10px;}

  .main{flex:1; min-width:0; padding:26px 28px 60px;}
  .page-head{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:20px;}
  .page-head h2{font-size:20px; margin:0;}
  .page-head .sub{color:var(--muted); font-size:12.5px; margin-top:3px;}

  .mobile-topbar{display:none; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line); background:var(--surface); position:sticky; top:0; z-index:40;}
  .mobile-topbar .btn{padding:7px 10px;}

  @media(max-width:860px){
    .sidebar{position:fixed; left:0; top:0; z-index:60; transform:translateX(-100%); transition:transform .2s ease; box-shadow:0 0 40px rgba(0,0,0,0.5);}
    .sidebar.open{transform:translateX(0);}
    .mobile-topbar{display:flex;}
    .main{padding:18px 16px 60px;}
    .overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:50;}
    .overlay.show{display:block;}
  }

  /* ---------- dashboard ---------- */
  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
  .stat-card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px;}
  .stat-card .label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.4px;}
  .stat-card .value{font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:700; margin-top:6px;}
  .stat-card.amber .value{color:var(--amber);}
  .stat-card.teal .value{color:var(--teal);}
  .stat-card.red .value{color:var(--red);}
  @media(max-width:760px){.stat-grid{grid-template-columns:repeat(2,1fr);}}

  .alert-box{background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--amber); border-radius:8px; padding:12px 14px; font-size:13px; margin-bottom:8px; display:flex; justify-content:space-between; gap:10px; align-items:center; cursor:pointer;}
  .alert-box:hover{border-color:var(--muted); border-left-color:var(--amber);}
  .alert-box .n{color:var(--muted); font-size:11px; font-family:'JetBrains Mono',monospace;}

  .event-list{display:flex; flex-direction:column; gap:10px;}
  .event-card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px 18px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; cursor:pointer; transition:border-color .15s ease;}
  .event-card:hover{border-color:var(--muted);}
  .event-card .main{flex:1; min-width:180px;}
  .event-card .cliente{font-weight:600; font-size:14.5px;}
  .event-card .meta{color:var(--muted); font-size:12.5px; margin-top:2px;}
  .event-card .metrics{display:flex; gap:20px; align-items:center;}
  .event-card .metric{text-align:right;}
  .event-card .metric .l{font-size:10.5px; color:var(--muted); text-transform:uppercase;}
  .event-card .metric .v{font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:700;}
  @media(max-width:760px){.event-card{flex-direction:column; align-items:stretch;} .event-card .metrics{justify-content:space-between;}}

  .toolbar{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px;}
  .toolbar .spacer{flex:1;}

  /* ---------- evento detail ---------- */
  .event-bar{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px 18px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:18px;}
  .event-bar .info{flex:1; min-width:200px;}
  .event-bar .cliente{font-weight:600; font-size:15px;}
  .event-bar .meta{color:var(--muted); font-size:12.5px; margin-top:2px;}

  .subtabs{display:flex; gap:4px; margin-bottom:0; border-bottom:1px solid var(--line); flex-wrap:wrap;}
  .subtab{padding:10px 14px; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; user-select:none;}
  .subtab.active{color:var(--amber); border-color:var(--amber);}
  .subtab:hover:not(.active){color:var(--text);}
  .subtab .count{display:inline-block; margin-left:5px; font-size:10px; font-family:'JetBrains Mono',monospace; background:var(--surface-2); border-radius:10px; padding:1px 6px; color:var(--muted);}

  .panel{background:var(--surface); border:1px solid var(--line); border-radius:0 10px 10px 10px; padding:22px; animation:fade .18s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(3px);} to{opacity:1; transform:none;}}

  .add-row{display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; padding:14px; background:var(--surface-2); border:1px dashed var(--line); border-radius:8px; margin-bottom:18px;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.4px;}
  .field input,.field select{min-width:120px;}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  thead th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.4px; color:var(--muted); padding:8px 10px; border-bottom:1px solid var(--line); font-weight:600;}
  tbody td{padding:10px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tbody tr:hover{background:rgba(255,255,255,0.02);}
  tbody tr:last-child td{border-bottom:none;}

  /* ---- Fechamento Financeiro: visão "Por datas" (tela = impressão) ---- */
  .tabela-fechamento-datas{font-size:12.5px; font-weight:400;}
  .tabela-fechamento-datas thead th{background:#2a2a2a; color:#fff; font-weight:600; white-space:nowrap;}
  .tabela-fechamento-datas tbody td{font-weight:400; border-bottom:2px solid #333; white-space:nowrap;}
  .tabela-fechamento-datas tbody tr:last-child td{border-bottom:2px solid #333;}
  .tabela-fechamento-datas .col-assinatura{min-width:260px;}
  .folha-fechamento{margin-bottom:32px;}
  td input[type="time"],td input[type="date"],td input[type="number"],td input[type="text"]{width:100%; min-width:90px;}

  .stamp{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:20px; font-size:11.5px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; font-family:'JetBrains Mono',monospace; border:1.5px solid;}
  .stamp.on{color:var(--teal); border-color:var(--teal); background:rgba(79,179,169,0.08);}
  .stamp.off{color:var(--muted); border-color:var(--line); background:transparent;}

  .checkbox-wrap{display:flex; align-items:center; gap:8px; cursor:pointer;}
  .checkbox-wrap input{width:16px; height:16px; accent-color:var(--amber); cursor:pointer;}

  .section-title{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); margin:24px 0 10px;}
  .section-title:first-child{margin-top:0;}

  .interesse-row{display:flex; align-items:center; gap:12px; padding:10px 12px; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; margin-bottom:8px;}
  .interesse-row .who{flex:1;}
  .interesse-row .who .nome{font-weight:600; font-size:13.5px;}
  .interesse-row .who .when{color:var(--muted); font-size:11.5px;}

  .totals{margin-top:18px; display:flex; justify-content:flex-end; gap:26px; padding-top:16px; border-top:1px solid var(--line); flex-wrap:wrap;}
  .totals .item{text-align:right;}
  .totals .label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.4px;}
  .totals .value{font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700; color:var(--amber);}

  .link-box{display:flex; gap:8px; align-items:center; margin-bottom:20px; flex-wrap:wrap;}
  .link-box input{flex:1; min-width:200px; font-family:'JetBrains Mono',monospace; font-size:12px;}

  .client-card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 18px; display:flex; align-items:center; gap:14px; margin-bottom:10px; flex-wrap:wrap;}
  .client-card .main{flex:1; min-width:160px;}
  .client-card .nome{font-weight:600; font-size:14px;}
  .client-card .meta{color:var(--muted); font-size:12px; margin-top:2px;}
  .client-card.funcao-ativa{background:rgba(79,179,169,0.08); border-color:var(--teal); border-width:1.5px;}
  .client-card .funcao-ativa-badge{color:var(--teal); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; margin-top:1px;}
  .client-card.compacto{padding:6px 14px; margin-bottom:4px; gap:12px; min-height:0;}
  .client-card.compacto .nome{font-size:13px; line-height:1.3;}
  .client-card.compacto .meta{font-size:11px; margin-top:0; line-height:1.3;}
  .client-card.compacto .funcao-ativa-badge{margin-top:0; line-height:1.3;}
  .valor-funcao-wrap{display:flex; align-items:center; gap:6px; white-space:nowrap;}
  .valor-funcao-wrap .prefixo{color:var(--muted); font-size:13px;}
  .input-valor-funcao-direto{width:110px;}

  /* ---------- public interest form ---------- */
  .wrap-narrow{max-width:480px; margin:60px auto; padding:0 20px;}
  .interesse-page{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:28px;}
  .interesse-page .ev-name{font-size:20px; font-weight:700; font-family:'Space Grotesk',sans-serif;}
  .interesse-page .ev-meta{color:var(--muted); font-size:13px; margin-top:4px; margin-bottom:22px;}
  .interesse-page .field{margin-bottom:14px;}
  .interesse-page input{width:100%; padding:11px 12px;}
  .success-box{text-align:center; padding:20px 0;}
  .success-box .check{width:54px; height:54px; border-radius:50%; background:rgba(79,179,169,0.12); color:var(--teal); border:2px solid var(--teal); display:flex; align-items:center; justify-content:center; font-size:24px; margin:0 auto 16px;}
  .public-header{display:flex; align-items:center; gap:10px; justify-content:center; padding:24px 0 0;}

  @media print{
    .sidebar,.mobile-topbar,.event-bar,.subtabs,.add-row,.btn,.toolbar,.link-box{display:none !important;}
    body{background:#fff; color:#000;}
    .main{padding:0;}
    .panel{border:none; background:#fff; padding:0;}
    table{color:#000;}
    thead th,tbody td{border-color:#ccc;}
    .totals .value{color:#000;}
    .tabela-fechamento-datas thead th{background:#333 !important; color:#fff !important; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
    .tabela-fechamento-datas tbody td,.tabela-fechamento-datas tbody tr:last-child td{border-bottom:2px solid #000 !important;}
    .folha-fechamento{page-break-after:always; margin-bottom:0;}
    .folha-fechamento:last-child{page-break-after:auto;}
  }
  @page{ size: A4 landscape; margin: 10mm; }
</style>
</head>
<body>

<div class="mobile-topbar">
  <button class="btn btn-sm" id="btnMenuToggle">☰ Menu</button>
  <div style="font-weight:700; font-size:13.5px;" id="mobileTitle">Samseg</div>
</div>
<div class="overlay" id="overlay"></div>

<div class="shell" id="shell"></div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ================= VERSÃO DO SISTEMA =================
   Identificação fixa desta entrega — não recalculada pelo navegador.
   Atualizar este valor a cada nova rodada de alterações entregue. */
const APP_VERSION = '26/08/2026 14:35';

/* ================= SUPABASE ================= */
const SUPABASE_URL = 'https://npjunlaohurremzjnirt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_xNpRMz2bBwC2ffH50nfPNw_6dV8ZVv4';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ================= STORAGE HELPERS =================
   Mapeia as mesmas chaves usadas antes (events, clients, gestorPin,
   staff:<id>, interessados:<id>) para as tabelas do Supabase, sem
   precisar alterar o resto do código que já chama sGet/sSet. */
async function sGet(key){
  try{
    if(key==='events'){
      const {data,error}=await sb.from('eventos').select('id,dados');
      if(error) throw error;
      return (data||[]).map(r=>({...(r.dados||{}),id:r.id}));
    }
    if(key==='clients'||key==='gestorPin'){
      const {data,error}=await sb.from('app_kv').select('value').eq('key',key).maybeSingle();
      if(error) throw error;
      return data ? data.value : null;
    }
    if(key.startsWith('staff:')){
      const id=key.slice(6);
      const {data,error}=await sb.from('eventos').select('dados').eq('id',id).maybeSingle();
      if(error) throw error;
      return (data && data.dados && data.dados.staff) ? data.dados.staff : null;
    }
    if(key.startsWith('interessados:')){
      const id=key.slice(13);
      const {data,error}=await sb.from('interessados').select('*').eq('evento_id',id).order('id',{ascending:true});
      if(error) throw error;
      return (data||[]).map(r=>({id:String(r.id),nome:r.nome,cpf:r.cpf,telefone:r.telefone||'',funcao:r.funcao,status:r.status||'pendente',criadoEm:r.criado_em||null}));
    }
    return null;
  }catch(e){ console.error(e); return null; }
}
async function sSet(key,value){
  try{
    if(key==='events'){
      const ids=(value||[]).map(e=>e.id);
      let staffMap={};
      if(ids.length){
        const {data:existing,error:exErr}=await sb.from('eventos').select('id,dados').in('id',ids);
        if(exErr) throw exErr;
        (existing||[]).forEach(r=>{ if(r.dados && r.dados.staff) staffMap[r.id]=r.dados.staff; });
      }
      const rows=(value||[]).map(e=>{
        const dados={...e};
        if(staffMap[e.id]) dados.staff=staffMap[e.id]; // preserva a equipe já salva, que não vive no objeto local do evento
        return {id:e.id,dados};
      });
      if(rows.length){ const {error}=await sb.from('eventos').upsert(rows); if(error) throw error; }
      const idsQuoted=ids.map(id=>`"${id}"`);
      const del = idsQuoted.length ? sb.from('eventos').delete().not('id','in',`(${idsQuoted.join(',')})`) : sb.from('eventos').delete().neq('id','__none__');
      const {error:delErr}=await del;
      if(delErr) throw delErr;
      return {ok:true};
    }
    if(key==='clients'||key==='gestorPin'){
      const {error}=await sb.from('app_kv').upsert({key,value});
      if(error) throw error;
      return {ok:true};
    }
    if(key.startsWith('staff:')){
      const id=key.slice(6);
      const {data}=await sb.from('eventos').select('dados').eq('id',id).maybeSingle();
      const dados=(data && data.dados) ? data.dados : {};
      dados.staff=value;
      const {error}=await sb.from('eventos').upsert({id,dados});
      if(error) throw error;
      return {ok:true};
    }
    if(key.startsWith('interessados:')){
      const id=key.slice(13);
      const {error:delErr}=await sb.from('interessados').delete().eq('evento_id',id);
      if(delErr) throw delErr;
      if(value && value.length){
        const rows=value.map(p=>({evento_id:id,nome:p.nome,cpf:p.cpf,telefone:p.telefone||'',funcao:p.funcao,status:p.status||'pendente'}));
        const {error}=await sb.from('interessados').insert(rows);
        if(error) throw error;
      }
      return {ok:true};
    }
    return {ok:false, error:{message:'Chave de armazenamento desconhecida: '+key}};
  }catch(e){
    console.error(e);
    /* Mantido: aviso genérico para quem ainda não trata o retorno
       (comportamento inalterado nas demais telas). Além disso, agora
       o erro real é devolvido no objeto de retorno, para quem quiser
       mostrá-lo (usado por saveEvents()/openEventForm agora). */
    showToast('Falha ao salvar. Tente novamente.');
    return {ok:false, error:e};
  }
}
function uid(){ return Math.random().toString(36).slice(2,9); }

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatDate(d){ if(!d) return '—'; const [y,m,day]=d.split('-'); return `${day}/${m}/${y}`; }
function formatPeriodo(e){ if(!e) return '—'; if(e.dataFim && e.dataFim!==e.data) return `${formatDate(e.data)} – ${formatDate(e.dataFim)}`; return formatDate(e.data); }
function todayISO(){

     o sistema já considere "hoje" o dia seguinte e expire links
     um dia antes da hora local. */
  const d=new Date();

const DIAS_SEMANA_PT = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
/* ================= AGRUPAMENTO POR FUNÇÃO (só exibição) =================
   Usado em CPFs Autorizados, Pré-Escala, Escala Oficial, Escala &
   Horário por Dia e Checkout por Dia. Não altera nenhum dado — só
   organiza como a mesma lista já carregada é desenhada na tela. A
   ordem dos grupos segue a ordem cadastrada em "Valores por Função"
   deste evento; funções que não estão lá (ex: evento antigo, ou
   função digitada livre em CPFs Autorizados) vão depois, em ordem
   alfabética, sem serem misturadas com as demais. */
function agruparPorFuncao(lista, getFuncao, getNome){
  const ev=currentEvent();
  const ordemEvento=((ev && ev.valoresFuncao)||[]).map(f=>normalizaFuncaoDisplay(f.funcao));
  const grupos={};
  lista.forEach(item=>{
    const norm=normalizaFuncaoDisplay(getFuncao(item)) || 'SEM FUNÇÃO INFORMADA';
    if(!grupos[norm]) grupos[norm]=[];
    grupos[norm].push(item);
  });
  const chaves=Object.keys(grupos);
  chaves.sort((a,b)=>{
    const ia=ordemEvento.indexOf(a), ib=ordemEvento.indexOf(b);
    if(ia!==-1 && ib!==-1) return ia-ib;
    if(ia!==-1) return -1;
    if(ib!==-1) return 1;
    return a.localeCompare(b,'pt-BR');
  });
  return chaves.map(funcao=>{
    const itens=grupos[funcao];
    /* Dentro da mesma função, ordena por nome — só depois disso a
       numeração (1, 2, 3...) é calculada por quem consome o grupo. */
    if(getNome) itens.sort((a,b)=>(getNome(a)||'').localeCompare(getNome(b)||'','pt-BR'));
    return {funcao, itens};
  });
}
/* Achata os grupos numa única lista, na ordem função→nome, com a
   numeração já calculada e reiniciada a cada função — para ser
   desenhada em UMA ÚNICA <table>/lista contínua (uma tabela por grupo
   fazia cada uma calcular a largura das colunas de forma independente,
   desalinhando entre grupos de nomes/funções de tamanhos diferentes). */
function achatarGruposNumerados(grupos){
  const linhas=[];
  grupos.forEach(g=>{ g.itens.forEach((item,i)=>{ linhas.push({item, numero:i+1, funcao:g.funcao}); }); });
  return linhas;
}
function normalizaFuncaoDisplay(f){ return (f||'').trim().toUpperCase().replace(/\s+/g,' '); }
function renderResumoQuantidadesFuncao(grupos){
  if(!grupos.length) return '';
  const total=grupos.reduce((s,g)=>s+g.itens.length,0);
  return `<div class="resumo-funcoes"><b>Resumo:</b> ${grupos.map(g=>`${escapeHtml(g.funcao)}: ${g.itens.length}`).join(' &nbsp;|&nbsp; ')} &nbsp;|&nbsp; <b>Total geral: ${total} colaborador${total!==1?'es':''}</b></div>`;
}
/* ================= AGRUPAMENTO POR FUNÇÃO PRINCIPAL (só exibição) =================
   "VIGILANTE" e "VIGILANTE LÍDER DE EQUIPE" caem no MESMO bloco visual
   "VIGILANTE" — nunca dois blocos separados. Dentro do bloco: líderes
   primeiro (ordem alfabética entre si), depois os demais colaboradores
   em ordem alfabética. A contagem do bloco inclui líderes. Usado em
   CPFs Autorizados, Pré-Escala, Escala Oficial, Escala & Horário por
   Dia, Checkout por Dia e Fechamento Financeiro. A ordem dos blocos
   segue ORDEM_OFICIAL_FUNCOES_BASE (fixa), não a ordem cadastrada no
   evento nem ordem alfabética — assim eventos antigos e novos mostram
   os blocos sempre na mesma ordem. Funções fora dessa lista oficial
   (cadastradas manualmente) vêm depois, em ordem alfabética entre si.
   Nada disso altera dado nenhum — só como a mesma lista já carregada
   é desenhada. */
function agruparPorFuncaoPrincipal(lista, getFuncao, getNome){
  const grupos={};
  lista.forEach(item=>{
    const norm=normalizaFuncaoDisplay(getFuncao(item)) || 'SEM FUNÇÃO INFORMADA';
    const base=baseDaFuncaoDisplay(norm);
    if(!grupos[base]) grupos[base]=[];
    grupos[base].push(item);
  });
  const chaves=Object.keys(grupos);
  chaves.sort((a,b)=>{
    const ia=ORDEM_OFICIAL_FUNCOES_BASE.indexOf(a), ib=ORDEM_OFICIAL_FUNCOES_BASE.indexOf(b);
    if(ia!==-1 && ib!==-1) return ia-ib;
    if(ia!==-1) return -1;
    if(ib!==-1) return 1;
    return a.localeCompare(b,'pt-BR');
  });
  return chaves.map(base=>{
    const itens=grupos[base];
    itens.sort((a,b)=>{
      const na=normalizaFuncaoDisplay(getFuncao(a)), nb=normalizaFuncaoDisplay(getFuncao(b));
      const aLider=na!==base, bLider=nb!==base;
      if(aLider!==bLider) return aLider?-1:1;
      return (getNome(a)||'').localeCompare(getNome(b)||'','pt-BR');
    });
    return {funcao:base, itens};
  });
}
/* Desenha os grupos dentro de UMA ÚNICA <table> (cabeçalho aparece só
   uma vez) — cada grupo vira uma linha de título (colspan cobrindo
   todas as colunas) seguida das linhas normais dos colaboradores.
   Continuar na mesma tabela é o que garante que nomes/funções de
   tamanhos diferentes entre grupos não desalinhem as colunas. */
function linhasComTituloDeGrupo(grupos, colspan, renderLinha){
  return grupos.map(g=>`
    <tr class="linha-titulo-grupo"><td colspan="${colspan}">${escapeHtml(g.funcao)} — ${g.itens.length} colaborador${g.itens.length!==1?'es':''}</td></tr>
    ${g.itens.map((item,i)=>renderLinha(item,i+1)).join('')}
  `).join('');
}
function formatarDataComDiaSemana(dataIso){
  /* Data local (T00:00:00, sem 'Z') — evita que o dia da semana saia
     errado por causa de conversão UTC, mesmo raciocínio já usado em
     todayISO()/brToIso(). */
  if(!dataIso) return '';
  const dt=new Date(dataIso+'T00:00:00');
  if(isNaN(dt.getTime())) return formatDate(dataIso);
  return `${DIAS_SEMANA_PT[dt.getDay()]} — ${formatDate(dataIso)}`;
}
function brToIso(br){
  if(!br) return null;
  let raw=br.trim();
  /* Aceita 8 dígitos corridos sem barra (ex: 25082026), como se já
     viesse formatado — só quando não há nenhuma barra/hífen digitada,
     para não interferir com datas já separadas normalmente. */
  if(!/[\/\-]/.test(raw)){
    const somenteDigitos=raw.replace(/\D/g,'');
    if(somenteDigitos.length===8) raw=`${somenteDigitos.slice(0,2)}/${somenteDigitos.slice(2,4)}/${somenteDigitos.slice(4,8)}`;
  }
  const parts=raw.split(/[\/\-]/);
  if(parts.length!==3) return null;
  let [d,m,y]=parts;
  if(d.length>2 && y.length<=2){ const t=d; d=y; y=t; } // aceita AAAA-MM-DD digitado por engano
  d=d.padStart(2,'0'); m=m.padStart(2,'0');
  if(y.length===2) y='20'+y;
  if(y.length!==4 || d.length!==2 || m.length!==2) return null;
  const iso=`${y}-${m}-${d}`;
  const dt=new Date(iso+'T00:00:00');
  if(isNaN(dt.getTime())) return null;
  /* new Date() faz "rollover" silencioso de datas impossíveis (ex:
     31/02 vira 03/03) em vez de recusar — por isso confere se o que
     voltou bate exatamente com o que foi digitado, incluindo o caso de
     29/02 fora de ano bissexto. */
  if(dt.getFullYear()!==Number(y) || dt.getMonth()!==Number(m)-1 || dt.getDate()!==Number(d)) return null;
  return iso;
}
function askDate(mensagem, isoDefault){
  let br = prompt(mensagem, isoDefault?isoToBr(isoDefault):'');
  if(br===null) return undefined; // cancelado
  if(br.trim()===''){
    if(isoDefault) return isoDefault;
    return askDate('Data inválida ou vazia. Use o formato DD/MM/AAAA:\n'+mensagem, isoDefault);
  }
  const iso=brToIso(br);
  if(!iso) return askDate('Data inválida. Use o formato DD/MM/AAAA (ex: 05/08/2026):\n'+mensagem, isoDefault);
  return iso;
}
/* Aceita horário digitado sem os dois-pontos (ex: "2000" -> "20:00"),
   já que os campos de horário do evento ainda são prompt() nativos do
   navegador (sem oninput possível) — ver observação no resumo final
   sobre a limitação real disso comparado a uma máscara ao vivo. */
function normalizarHora(str){
  if(!str) return str;
  const raw=str.trim();
  if(!raw.includes(':')){
    const d=raw.replace(/\D/g,'');
    if(d.length===4) return `${d.slice(0,2)}:${d.slice(2,4)}`;
  }
  return raw;
}
function calcHoras(entrada,saida){ if(!entrada||!saida) return 0; const [eh,em]=entrada.split(':').map(Number); const [sh,sm]=saida.split(':').map(Number); let mins=(sh*60+sm)-(eh*60+em); if(mins<0) mins+=24*60; return mins/60; }
function getFuncaoRateForEvent(ev, funcao){ if(!ev || !ev.valoresFuncao) return 0; const f=ev.valoresFuncao.find(t=>t.funcao.toLowerCase()===(funcao||'').toLowerCase()); return f ? (parseFloat(f.valorDia)||0) : 0; }
function calcValor(c, ev){ if(!c.compareceu) return 0; const dias=parseFloat(c.diasTrabalhados)||0; return getFuncaoRateForEvent(ev, c.funcao)*dias; }
function brl(n){ return 'R$ '+(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function maskValor(n){ return gestorUnlocked ? brl(n) : '•••••'; }

function isPublicMode(){ return (paramModo==='interesse' || paramModo==='status') && !!paramEvento; }
async function loadAll(){
  const {data:{session}} = await sb.auth.getSession();
  gestorUnlocked = !!session;
  /* Reage a login/logout só quando NÃO estamos num modo público — os
     links de interesse/status são renderizados uma vez e não dependem
     de sessão, então não devem ser re-renderizados por isso. */
  sb.auth.onAuthStateChange((_evt, sess)=>{
    gestorUnlocked = !!sess;
    if(!isPublicMode()){
      if(gestorUnlocked) renderShell(); else renderLoginScreen();
    }
  });
  events = (await sGet('events')) || [];
  events.forEach(e=>{
    if(!e.status) e.status='aberto';
    /* PROPOSITALMENTE não preenchemos mais "if(!e.dataFim) e.dataFim=e.data"
       aqui. Essa linha mascarava qualquer perda real de dataFim vinda do
       banco, fazendo um evento de vários dias aparecer silenciosamente
       como se fosse de 1 dia só, sem nenhum aviso — e não havia como
       distinguir "eventos antigos sem esse campo" de uma perda real.
       Todo evento salvo por openEventForm() já grava dataFim de forma
       explícita (inclusive igual a "data" quando é mesmo de 1 dia só),
       então esse preenchimento automático nunca deveria ser necessário
       no fluxo atual. formatPeriodo() e openEventForm() já tratam
       dataFim ausente sem quebrar, então não há risco em deixar de
       preencher aqui. */
    if(!e.linkValidoAte) e.linkValidoAte = e.dataFim || e.data;
    if(!e.valoresFuncao) e.valoresFuncao = [];
  });
  clients = (await sGet('clients')) || [];

  /* Modos públicos são identificados e tratados ANTES de qualquer
     verificação de sessão — link de interesse e link de status nunca
     exigem login do funcionário. */
  if(paramModo==='interesse' && paramEvento){
    currentEventId = paramEvento;
    renderPublic();
    return;
  }
  if(paramModo==='status' && paramEvento){
    currentEventId = paramEvento;
    renderPublicStatus();
    return;
  }

  /* Fora dos modos públicos, o painel administrativo exige sessão. */
  if(!gestorUnlocked){
    renderLoginScreen();
    return;
  }

  renderShell();
}

async function loadDiasEscalaPresenca(){
  if(!currentEventId){ eventoDias=[]; participacoesNovas=[]; escalaDias=[]; presencasNovas=[]; fechamentoDados=[]; return; }
  const {data:dias,error:errDias}=await sb.from('evento_dias').select('*').eq('evento_id',currentEventId).order('data',{ascending:true});
  if(errDias) console.error('Erro ao consultar evento_dias:', errDias);
  ultimoErroEventoDias = errDias ? (errDias.message||'erro desconhecido') : null;
  eventoDias=dias||[];
  if(diaSelecionadoPresenca==null && eventoDias.length) diaSelecionadoPresenca=eventoDias[0].id;
  if(!gestorUnlocked){ participacoesNovas=[]; escalaDias=[]; presencasNovas=[]; fechamentoDados=[]; return; }
  try{
    const [{data:parts,error:e1},{data:esc,error:e2},{data:pres,error:e3},{data:fech,error:e4}]=await Promise.all([
      sb.rpc('listar_participacoes_evento',{p_evento_id:currentEventId}),
      sb.rpc('listar_escala_evento',{p_evento_id:currentEventId}),
      sb.rpc('listar_presencas_evento',{p_evento_id:currentEventId}),
      sb.rpc('fechamento_evento',{p_evento_id:currentEventId})
    ]);
    if(e1) throw e1; if(e2) throw e2; if(e3) throw e3; if(e4) throw e4;
    participacoesNovas=parts||[]; escalaDias=esc||[]; presencasNovas=pres||[]; fechamentoDados=fech||[];
  }catch(err){
    console.error(err);
    participacoesNovas=[]; escalaDias=[]; presencasNovas=[]; fechamentoDados=[];
  }
}

/* Autenticação real do gestor via Supabase Auth (substitui o PIN
   client-side em app_kv). O ponto de entrada na navegação não muda —
   continua sendo o mesmo item "Modo Gestor"/attachLockHandler; só o
   que acontece por trás é diferente agora. */
async function tryUnlockGestor(){
  if(gestorUnlocked) return true;
  const email = prompt('E-mail do gestor:');
  if(!email || !email.trim()) return false;
  const senha = prompt('Senha:');
  if(!senha) return false;
  const {data,error} = await sb.auth.signInWithPassword({email:email.trim(), password:senha});
  if(error){ showToast('Login inválido: '+error.message); return false; }
  gestorUnlocked = !!(data && data.session);
  if(gestorUnlocked){ showToast('Área do gestor desbloqueada.'); await loadDiasEscalaPresenca(); }
  else showToast('Não foi possível entrar.');
  return gestorUnlocked;
}

async function getEventStats(id){
  if(eventStatsCache[id]) return eventStatsCache[id];
  const ev=events.find(e=>e.id===id);
  const s=(await sGet('staff:'+id))||[]; const it=(await sGet('interessados:'+id))||[];
  const escaladosCount=s.filter(c=>c.escalado).length;
  const valorTotal=s.filter(c=>c.escalado&&c.compareceu).reduce((sum,c)=>sum+calcValor(c,ev),0);
  const semFechamento = s.filter(c=>c.escalado).length===0;
  const pendentesPagamento = s.filter(c=>c.escalado&&c.compareceu&&!c.pago).length;
  const stats={escaladosCount,valorTotal,interessadosCount:it.filter(p=>(p.status||'pendente')==='pendente').length,semFechamento,pendentesPagamento};
  eventStatsCache[id]=stats; return stats;
}

        <div class="ev-meta">${ev.dataFim && ev.dataFim!==ev.data ? `Data do evento: ${formatDate(ev.data)} a ${formatDate(ev.dataFim)}` : `Data do evento: ${formatDate(ev.data)}`}</div>

        <div class="field">
          <label style="font-size:11px;color:var(--muted);text-transform:uppercase;">CPF</label>
          <input
            type="text"
            id="intCpf"
            placeholder="000.000.000-00"
            maxlength="14"
          >
        </div>

        <button
          class="btn btn-amber"
          id="btnVerificarCpf"
          style="width:100%;padding:12px;"
        >
          Verificar CPF
        </button>

        <div id="resultadoAutorizacao" style="margin-top:16px;"></div>

      </div>
    </div>
  `;

  document.getElementById('btnVerificarCpf').onclick=async ()=>{

    const cpf=document.getElementById('intCpf').value.trim();

    if(!cpf){
      showToast('Informe seu CPF.');
      return;
    }

    const cpfLimpo=cpf.replace(/\D/g,'');

    if(cpfLimpo.length!==11){
      showToast('Informe um CPF válido.');
      return;
    }

    const btn=document.getElementById('btnVerificarCpf');
    const resultado=document.getElementById('resultadoAutorizacao');

    btn.disabled=true;
    btn.textContent='Verificando...';

    try{

      const {data,error}=await sb.rpc(
        'verificar_cpf_autorizado',
        {
          p_evento_id: ev.id,
          p_cpf: cpfLimpo
        }
      );

      if(error) throw error;

      const registro=Array.isArray(data) ? data[0] : data;

      if(!registro || registro.autorizado!==true){

        resultado.innerHTML=`
          <div class="empty">
            <b>CPF não autorizado</b><br>
            Este CPF não está autorizado para trabalhar neste evento.
            Entre em contato com o responsável pelo evento.
          </div>
        `;

        btn.disabled=false;
        btn.textContent='Verificar CPF';
        return;
      }

      resultado.innerHTML=`
        <div class="success-box">
          <div class="check">✓</div>
          <div class="ev-name">CPF autorizado</div>
          <div class="ev-meta" style="margin-top:10px;"><b>Função autorizada:</b> ${escapeHtml(registro.funcao || '')}</div>
          <div class="field" style="margin-top:16px; text-align:left;">
            <label style="font-size:11px;color:var(--muted);text-transform:uppercase;">Nome completo</label>
            <input type="text" id="intNome" value="${escapeHtml(registro.nome||'')}" placeholder="Seu nome completo">
          </div>
          <div class="field" style="text-align:left;">
            <label style="font-size:11px;color:var(--muted);text-transform:uppercase;">Celular/WhatsApp (obrigatório a cada evento)</label>
            <input type="text" id="intTelefone" placeholder="(00) 0 0000-0000" inputmode="numeric" maxlength="16">
          </div>
          <button class="btn btn-amber" id="btnConfirmarParticipacao" style="width:100%;padding:12px;margin-top:10px;">Confirmar participação</button>
          <div id="erroParticipacao" style="margin-top:10px;color:var(--red);font-size:12.5px;"></div>
        </div>
      `;

      btn.style.display='none';

      const intTelefoneEl=document.getElementById('intTelefone');
      intTelefoneEl.oninput=()=>maskTelefoneInput(intTelefoneEl);

      document.getElementById('btnConfirmarParticipacao').onclick=async ()=>{
        const nome=document.getElementById('intNome').value.trim();
        const telefoneDigits=document.getElementById('intTelefone').value.replace(/\D/g,'');
        const erroBox=document.getElementById('erroParticipacao');
        const btnConfirmar=document.getElementById('btnConfirmarParticipacao');
        if(telefoneDigits.length!==11){ erroBox.textContent='Informe um telefone celular válido.'; return; }
        btnConfirmar.disabled=true; btnConfirmar.textContent='Enviando...';
        try{
          const {data:pdata,error:perror}=await sb.rpc('registrar_participacao',{
            p_evento_id: ev.id, p_cpf: cpfLimpo, p_nome: nome, p_telefone: telefoneDigits
          });
          if(perror) throw perror;
          /* Alimenta a Pré-Escala existente (tabela "interessados"), sem
             duplicar: só insere se ainda não houver um registro deste
             CPF neste evento. Inserção direta e pontual (não usa
             sSet/saveInteressados, que apaga e reinsere TODA a lista do
             evento — inadequado aqui, pois rodaria sem o restante da
             lista carregado e apagaria decisões já tomadas pelo gestor). */
          try{
            const {data:existente,error:exErr}=await sb.from('interessados')
              .select('id').eq('evento_id', ev.id).eq('cpf', cpfLimpo).maybeSingle();
            if(exErr) throw exErr;
            if(!existente){
              const {error:insErr}=await sb.from('interessados').insert({
                evento_id: ev.id, nome, cpf: cpfLimpo, telefone: telefoneDigits, funcao: registro.funcao||'', status:'pendente'
              });
              if(insErr) throw insErr;
            }
          }catch(preEscalaErr){
            /* Não bloqueia a confirmação do funcionário por causa disso;
               só registra no console para investigação do gestor. */
            console.error('Falha ao registrar na Pré-Escala:', preEscalaErr);
          }
          renderPublic(true);
        }catch(err){
          console.error(err);
          erroBox.textContent = err.message || 'Não foi possível confirmar sua participação. Tente novamente.';
          btnConfirmar.disabled=false; btnConfirmar.textContent='Confirmar participação';
        }
      };

    }catch(error){

      console.error(error);

      resultado.innerHTML=`
        <div class="empty">
          <b>Não foi possível verificar o CPF.</b><br>
          Tente novamente.
        </div>
      `;

      btn.disabled=false;
      btn.textContent='Verificar CPF';
    }
  };
}

function renderPublicStatus(){
  document.querySelector('.mobile-topbar').style.display='none';
  const root=document.getElementById('shell');
  const ev=currentEvent();
  if(!ev){
    root.innerHTML=`<div class="wrap-narrow"><div class="interesse-page"><div class="empty"><b>Evento não encontrado</b>O link pode estar incorreto ou o evento foi removido.</div></div></div>`;
    return;
  }
  function draw(resultHtml){
    root.innerHTML=`
      <div class="wrap-narrow">
        <div class="interesse-page">
          <div class="ev-name">${escapeHtml(ev.evento)}</div>
          <div class="ev-meta">Consulta de status da convocação</div>
          <div class="field"><label style="font-size:11px; color:var(--muted); text-transform:uppercase;">CPF usado na candidatura</label><input type="text" id="statCpf" placeholder="000.000.000-00"></div>
          <button class="btn btn-amber" id="btnConsultarStatus" style="width:100%; padding:12px;">Consultar</button>
          ${resultHtml||''}
        </div>
      </div>`;
    document.getElementById('btnConsultarStatus').onclick=async ()=>{
      const cpf=document.getElementById('statCpf').value.trim();
      if(!cpf){ showToast('Informe o CPF.'); return; }
      const onlyDigits=s=>(s||'').replace(/\D/g,'');
      const list=(await sGet('interessados:'+currentEventId))||[];
      const found=list.filter(p=>onlyDigits(p.cpf)===onlyDigits(cpf)).pop();
      if(!found){
        draw(`<div class="empty" style="padding-top:20px;"><b>CPF não encontrado</b>Confira se digitou certo ou se já registrou interesse neste evento.</div>`);
        return;
      }
      const status=found.status||'pendente';
      const info = status==='aprovado'
        ? {cor:'var(--teal)', titulo:'Convocação aprovada!', msg:'Você foi confirmado para este evento. Aguarde as orientações do supervisor.'}
        : status==='recusado'
          ? {cor:'var(--red)', titulo:'Convocação não confirmada', msg:'Neste evento sua candidatura não foi aprovada. Fique atento a próximos eventos.'}
          : {cor:'var(--amber)', titulo:'Aguardando avaliação', msg:'Sua candidatura ainda está em análise pelo supervisor.'};
      draw(`<div class="success-box" style="padding-top:20px;"><div class="ev-name" style="color:${info.cor};">${info.titulo}</div><div class="ev-meta" style="margin-bottom:0;">${info.msg}</div></div>`);
    };
  }
  draw();
}

/* ================= LOGIN (acesso ao painel administrativo) =================
   Único ponto de entrada do painel quando não há sessão. Não é usado nos
   modos públicos (?modo=interesse / ?modo=status), que continuam sem login. */
function renderLoginScreen(){
  document.querySelector('.mobile-topbar').style.display='none';
  const root=document.getElementById('shell');
  root.innerHTML=`
    <div class="wrap-narrow">
      <div class="interesse-page">
        <div class="ev-name">Samseg — Gestão de Eventos</div>
        <div class="ev-meta">Acesso restrito ao gestor</div>
        <div class="field" style="text-align:left;">
          <label style="font-size:11px;color:var(--muted);text-transform:uppercase;">E-mail</label>
          <input type="email" id="loginEmail" placeholder="seuemail@exemplo.com" autocomplete="username">
        </div>
        <div class="field" style="text-align:left;">
          <label style="font-size:11px;color:var(--muted);text-transform:uppercase;">Senha</label>
          <input type="password" id="loginSenha" placeholder="Sua senha" autocomplete="current-password">
        </div>
        <button class="btn btn-amber" id="btnLoginSubmit" style="width:100%;padding:12px;">Entrar</button>
        <div id="loginErro" style="margin-top:10px;color:var(--red);font-size:12.5px;"></div>
        <div style="margin-top:16px;font-size:11px;color:var(--muted);">Versão: ${APP_VERSION}</div>
      </div>
    </div>
  `;
  const btn=document.getElementById('btnLoginSubmit');
  const erro=document.getElementById('loginErro');
  const submit=async ()=>{
    const email=document.getElementById('loginEmail').value.trim();
    const senha=document.getElementById('loginSenha').value;
    erro.textContent='';
    if(!email || !senha){ erro.textContent='Informe e-mail e senha.'; return; }
    btn.disabled=true; btn.textContent='Entrando...';
    const {data,error}=await sb.auth.signInWithPassword({email,password:senha});
    if(error){
      erro.textContent = error.message==='Invalid login credentials' ? 'E-mail ou senha inválidos.' : (error.message||'Não foi possível entrar.');
      btn.disabled=false; btn.textContent='Entrar';
      return;
    }
    gestorUnlocked = !!(data && data.session);
    if(gestorUnlocked){ renderShell(); }
    else { erro.textContent='Não foi possível entrar.'; btn.disabled=false; btn.textContent='Entrar'; }
  };
  btn.onclick=submit;
  document.getElementById('loginSenha').addEventListener('keydown',(e)=>{ if(e.key==='Enter') submit(); });
}

function attachSidebarHandlers(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick=async ()=>{
      const nav=el.dataset.nav;
      if(nav==='evento'){
        subTab=el.dataset.sub; section='evento';
        /* Mesma lógica de recarregamento usada pelo clique nas sub-abas
           do topo — sem isso, entrar direto por aqui (sidebar) podia
           mostrar dados desatualizados ou vazios (ex: Aprovação do
           Gestor sem ter passado antes por Fechamento). */
        if(['escalaDias','checkoutDias','fechamentoNovo','aprovacao'].includes(subTab)) await loadDiasEscalaPresenca();
        if(subTab==='cpfsAutorizados') await loadCpfsAutorizadosEvento();

      renderShell();

    document.getElementById('sidebar').classList.add('open');

  };

  if(gestorToggle) gestorToggle.onclick=async ()=>{
    await lockGestor();

function closeMobileMenu(){
  const sb=document.getElementById('sidebar'); if(sb) sb.classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

async function renderMain(){
  const main=document.getElementById('mainArea');

  if(section==='eventos') return renderEventos(main);

  if(section==='relatorios') return renderRelatorios(main);
}

/* ================= DASHBOARD ================= */
async function renderDashboard(main){
  main.innerHTML=`<div class="empty">Carregando painel...</div>`;
  const monthEvents = events.filter(e=>e.data && e.data.slice(0,7)===dashMonth);
  eventStatsCache={};
  const stats = await Promise.all(monthEvents.map(e=>getEventStats(e.id)));
  const abertos = monthEvents.filter(e=>e.status==='aberto');
  const finalizados = monthEvents.filter(e=>e.status==='finalizado');
  const totalReceber = 0; // reservado para módulo de contrato/faturamento (não modelado ainda)
  const totalPagar = stats.reduce((s,st)=>s+st.valorTotal,0);

  const semFechamento = monthEvents.filter((e,i)=>stats[i].semFechamento && e.status==='aberto');
  const pagamentosPendentes = monthEvents.filter((e,i)=>e.status==='finalizado' && stats[i].pendentesPagamento>0);
  const proximosEventos = events.filter(e=>e.data >= todayISO()).sort((a,b)=>a.data<b.data?-1:1).slice(0,5);

  main.innerHTML=`
    <div class="page-head">
      <div><h2>Dashboard</h2><div class="sub">Resumo operacional e financeiro</div></div>
      <input type="month" id="monthPicker" value="${dashMonth}">
    </div>

    <div class="stat-grid">
      <div class="stat-card amber"><div class="label">Eventos em Aberto</div><div class="value">${abertos.length}</div></div>
      <div class="stat-card"><div class="label">Valor a Pagar (mês)</div><div class="value">${maskValor(totalPagar)}</div></div>
      <div class="stat-card teal"><div class="label">Eventos Finalizados</div><div class="value">${finalizados.length}</div></div>
      <div class="stat-card"><div class="label">Total de Eventos</div><div class="value">${monthEvents.length}</div></div>
    </div>

    <div class="section-title" style="margin-top:26px;">Alertas</div>
    <div id="alertBox"></div>

    <div class="section-title">Eventos em aberto neste mês</div>
    <div class="event-list" id="eventList"></div>
  `;

  const alertBox=document.getElementById('alertBox');
  let alertsHtml='';
  if(semFechamento.length) alertsHtml+=`<div class="alert-box" data-jump="eventos">Eventos sem fechamento da equipe <span class="n">${semFechamento.length}</span></div>`;
  if(pagamentosPendentes.length) alertsHtml+=`<div class="alert-box" data-jump="pagamentos">Eventos com pagamentos pendentes <span class="n">${pagamentosPendentes.length}</span></div>`;
  if(proximosEventos.length) alertsHtml+=`<div class="alert-box" data-jump="eventos">Eventos próximos da realização <span class="n">${proximosEventos.length}</span></div>`;
  alertBox.innerHTML = alertsHtml || `<div class="card-sub" style="margin-bottom:0;">Nenhum alerta no momento.</div>`;
  alertBox.querySelectorAll('.alert-box').forEach(el=>{
    el.onclick=()=>{ section=el.dataset.jump; renderShell(); };
  });

  const list=document.getElementById('eventList');
  if(abertos.length){
    list.innerHTML = abertos.map((e,i)=>eventCardHtml(e, eventStatsCache[e.id])).join('');
    attachEventCardHandlers(list);
  } else {
    list.innerHTML = `<div class="empty"><b>Nenhum evento em aberto neste mês</b>Escolha outro mês ou cadastre um novo evento em "Eventos".</div>`;
  }
  document.getElementById('monthPicker').onchange=(e)=>{ dashMonth=e.target.value; renderDashboard(main); };
}

/* ================= CLIENTES ================= */
function renderClientes(main){
  main.innerHTML=`
    <div class="page-head"><div><h2>Cadastro de Clientes</h2><div class="sub">Empresas que contratam eventos com a Samseg</div></div>
      <div style="display:flex;gap:10px;align-items:center;">

    </div></div>
    <div id="clientList"></div>
  `;
  document.getElementById('btnNewClient').onclick=()=>openClientForm();
  const list=document.getElementById('clientList');
  const search=document.getElementById('clientSearch');
  function renderClientCards(){
    const filtro=(search.value||'').toLowerCase().trim();
    const filtrados=clients.filter(c=>{
      return !filtro || (c.nome||'').toLowerCase().includes(filtro) || (c.cnpj||'').toLowerCase().includes(filtro);
    });

  if(filtrados.length){
    list.innerHTML = filtrados.map(c=>`
      <div class="client-card" data-id="${c.id}">
        <div class="main">
          <div class="nome">${escapeHtml(c.nome)}</div>
          <div class="meta">${escapeHtml(c.cnpj||'sem CNPJ cadastrado')} ${c.contato?'· '+escapeHtml(c.contato):''}</div>
        </div>
        <button class="btn btn-ghost btn-sm btn-edit-client">Editar</button>
        <button class="btn btn-danger btn-sm btn-del-client">Excluir</button>
      </div>`).join('');
    list.querySelectorAll('.btn-edit-client').forEach(btn=>{
      btn.onclick=(e)=>{ const id=e.target.closest('.client-card').dataset.id; openClientForm(clients.find(c=>c.id===id)); };
    });
    list.querySelectorAll('.btn-del-client').forEach(btn=>{
      btn.onclick=async (e)=>{
        const id=e.target.closest('.client-card').dataset.id;
        const c=clients.find(x=>x.id===id);
        if(!confirm(`Excluir o cliente "${c.nome}"? Eventos já cadastrados não são afetados.`)) return;
        clients=clients.filter(x=>x.id!==id);
        await saveClients();
        renderClientes(main);
      };
    });
  } else {
    list.innerHTML=`<div class="empty"><b>Nenhum cliente cadastrado</b>Cadastre a primeira empresa contratante para agilizar a criação de eventos.</div>`;
  }
  }
  search.oninput=renderClientCards;
  renderClientCards();
}
function openClientForm(existing){
  const nome=prompt('Razão social / nome fantasia:', existing?existing.nome:'');
  if(nome===null) return;
  const cnpj=prompt('CNPJ (opcional):', existing?existing.cnpj:'');
  if(cnpj===null) return;
  const contato=prompt('Contato (telefone/e-mail, opcional):', existing?existing.contato:'');
  if(contato===null) return;
  if(!nome.trim()){ showToast('Informe o nome do cliente.'); return; }
  (async ()=>{
    if(existing){ existing.nome=nome.trim(); existing.cnpj=cnpj.trim(); existing.contato=contato.trim(); }

/* ================= VALORES POR FUNÇÃO (protegido) ================= */
/* Lista padrão de funções pré-carregada SOMENTE em eventos novos (ver
   uso em openEventForm, no ramo de criação). Eventos já existentes
   nunca passam por aqui — o ramo de edição de openEventForm não toca
   em valoresFuncao, então o array que já está salvo no evento
   permanece exatamente como está. Ordem oficial: Coordenador e
   Supervisor primeiro (sem líder — únicas exceções), depois as demais
   funções, cada uma imediatamente seguida da sua versão Líder de
   Equipe. Porteiro/Porteiro Líder de Equipe existiam numa lista
   anterior e foram restaurados aqui — nenhuma função pré-cadastrada
   que já existiu deve ser removida. */
const FUNCOES_PADRAO_NOVO_EVENTO = [
  'COORDENADOR','SUPERVISOR',
  'VIGILANTE','VIGILANTE LÍDER DE EQUIPE',
  'AUX. DE SERVIÇOS GERAIS','AUX. DE SERVIÇOS GERAIS LÍDER DE EQUIPE',
  'BRIGADISTA','BRIGADISTA LÍDER DE EQUIPE',
  'CARREGADOR','CARREGADOR LÍDER DE EQUIPE',
  'PORTEIRO','PORTEIRO LÍDER DE EQUIPE'
];
/* Ordem oficial FIXA dos blocos de função-base, usada em todas as
   abas que agrupam colaboradores (não é ordem alfabética, e não
   depende da ordem em que cada evento cadastrou suas funções —
   assim eventos antigos e novos mostram os blocos na mesma ordem
   sempre que essas funções existirem). Funções fora desta lista
   (cadastradas manualmente) aparecem depois, em ordem alfabética. */
const ORDEM_OFICIAL_FUNCOES_BASE = ['COORDENADOR','SUPERVISOR','VIGILANTE','AUX. DE SERVIÇOS GERAIS','BRIGADISTA','CARREGADOR','PORTEIRO'];
let buscaFuncaoEventoTexto = ''; // estado só de exibição (filtro), não afeta os dados salvos
/* Agrupa visualmente a função "base" com sua variação "... LÍDER DE
   EQUIPE" logo em seguida — só ordenação de exibição, nunca grava
   nada; a lista salva (ev.valoresFuncao) não é tocada, só uma cópia
   é reordenada aqui para desenhar a tela. */
function baseDaFuncaoDisplay(funcaoNorm){
  const sufixo=' LÍDER DE EQUIPE';
  return funcaoNorm.endsWith(sufixo) ? funcaoNorm.slice(0, -sufixo.length) : funcaoNorm;
}
function ordenarValoresFuncaoParaExibicao(lista){
  /* Ordem OFICIAL fixa dos grupos (Coordenador, Supervisor, Vigilante,
     Aux. de Serviços Gerais, Brigadista, Carregador) — não é mais
     alfabética. Funções fora dessa lista oficial (cadastradas
     manualmente) vêm depois, em ordem alfabética entre si. Dentro do
     mesmo grupo, a base continua sempre antes da variação "LÍDER DE
     EQUIPE". */
  return [...lista].sort((a,b)=>{
    const na=normalizaFuncaoDisplay(a.funcao), nb=normalizaFuncaoDisplay(b.funcao);
    const baseA=baseDaFuncaoDisplay(na), baseB=baseDaFuncaoDisplay(nb);
    if(baseA!==baseB){
      const ia=ORDEM_OFICIAL_FUNCOES_BASE.indexOf(baseA), ib=ORDEM_OFICIAL_FUNCOES_BASE.indexOf(baseB);
      if(ia!==-1 && ib!==-1) return ia-ib;
      if(ia!==-1) return -1;
      if(ib!==-1) return 1;
      return baseA.localeCompare(baseB,'pt-BR');
    }
    const aEhLider=na!==baseA, bEhLider=nb!==baseB;
    return (aEhLider?1:0)-(bEhLider?1:0);
  });
}

        </div>
        <button class="btn btn-danger btn-sm btn-del-funcao-evento">Excluir</button>

    }).join('') : `<div class="empty"><b>Nenhuma função cadastrada neste evento</b>Cadastre o valor diário de cada função (ex: Vigilante, Porteiro) para o cálculo automático funcionar neste evento.</div>`}
    </div>
    <div id="buscaFuncaoEventoVazio" class="empty" style="display:none;"><b>Nenhuma função encontrada</b>Tente buscar por outro termo.</div>
  `;
}

  const valorDia=prompt(`Valor pago por dia trabalhado nessa função, só em "${ev.evento}" (R$):`, existing&&existing.valorDia!=null?existing.valorDia:'');
  if(valorDia===null) return;

         diferenciar maiúsculas/minúsculas) antes de adicionar uma
         função nova — cobre tanto as 12 funções padrão quanto
         qualquer outra que o gestor cadastre manualmente. */

function openEventForm(existing){
  let clienteNome = existing ? existing.cliente : '';
  if(clients.length){
    const listagem = clients.map((c,i)=>`${i+1}. ${c.nome}`).join('\n');
    const escolha = prompt(`Escolha o cliente pelo número ou digite um nome novo:\n${listagem}`, clienteNome);
    if(escolha===null) return;
    const idx = parseInt(escolha,10);
    if(!isNaN(idx) && clients[idx-1]) clienteNome = clients[idx-1].nome;
    else clienteNome = escolha.trim();
  } else {
    const c = prompt('Nome do cliente:', clienteNome);
    if(c===null) return;
    clienteNome = c.trim();
  }
  const evento=prompt('Nome do evento:', existing?existing.evento:'');
  if(evento===null) return;
  if(!clienteNome || !evento.trim()){ showToast('Preencha cliente e evento.'); return; }

  const dataInicioDefault = existing ? existing.data : null;
const dataInicio = askDate('Data de início do evento (DD/MM/AAAA):', dataInicioDefault);
if(dataInicio===undefined) return;

const horaInicioDefault = existing ? existing.horaInicio : '';
const horaInicioRaw = prompt('Horário de início do evento (HH:MM):', horaInicioDefault);
if(horaInicioRaw===null) return;
const horaInicio = normalizarHora(horaInicioRaw);

if(!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(horaInicio.trim())){
  showToast('Horário de início inválido. Use HH:MM.');
  return;
}

const dataFimDefault = existing ? existing.dataFim : dataInicio;
const dataFim = askDate(
  'Data de término do evento (DD/MM/AAAA) — deixe igual à data de início se for um único dia:',
  dataFimDefault || dataInicio
);
if(dataFim===undefined) return;

const horaFimDefault = existing ? existing.horaFim : horaInicio;
const horaFimRaw = prompt('Horário de término do evento (HH:MM):', horaFimDefault);
if(horaFimRaw===null) return;
const horaFim = normalizarHora(horaFimRaw);

if(!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(horaFim.trim())){
  showToast('Horário de término inválido. Use HH:MM.');
  return;
}

/* Validação de data/hora completas (não só o horário isolado).
   Monta os dois instantes locais (sem toISOString, para não sofrer
   deslocamento de fuso) e compara a data+hora inteira: um evento que
   termina de madrugada no dia seguinte (ex: 20:00 → 04:00 do dia
   seguinte) é válido; só é inválido quando o fim cai igual ou antes
   do início na linha do tempo real, dias e horas juntos. */
const inicioCompleto = new Date(`${dataInicio}T${horaInicio.trim()}:00`);
const fimCompleto = new Date(`${dataFim}T${horaFim.trim()}:00`);
if(fimCompleto <= inicioCompleto){
  showToast(`A data/hora de término deve ser depois da data/hora de início. (Início: ${isoToBr(dataInicio)} ${horaInicio.trim()} · Término: ${isoToBr(dataFim)} ${horaFim.trim()})`);
  return;
}

/* "Válido até" é um campo separado da data do evento (linkValidoAte),
   guardado à parte de data/dataFim — de propósito, para permitir um
   prazo de inscrição diferente da data do evento. Mas se antes ele
   estava simplesmente acompanhando a data de término (não foi
   customizado à parte), ao editar o evento ele deve continuar
   acompanhando a NOVA data de término automaticamente — senão o link
   fica "preso" numa data antiga já vencida mesmo com o evento
   atualizado, que foi exatamente o problema relatado. */
const linkEstavaAutomatico = existing ? (existing.linkValidoAte === existing.dataFim) : true;
const linkDefault = existing
  ? (linkEstavaAutomatico ? dataFim : existing.linkValidoAte)
  : dataFim;
const linkValidoAte = askDate(
  (existing
    ? `Este é um campo SEPARADO da data do evento. Hoje ele estava ${linkEstavaAutomatico ? 'acompanhando automaticamente a data de término' : 'definido manualmente para ' + formatDate(existing.linkValidoAte)}.\n`
    : ''
  ) + 'Link de convocação (interesse) válido até (DD/MM/AAAA) — após essa data, ninguém mais consegue registrar interesse:',
  linkDefault || dataFim
);
if(linkValidoAte===undefined) return;

(async ()=>{
  if(existing){
    existing.cliente=clienteNome;
    existing.evento=evento.trim();
    existing.data=dataInicio;
    existing.horaInicio=horaInicio.trim();
    existing.dataFim=dataFim;
    existing.horaFim=horaFim.trim();
    existing.linkValidoAte=linkValidoAte;
  } else {
    events.push({
      id:uid(),
      cliente:clienteNome,
      evento:evento.trim(),
      data:dataInicio,
      horaInicio:horaInicio.trim(),
      dataFim:dataFim,
      horaFim:horaFim.trim(),
      linkValidoAte:linkValidoAte,
      status:'aberto',
      valoresFuncao: FUNCOES_PADRAO_NOVO_EVENTO.map(f=>({funcao:f, valorDia:null}))
    });
  }

  const resultado = await saveEvents();
  if(resultado && resultado.ok){
    renderMain();
    showToast('Evento atualizado com sucesso.');
  } else {
    /* Não persistiu: recarrega os eventos direto do Supabase para a
       tela não continuar mostrando uma data que na verdade não foi
       salva (o array local já tinha sido alterado antes da tentativa
       de salvar). Mostra o erro real, sem escondê-lo. */
    events = (await sGet('events')) || events;
    renderMain();
    const msg = (resultado && resultado.error && resultado.error.message) ? resultado.error.message : 'não foi possível salvar. Tente novamente.';
    showToast('Erro ao salvar evento: '+msg);
  }
})();
    }
   
async function deleteCurrentEvent(){
  const ev=currentEvent(); if(!ev) return;
  if(!confirm(`Excluir o evento "${ev.evento}" (${ev.cliente})? Isso também apaga a escala e presença registradas.`)) return;
  const eventosAntes=events;
  events=events.filter(e=>e.id!==currentEventId);
  const resultado=await saveEvents();
  if(resultado && resultado.ok){
    currentEventId=null; section='eventos';
    renderShell();
    showToast('Evento excluído.');
  } else {
    events=eventosAntes; // reverte a exclusão local, já que não foi persistida
    renderShell();
    const msg=(resultado && resultado.error && resultado.error.message) ? resultado.error.message : 'não foi possível excluir. Tente novamente.';
    showToast('Erro ao excluir evento: '+msg);
  }
}

function renderEscalaHorarioDias(){
  if(!gestorUnlocked) return lockScreenHtml('A escala e o horário por dia só ficam visíveis para o gestor.');
  if(!eventoDias.length) return `<div class="empty"><b>Este evento ainda não tem dias gerados</b>Salve novamente o cadastro do evento (data/data fim/horário) para gerar os dias automaticamente.<div class="mono" style="margin-top:10px;font-size:11px;color:var(--muted);">Diagnóstico: evento_id consultado = "${escapeHtml(currentEventId||'')}" · ${ultimoErroEventoDias ? 'erro do Supabase: '+escapeHtml(ultimoErroEventoDias) : 'consulta OK, 0 linhas retornadas (possível RLS bloqueando o papel authenticated)'}</div></div>`;
  if(!participacoesNovas.length) return `<div class="empty"><b>Nenhuma participação confirmada ainda</b>Colaboradores aparecem aqui depois que confirmam sua participação pelo link público (CPF autorizado).</div>`;

  /* Regra definitiva: só quem já foi aprovado (Pré-Escala → Escala
     Oficial) fica disponível para ser escalado por dia — aprovação não
     escala automaticamente nenhum dia específico, só libera a pessoa
     para aparecer aqui. Cruza por CPF com "interessados" (já carregado
     ao abrir o evento). Se o retorno de listar_participacoes_evento não
     trouxer CPF em nenhum registro (campo ausente), mantém a lista
     completa em vez de esconder todo mundo por causa de uma coluna que
     talvez não exista nessa RPC — evita piorar o que já funcionava. */
  const algumTemCpf = participacoesNovas.some(p=>p.cpf);
  let listaExibida = participacoesNovas;
  if(algumTemCpf){
    const cpfsAprovados = new Set(
      interessados.filter(i=>(i.status||'pendente')==='aprovado').map(i=>(i.cpf||'').replace(/\D/g,''))
    );
    listaExibida = participacoesNovas.filter(p=>cpfsAprovados.has((p.cpf||'').replace(/\D/g,'')));
  }
  if(!listaExibida.length){
    return `<div class="empty"><b>Nenhum colaborador aprovado ainda</b>Aprove candidatos na Pré-Escala (Escala Oficial) para eles ficarem disponíveis aqui.</div>`;
  }

  return `
    <div class="card-title">Escala por dia</div>
    <div class="card-sub">Marque em quais dias específicos cada colaborador está previsto para trabalhar. Lista de todos os dias do evento lado a lado — não há um único "dia selecionado" nesta tabela.</div>
    ${(()=>{
      const grupos=agruparPorFuncaoPrincipal(listaExibida, p=>p.funcao, p=>p.nome);
      const colspanEscala=2+eventoDias.length;
      return `
        ${renderResumoQuantidadesFuncao(grupos)}
        <table>
          <thead><tr><th>#</th><th>Colaborador</th>${eventoDias.map(d=>`<th>${formatarDataComDiaSemana(d.data)}</th>`).join('')}</tr></thead>
          <tbody>
            ${linhasComTituloDeGrupo(grupos, colspanEscala, (p,numero)=>`
              <tr data-participacao-id="${pid(p)}">
                <td class="mono">${numero}</td>
                <td>${escapeHtml(p.nome)}</td>
                ${eventoDias.map(d=>`<td style="text-align:center;"><label class="checkbox-wrap"><input type="checkbox" class="chk-escala-dia" data-dia-id="${d.id}" ${escaladoNoDia(pid(p), d.id)?'checked':''}></label></td>`).join('')}
              </tr>`)}
          </tbody>
        </table>
      `;
    })()}
    <div class="card-title" style="margin-top:28px;">Dias do evento — horário</div>
    <div class="card-sub">Horário de cada dia — clique em "Editar" para ajustar um dia específico.</div>
    <table>
      <thead><tr><th>Data</th><th>Início</th><th>Fim</th><th></th></tr></thead>
      <tbody>
        ${eventoDias.map(d=>`
          <tr data-dia-id="${d.id}">
            <td>${formatarDataComDiaSemana(d.data)}</td>
            <td class="mono">${(d.hora_inicio||'').slice(0,5)}</td>
            <td class="mono">${(d.hora_fim||'').slice(0,5)}</td>
            <td><button class="btn btn-ghost btn-sm btn-editar-horario-dia">Editar horário</button></td>
          </tr>`).join('')}
      </tbody>
    </table>
  `;
}
function attachEscalaHorarioHandlers(){
  document.querySelectorAll('.btn-editar-horario-dia').forEach(btn=>{
    btn.onclick=async ()=>{
      const tr=btn.closest('tr'); const diaId=Number(tr.dataset.diaId);
      const dia=eventoDias.find(d=>d.id===diaId); if(!dia) return;
      const novoInicioRaw=prompt('Horário de início (HH:MM):', (dia.hora_inicio||'').slice(0,5));
      if(novoInicioRaw===null) return;
      const novoInicio=normalizarHora(novoInicioRaw);
      if(!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(novoInicio.trim())){ showToast('Horário de início inválido. Use HH:MM.'); return; }
      const novoFimRaw=prompt('Horário de fim (HH:MM):', (dia.hora_fim||'').slice(0,5));
      if(novoFimRaw===null) return;
      const novoFim=normalizarHora(novoFimRaw);
      if(!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(novoFim.trim())){ showToast('Horário de fim inválido. Use HH:MM.'); return; }
      const r=await chamarRpcGestor('atualizar_horario_dia',{p_evento_dia_id:diaId, p_hora_inicio:novoInicio, p_hora_fim:novoFim});
      if(r.ok){ showToast('Horário atualizado.'); await loadDiasEscalaPresenca(); renderShell(); }
    };
  });
  document.querySelectorAll('.chk-escala-dia').forEach(chk=>{
    chk.onchange=async ()=>{
      const tr=chk.closest('tr'); const participacaoId=Number(tr.dataset.participacaoId); const diaId=Number(chk.dataset.diaId);
      const r=await chamarRpcGestor('definir_escala_dia',{p_participacao_id:participacaoId, p_evento_dia_id:diaId, p_escalado:chk.checked});
      if(r.ok){ showToast('Escala atualizada.'); await loadDiasEscalaPresenca(); renderShell(); }
      else { chk.checked=!chk.checked; } // reverte visualmente se o banco recusou (ex: conflito, presença já registrada)
    };
  });
}

/* ================= ETAPA 2 — CHECKOUT/PRESENÇA POR DIA ================= */
function renderCheckoutDias(){
  if(!gestorUnlocked) return lockScreenHtml('O checkout de entrada/saída só fica visível para o gestor.');
  if(!eventoDias.length) return `<div class="empty"><b>Este evento ainda não tem dias gerados</b>Salve novamente o cadastro do evento para gerar os dias.<div class="mono" style="margin-top:10px;font-size:11px;color:var(--muted);">Diagnóstico: evento_id consultado = "${escapeHtml(currentEventId||'')}" · ${ultimoErroEventoDias ? 'erro do Supabase: '+escapeHtml(ultimoErroEventoDias) : 'consulta OK, 0 linhas retornadas (possível RLS bloqueando o papel authenticated)'}</div></div>`;
  const diaId=diaSelecionadoPresenca || eventoDias[0].id;
  const escaladosNoDia = participacoesNovas.filter(p=>escaladoNoDia(pid(p), diaId));
  return `
    <div class="card-title">Checkout por dia</div>
    <div class="card-sub">Selecione o dia, registre a entrada e a saída (horário real do servidor). Depois da saída, informe se houve hora extra.</div>
    <div class="field" style="max-width:280px;">
      <label>Dia</label>
      <select id="selDiaPresenca">
        ${eventoDias.map(d=>`<option value="${d.id}" ${d.id===diaId?'selected':''}>${formatDate(d.data)} (${(d.hora_inicio||'').slice(0,5)}–${(d.hora_fim||'').slice(0,5)})</option>`).join('')}
      </select>
    </div>
    ${escaladosNoDia.length ? (()=>{
      const grupos=agruparPorFuncaoPrincipal(escaladosNoDia, p=>p.funcao, p=>p.nome);
      return `
        ${renderResumoQuantidadesFuncao(grupos)}
        <table>
          <thead><tr><th>#</th><th>Colaborador</th><th>Função</th><th>Telefone</th><th>Entrada</th><th>Saída</th><th>Horas adicionais</th><th></th></tr></thead>
          <tbody>
            ${linhasComTituloDeGrupo(grupos, 8, (p,numero)=>{
              const pr=presencaDoDia(pid(p), diaId);
              const temEntrada=pr && pr.entrada_ts;
              const temSaida=pr && pr.saida_ts;
              return `<tr data-participacao-id="${pid(p)}">
                <td class="mono">${numero}</td>
                <td>${escapeHtml(p.nome)}</td>
                <td>${escapeHtml(p.funcao||'—')}</td>
                <td class="mono">${p.telefone?`<a href="tel:${escapeHtml(p.telefone)}" style="color:inherit;">${escapeHtml(formatTelefone(p.telefone))}</a>`:'—'}</td>
                <td class="mono">${temEntrada?new Date(pr.entrada_ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'—'}</td>
                <td class="mono">${temSaida?new Date(pr.saida_ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'—'}</td>
                <td class="mono">${horasExtraDe(pr)!=null ? horasExtraDe(pr)+'h' : (temSaida?'não informado':'—')}</td>
                <td>
                  ${!temEntrada ? `<button class="btn btn-teal btn-sm btn-entrada">Registrar entrada</button>` : ''}
                  ${temEntrada && !temSaida ? `<button class="btn btn-amber btn-sm btn-saida">Registrar saída</button>` : ''}
                  ${temSaida && (horasExtraDe(pr)==null) && !horasExtraAguardandoQtd.has(pid(p)) ? `
                    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                      <span style="font-size:12px;color:var(--muted);">Fez hora extra?</span>
                      <button class="btn btn-teal btn-sm btn-hora-extra-sim">Sim</button>
                      <button class="btn btn-ghost btn-sm btn-hora-extra-nao">Não</button>
                    </div>` : ''}
                  ${temSaida && (horasExtraDe(pr)==null) && horasExtraAguardandoQtd.has(pid(p)) ? `
                    <div style="display:flex;align-items:center;gap:6px;">
                      <input type="number" class="input-qtd-hora-extra mono" min="0" step="1" style="width:64px;" placeholder="0">
                      <button class="btn btn-teal btn-sm btn-confirmar-hora-extra">Confirmar</button>
                    </div>` : ''}
                  ${temSaida && (horasExtraDe(pr)!=null) ? `<button class="btn btn-ghost btn-sm btn-corrigir-hora-extra">Corrigir hora extra</button>` : ''}
                </td>
              </tr>`;
            })}
          </tbody>
        </table>
      `;
    })() : `<div class="empty"><b>Ninguém escalado para este dia</b>Escale colaboradores em "Escala &amp; Horário por Dia".</div>`}
  `;
}
let horasExtraAguardandoQtd = new Set(); // ids (pid) com o campo de quantidade aberto na tela, transitório
function attachCheckoutHandlers(){
  const sel=document.getElementById('selDiaPresenca');
  if(sel) sel.onchange=()=>{ diaSelecionadoPresenca=Number(sel.value); horasExtraAguardandoQtd.clear(); renderShell(); };
  document.querySelectorAll('.btn-entrada').forEach(btn=>{
    btn.onclick=async ()=>{
      const participacaoId=Number(btn.closest('tr').dataset.participacaoId);
      const r=await chamarRpcGestor('registrar_entrada_presenca',{p_participacao_id:participacaoId, p_evento_dia_id:diaSelecionadoPresenca});
      if(r.ok){ showToast('Entrada registrada.'); await loadDiasEscalaPresenca(); renderShell(); }
    };
  });
  document.querySelectorAll('.btn-saida').forEach(btn=>{
    btn.onclick=async ()=>{
      const participacaoId=Number(btn.closest('tr').dataset.participacaoId);
      const r=await chamarRpcGestor('registrar_saida_presenca',{p_participacao_id:participacaoId, p_evento_dia_id:diaSelecionadoPresenca});
      if(!r.ok) return;
      showToast('Saída registrada.');
      /* Não pergunta mais com confirm()/prompt(): depois de recarregar,
         a própria linha passa a mostrar os botões "Sim"/"Não" (já que
         temSaida=true e horas_extra ainda é null neste ponto). */
      await loadDiasEscalaPresenca(); renderShell();
    };
  });
  document.querySelectorAll('.btn-hora-extra-nao').forEach(btn=>{
    btn.onclick=async ()=>{
      const participacaoId=Number(btn.closest('tr').dataset.participacaoId);
      const r=await chamarRpcGestor('registrar_horas_extra',{p_participacao_id:participacaoId, p_evento_dia_id:diaSelecionadoPresenca, p_horas_extra:0});
      if(r.ok){ showToast('Sem hora extra registrada.'); await loadDiasEscalaPresenca(); renderShell(); }
    };
  });
  document.querySelectorAll('.btn-hora-extra-sim').forEach(btn=>{
    btn.onclick=()=>{
      const participacaoId=Number(btn.closest('tr').dataset.participacaoId);
      horasExtraAguardandoQtd.add(participacaoId);
      renderShell();
    };
  });
  document.querySelectorAll('.btn-corrigir-hora-extra').forEach(btn=>{
    btn.onclick=()=>{
      const participacaoId=Number(btn.closest('tr').dataset.participacaoId);
      horasExtraAguardandoQtd.add(participacaoId);
      renderShell();
    };
  });
  document.querySelectorAll('.btn-confirmar-hora-extra').forEach(btn=>{
    btn.onclick=async ()=>{
      const tr=btn.closest('tr'); const participacaoId=Number(tr.dataset.participacaoId);
      const input=tr.querySelector('.input-qtd-hora-extra');
      const valor=input.value.trim();
      const horas=parseInt(valor,10);
      if(valor==='' || isNaN(horas) || horas<0 || String(horas)!==valor){
        showToast('Informe um número inteiro maior ou igual a zero (ex: 0, 1, 2, 3).');
        return;
      }
      const r=await chamarRpcGestor('registrar_horas_extra',{p_participacao_id:participacaoId, p_evento_dia_id:diaSelecionadoPresenca, p_horas_extra:horas});
      if(r.ok){
        horasExtraAguardandoQtd.delete(participacaoId);
        showToast(horas>0?`${horas} hora(s) extra registrada(s).`:'Sem hora extra registrada.');
        await loadDiasEscalaPresenca(); renderShell();
      }
    };
  });
}

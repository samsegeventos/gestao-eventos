<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samseg — Gestão de Eventos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14161c; --surface:#1c1f28; --surface-2:#23262f; --line:#333744;
    --amber:#e8a33d; --teal:#4fb3a9; --red:#e2574c; --text:#edeae3; --muted:#8b8f9b;
    --sidebar-w:230px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh;
  }
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  select,input,button,textarea{
    font-family:'Inter',sans-serif; font-size:14px; color:var(--text);
    background:var(--surface-2); border:1px solid var(--line); border-radius:7px; padding:9px 11px; outline:none;
  }
  select:focus,input:focus,textarea:focus{border-color:var(--amber);}
  .btn{cursor:pointer; font-weight:600; border:1px solid var(--line); background:var(--surface-2); color:var(--text); transition:all .15s ease; white-space:nowrap;}
  .btn:hover{border-color:var(--muted);}
  .btn-amber{background:var(--amber); color:#14161c; border-color:var(--amber);}
  .btn-amber:hover{filter:brightness(1.08);}
  .btn-teal{background:var(--teal); color:#14161c; border-color:var(--teal);}
  .btn-teal:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent;}
  .btn-danger{color:var(--red); border-color:rgba(226,87,76,0.4); background:transparent;}
  .btn-danger:hover{background:rgba(226,87,76,0.1);}
  .btn-sm{padding:6px 10px; font-size:12.5px; border-radius:6px;}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}
  .card-title{font-size:16px; font-weight:600; margin:0 0 2px;}
  .card-sub{color:var(--muted); font-size:12.5px; margin:0 0 16px;}
  .resumo-funcoes{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:10px 14px; margin-bottom:16px; font-size:12.5px; line-height:1.7;}
  .resumo-funcoes b{color:var(--text);}
  .grupo-funcao-titulo{font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:0.3px; margin:20px 0 8px; padding-bottom:6px; border-bottom:1px solid var(--line); color:var(--amber);}
  .grupo-funcao-titulo:first-of-type{margin-top:4px;}
  .grupo-funcao-count{color:var(--muted); font-weight:400; text-transform:none;}
  .linha-titulo-grupo td{background:rgba(232,163,61,0.07); font-weight:700; font-size:12.5px; text-transform:uppercase; letter-spacing:0.3px; color:var(--amber); padding:8px 10px; border-bottom:1px solid var(--line);}
  /* Linha inteira destacada quando o colaborador já concluiu o
     cadastro pelo link público (não confundir com "autorizado" nem
     com presença em Pré-Escala/Escala — ver comentário no JS). Usa o
     teal do tema, na mesma família visual do badge "pago" já
     existente, para não introduzir uma cor nova ao sistema. */
  tbody tr.linha-cadastro-concluido td{background:rgba(79,179,169,0.10);}
  tbody tr.linha-cadastro-concluido:hover td{background:rgba(79,179,169,0.16);}
  /* Modal simples para o formulário de Novo/Editar Colaborador do
     Banco de Colaboradores — segue as mesmas variáveis de cor/painel
     já usadas no resto do sistema, nenhuma cor nova introduzida. */
  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.55); display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px;}
  .modal-box{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:24px; width:100%; max-width:440px; max-height:90vh; overflow-y:auto;}
  .badge{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; letter-spacing:0.4px; text-transform:uppercase; font-family:'JetBrains Mono',monospace; border:1.5px solid;}
  .badge.aberto{color:var(--amber); border-color:var(--amber); background:rgba(232,163,61,0.08);}
  .badge.finalizado{color:var(--teal); border-color:var(--teal); background:rgba(79,179,169,0.08);}
  .badge.pendente{color:var(--amber); border-color:var(--amber); background:rgba(232,163,61,0.08);}
  .badge.pago{color:var(--teal); border-color:var(--teal); background:rgba(79,179,169,0.08);}
  .empty{text-align:center; color:var(--muted); padding:40px 20px; font-size:13.5px;}
  .empty b{color:var(--text); display:block; font-family:'Space Grotesk',sans-serif; font-size:15px; margin-bottom:6px;}
  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--surface-2); border:1px solid var(--line); color:var(--text); padding:10px 18px; border-radius:8px; font-size:13px; opacity:0; transition:all .25s ease; pointer-events:none; z-index:80; max-width:90vw; text-align:center;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ---------- layout ---------- */
  .shell{display:flex; min-height:100vh;}
  .sidebar{
    width:var(--sidebar-w); flex-shrink:0; background:var(--surface); border-right:1px solid var(--line);
    padding:20px 14px; position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:4px 8px 20px; border-bottom:1px solid var(--line); margin-bottom:14px;}
  .punch-icon{width:30px;height:30px;border-radius:6px; background:var(--amber); color:#14161c; display:flex;align-items:center;justify-content:center; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12px; flex-shrink:0;}
  .brand-name{font-size:13.5px; font-weight:700; line-height:1.2;}
  .brand-sub{font-size:10.5px; color:var(--muted);}

  .nav-group{margin-bottom:6px;}
  .nav-label{font-size:10px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); padding:10px 10px 6px;}
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:7px; cursor:pointer;
    font-size:13.5px; color:var(--muted); font-weight:500; margin-bottom:2px; transition:all .12s ease;
  }
  .nav-item:hover{background:var(--surface-2); color:var(--text);}
  .nav-item.active{background:rgba(232,163,61,0.1); color:var(--amber); font-weight:600;}
  .nav-item .ic{width:16px; text-align:center; flex-shrink:0;}
  .nav-sub{margin-left:8px; padding-left:14px; border-left:1px solid var(--line); margin-bottom:8px; display:none;}
  .nav-sub.open{display:block;}
  .nav-sub .nav-item{font-size:12.5px; padding:7px 10px;}

  .main{flex:1; min-width:0; padding:26px 28px 60px;}
  .page-head{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:20px;}
  .page-head h2{font-size:20px; margin:0;}
  .page-head .sub{color:var(--muted); font-size:12.5px; margin-top:3px;}

  .mobile-topbar{display:none; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line); background:var(--surface); position:sticky; top:0; z-index:40;}
  .mobile-topbar .btn{padding:7px 10px;}

  @media(max-width:860px){
    .sidebar{position:fixed; left:0; top:0; z-index:60; transform:translateX(-100%); transition:transform .2s ease; box-shadow:0 0 40px rgba(0,0,0,0.5);}
    .sidebar.open{transform:translateX(0);}
    .mobile-topbar{display:flex;}
    .main{padding:18px 16px 60px;}
    .overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:50;}
    .overlay.show{display:block;}
  }

  /* ---------- dashboard ---------- */
  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
  .stat-card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px;}
  .stat-card .label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.4px;}
  .stat-card .value{font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:700; margin-top:6px;}
  .stat-card.amber .value{color:var(--amber);}
  .stat-card.teal .value{color:var(--teal);}
  .stat-card.red .value{color:var(--red);}
  @media(max-width:760px){.stat-grid{grid-template-columns:repeat(2,1fr);}}

  .alert-box{background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--amber); border-radius:8px; padding:12px 14px; font-size:13px; margin-bottom:8px; display:flex; justify-content:space-between; gap:10px; align-items:center; cursor:pointer;}
  .alert-box:hover{border-color:var(--muted); border-left-color:var(--amber);}
  .alert-box .n{color:var(--muted); font-size:11px; font-family:'JetBrains Mono',monospace;}

  .event-list{display:flex; flex-direction:column; gap:10px;}
  .event-card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px 18px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; cursor:pointer; transition:border-color .15s ease;}
  .event-card:hover{border-color:var(--muted);}
  .event-card .main{flex:1; min-width:180px;}
  .event-card .cliente{font-weight:600; font-size:14.5px;}
  .event-card .meta{color:var(--muted); font-size:12.5px; margin-top:2px;}
  .event-card .metrics{display:flex; gap:20px; align-items:center;}
  .event-card .metric{text-align:right;}
  .event-card .metric .l{font-size:10.5px; color:var(--muted); text-transform:uppercase;}
  .event-card .metric .v{font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:700;}
  @media(max-width:760px){.event-card{flex-direction:column; align-items:stretch;} .event-card .metrics{justify-content:space-between;}}

  .toolbar{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px;}
  .toolbar .spacer{flex:1;}

  /* ---------- evento detail ---------- */
  .event-bar{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px 18px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:18px;}
  .event-bar .info{flex:1; min-width:200px;}
  .event-bar .cliente{font-weight:600; font-size:15px;}
  .event-bar .meta{color:var(--muted); font-size:12.5px; margin-top:2px;}

  .subtabs{display:flex; gap:4px; margin-bottom:0; border-bottom:1px solid var(--line); flex-wrap:wrap;}
  .subtab{padding:10px 14px; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; user-select:none;}
  .subtab.active{color:var(--amber); border-color:var(--amber);}
  .subtab:hover:not(.active){color:var(--text);}
  .subtab .count{display:inline-block; margin-left:5px; font-size:10px; font-family:'JetBrains Mono',monospace; background:var(--surface-2); border-radius:10px; padding:1px 6px; color:var(--muted);}

  .panel{background:var(--surface); border:1px solid var(--line); border-radius:0 10px 10px 10px; padding:22px; animation:fade .18s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(3px);} to{opacity:1; transform:none;}}

  .add-row{display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; padding:14px; background:var(--surface-2); border:1px dashed var(--line); border-radius:8px; margin-bottom:18px;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.4px;}
  .field input,.field select{min-width:120px;}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  thead th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.4px; color:var(--muted); padding:8px 10px; border-bottom:1px solid var(--line); font-weight:600;}
  tbody td{padding:10px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tbody tr:hover{background:rgba(255,255,255,0.02);}
  tbody tr:last-child td{border-bottom:none;}

  /* ---- Fechamento Financeiro: impressões (tela = impressão) ----
     Visual claro/suave: cabeçalho do evento em cinza mais escuro,
     cabeçalho das colunas em cinza claro, linhas finas entre
     colaboradores. table-layout:fixed + colgroup (definido em JS)
     garante que a largura de cada coluna é sempre a mesma, mesmo com
     muitos dias — não depende do conteúdo de cada linha. Não usar
     text-overflow/ellipsis em lugar nenhum: nome do evento e nome do
     colaborador NUNCA podem ser cortados. */
  .tabela-fechamento-datas{font-size:12.5px; font-weight:400; border-collapse:collapse; width:100%; table-layout:fixed;}
  .tabela-fechamento-datas thead{display:table-header-group;} /* repete o cabeçalho em cada página impressa */
  .tabela-fechamento-datas thead th{background:#f2f2f2; color:#333; font-weight:600; white-space:nowrap; padding:7px 8px;}
  .tabela-fechamento-datas tbody td{font-weight:400; border-bottom:1px solid #e2e2e2; white-space:nowrap; padding:7px 8px;}
  .tabela-fechamento-datas tbody tr:last-child td{border-bottom:1px solid #e2e2e2;}
  .tabela-fechamento-datas tbody tr{page-break-inside:avoid; height:32px;}
  .tabela-fechamento-datas .col-assinatura{border-left:1px solid #ddd;}
  .tabela-fechamento-datas .col-data-manual{border-left:1px solid #ddd;}
  .tabela-fechamento-datas .col-nome{white-space:normal; word-break:break-word;} /* nunca corta o nome do colaborador */
  .tabela-fechamento-datas .col-func-presidencia{white-space:nowrap;} /* função nunca quebra em duas linhas na Impressão p/ Presidência */
  /* Colunas de data: o mais estreitas possível, sem perder alinhamento
     nem cortar "180 (10h)" — cada uma é uma <th>/<td> própria, dentro
     da MESMA tabela, então a largura fica automaticamente uniforme e
     alinhada entre cabeçalho e valores. */
  .tabela-fechamento-datas th.col-dia,.tabela-fechamento-datas td.col-dia{padding:7px 3px; text-align:center;}
  /* Cabeçalho do evento: cinza MAIS ESCURO que o cabeçalho das
     colunas (#f2f2f2) — dá hierarquia visual sem ser pesado/escuro
     demais. */
  .tabela-fechamento-datas .linha-cabecalho-impressao th{background:#d6d6d6; color:#1a1a1a; text-align:left; font-size:13px; font-weight:700; line-height:1.4; padding:8px 10px;}
  .folha-fechamento{margin-bottom:32px;}
  td input[type="time"],td input[type="date"],td input[type="number"],td input[type="text"]{width:100%; min-width:90px;}

  .stamp{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:20px; font-size:11.5px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; font-family:'JetBrains Mono',monospace; border:1.5px solid;}
  .stamp.on{color:var(--teal); border-color:var(--teal); background:rgba(79,179,169,0.08);}
  .stamp.off{color:var(--muted); border-color:var(--line); background:transparent;}

  .checkbox-wrap{display:flex; align-items:center; gap:8px; cursor:pointer;}
  .checkbox-wrap input{width:16px; height:16px; accent-color:var(--amber); cursor:pointer;}

  .section-title{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); margin:24px 0 10px;}
  .section-title:first-child{margin-top:0;}

  .interesse-row{display:flex; align-items:center; gap:12px; padding:10px 12px; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; margin-bottom:8px;}
  .interesse-row .who{flex:1;}
  .interesse-row .who .nome{font-weight:600; font-size:13.5px;}
  .interesse-row .who .when{color:var(--muted); font-size:11.5px;}

  .totals{margin-top:18px; display:flex; justify-content:flex-end; gap:26px; padding-top:16px; border-top:1px solid var(--line); flex-wrap:wrap;}
  .totals .item{text-align:right;}
  .totals .label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.4px;}
  .totals .value{font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700; color:var(--amber);}

  .link-box{display:flex; gap:8px; align-items:center; margin-bottom:20px; flex-wrap:wrap;}
  .link-box input{flex:1; min-width:200px; font-family:'JetBrains Mono',monospace; font-size:12px;}

  .client-card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 18px; display:flex; align-items:center; gap:14px; margin-bottom:10px; flex-wrap:wrap;}
  .client-card .main{flex:1; min-width:160px;}
  .client-card .nome{font-weight:600; font-size:14px;}
  .client-card .meta{color:var(--muted); font-size:12px; margin-top:2px;}
  .client-card.funcao-ativa{background:rgba(79,179,169,0.08); border-color:var(--teal); border-width:1.5px;}
  .client-card .funcao-ativa-badge{color:var(--teal); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; margin-top:1px;}
  .client-card.compacto{padding:6px 14px; margin-bottom:4px; gap:12px; min-height:0;}
  .client-card.compacto .nome{font-size:13px; line-height:1.3;}
  .client-card.compacto .meta{font-size:11px; margin-top:0; line-height:1.3;}
  .client-card.compacto .funcao-ativa-badge{margin-top:0; line-height:1.3;}
  .valor-funcao-wrap{display:flex; align-items:center; gap:6px; white-space:nowrap;}
  .valor-funcao-wrap .prefixo{color:var(--muted); font-size:13px;}
  .input-valor-funcao-direto{width:110px;}

  /* ---------- public interest form ---------- */
  .wrap-narrow{max-width:480px; margin:60px auto; padding:0 20px;}
  .interesse-page{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:28px;}
  .interesse-page .ev-name{font-size:20px; font-weight:700; font-family:'Space Grotesk',sans-serif;}
  .interesse-page .ev-meta{color:var(--muted); font-size:13px; margin-top:4px; margin-bottom:22px;}
  .interesse-page .field{margin-bottom:14px;}
  .interesse-page input{width:100%; padding:11px 12px;}
  .success-box{text-align:center; padding:20px 0;}
  .success-box .check{width:54px; height:54px; border-radius:50%; background:rgba(79,179,169,0.12); color:var(--teal); border:2px solid var(--teal); display:flex; align-items:center; justify-content:center; font-size:24px; margin:0 auto 16px;}
  .public-header{display:flex; align-items:center; gap:10px; justify-content:center; padding:24px 0 0;}

  @media print{
    .sidebar,.mobile-topbar,.event-bar,.subtabs,.add-row,.btn,.toolbar,.link-box{display:none !important;}
    body{background:#fff; color:#000;}
    .main{padding:0;}
    .panel{border:none; background:#fff; padding:0;}
    table{color:#000;}
    thead th,tbody td{border-color:#ccc;}
    .totals .value{color:#000;}
    .tabela-fechamento-datas thead th{background:#f2f2f2 !important; color:#333 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
    .tabela-fechamento-datas .linha-cabecalho-impressao th{background:#d6d6d6 !important; color:#1a1a1a !important; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
    .tabela-fechamento-datas tbody td,.tabela-fechamento-datas tbody tr:last-child td{border-bottom:1px solid #e2e2e2 !important;}
    .tabela-fechamento-datas .col-assinatura,.tabela-fechamento-datas .col-data-manual{border-left:1px solid #ccc !important;}
    .folha-fechamento{page-break-after:always; margin-bottom:0;}
    .folha-fechamento:last-child{page-break-after:auto;}
    /* Compactação só na impressão (nunca na tela) — reduz o quanto for
       necessário para caber mais linhas por folha antes de precisar de
       uma nova página. Nunca esconde nem corta informação, só aperta
       o espaço em volta dela. */
    .tabela-fechamento-datas tbody tr{height:auto;}
    .tabela-fechamento-datas thead th{padding:5px 6px;}
    .tabela-fechamento-datas tbody td{padding:4px 6px;}
    .tabela-fechamento-datas th.col-dia,.tabela-fechamento-datas td.col-dia{padding:4px 3px;}
    .linha-titulo-grupo td{padding:5px 6px;}
    .card-title{margin:0 0 4px;}
    .totals{margin-top:6px; padding-top:8px;}
  }
  @page{ size: A4 landscape; margin: 10mm; }
</style>
</head>
<body>

<div class="mobile-topbar">
  <button class="btn btn-sm" id="btnMenuToggle">☰ Menu</button>
  <div style="font-weight:700; font-size:13.5px;" id="mobileTitle">Samseg</div>
</div>
<div class="overlay" id="overlay"></div>

<div class="shell" id="shell"></div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ================= VERSÃO DO SISTEMA =================
   Identificação fixa desta entrega — não recalculada pelo navegador.
   Atualizar este valor a cada nova rodada de alterações entregue. */
const APP_VERSION = '27/08/2026 07:45';

/* ================= SUPABASE ================= */
const SUPABASE_URL = 'https://npjunlaohurremzjnirt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_xNpRMz2bBwC2ffH50nfPNw_6dV8ZVv4';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ================= STORAGE HELPERS =================
   Mapeia as mesmas chaves usadas antes (events, clients, gestorPin,
   staff:<id>, interessados:<id>) para as tabelas do Supabase, sem
   precisar alterar o resto do código que já chama sGet/sSet. */
async function sGet(key){
  try{
    if(key==='events'){
      const {data,error}=await sb.from('eventos').select('id,dados');
      if(error) throw error;

function formatarDataComDiaSemana(dataIso){

     errado por causa de conversão UTC, mesmo raciocínio já usado em
     todayISO()/brToIso(). */
  if(!dataIso) return '';

}
function brToIso(br){
  if(!br) return null;
  let raw=br.trim();
  /* Aceita 8 dígitos corridos sem barra (ex: 25082026), como se já
     viesse formatado — só quando não há nenhuma barra/hífen digitada,
     para não interferir com datas já separadas normalmente. */
  if(!/[\/\-]/.test(raw)){
    const somenteDigitos=raw.replace(/\D/g,'');
    if(somenteDigitos.length===8) raw=`${somenteDigitos.slice(0,2)}/${somenteDigitos.slice(2,4)}/${somenteDigitos.slice(4,8)}`;
  }
  const parts=raw.split(/[\/\-]/);
  if(parts.length!==3) return null;
  let [d,m,y]=parts;
  if(d.length>2 && y.length<=2){ const t=d; d=y; y=t; } // aceita AAAA-MM-DD digitado por engano
  d=d.padStart(2,'0'); m=m.padStart(2,'0');
  if(y.length===2) y='20'+y;
  if(y.length!==4 || d.length!==2 || m.length!==2) return null;
  const iso=`${y}-${m}-${d}`;
  const dt=new Date(iso+'T00:00:00');
  if(isNaN(dt.getTime())) return null;
  /* new Date() faz "rollover" silencioso de datas impossíveis (ex:
     31/02 vira 03/03) em vez de recusar — por isso confere se o que
     voltou bate exatamente com o que foi digitado, incluindo o caso de
     29/02 fora de ano bissexto. */
  if(dt.getFullYear()!==Number(y) || dt.getMonth()!==Number(m)-1 || dt.getDate()!==Number(d)) return null;
  return iso;
}
function askDate(mensagem, isoDefault){
  let br = prompt(mensagem, isoDefault?isoToBr(isoDefault):'');
  if(br===null) return undefined; // cancelado
  if(br.trim()===''){
    if(isoDefault) return isoDefault;
    return askDate('Data inválida ou vazia. Use o formato DD/MM/AAAA:\n'+mensagem, isoDefault);
  }
  const iso=brToIso(br);
  if(!iso) return askDate('Data inválida. Use o formato DD/MM/AAAA (ex: 05/08/2026):\n'+mensagem, isoDefault);
  return iso;
}

function normalizarHora(str){

  }

}

/* ================= PRÉVIA / FECHAMENTO FINANCEIRO POR EVENTO =================
   Fonte central de verdade financeira para Dashboard, Pagamentos e
   Relatórios — substitui o cálculo antigo baseado só em "staff"
   (eventos.dados.staff), que divergia do fechamento oficial por nunca
   consultar participacoes/fechamento_evento.
   REGRA: evento finalizado -> usa fechamento_evento (oficial, nunca
   substituído por prévia). Evento aberto -> calcula uma PRÉVIA a
   partir da escala efetiva (participacoes + participacao_dias via
   listar_escala_evento, mesma estrutura usada por escaladoNoDia()),
   multiplicando dias efetivamente escalados pela tarifa da função
   (getFuncaoRateForEvent, já existente). Participações anuladas nunca
   entram em nenhum dos dois casos. Não mexe em nenhum estado global
   (currentEventId/participacoesNovas/etc.) — busca os dados do evento
   pedido isoladamente, seguro para chamar em paralelo por vários
   eventos ao mesmo tempo (Dashboard/Relatórios mostram vários). */
async function getEventFinancials(ev){
  try{
    if(ev.status==='finalizado'){
      const [{data:fech,error:e1},{data:parts,error:e2}]=await Promise.all([
        sb.rpc('fechamento_evento',{p_evento_id:ev.id}),
        sb.rpc('listar_participacoes_evento',{p_evento_id:ev.id})
      ]);
      if(e1||e2){ console.error('Falha ao calcular fechamento de', ev.id, e1||e2); return {tipo:'indisponivel', valor:0, profissionais:0}; }
      const idsAnulados=new Set((parts||[]).filter(p=>p.anulada).map(p=>pid(p)));
      const linhas=(fech||[]).filter(f=>!idsAnulados.has(f.participacao_id));
      const total=linhas.reduce((s,f)=>s+(parseFloat(f.total_receber)||0),0);
      return {tipo:'fechamento', valor:total, profissionais:linhas.length};
    }
    const [{data:diasRaw,error:e1},{data:parts,error:e2},{data:esc,error:e3}]=await Promise.all([
      sb.from('evento_dias').select('*').eq('evento_id',ev.id),
      sb.rpc('listar_participacoes_evento',{p_evento_id:ev.id}),
      sb.rpc('listar_escala_evento',{p_evento_id:ev.id})
    ]);
    if(e1||e2||e3){ console.error('Falha ao calcular prévia de', ev.id, e1||e2||e3); return {tipo:'indisponivel', valor:0, profissionais:0}; }
    const dias=diasRaw||[];
    const participacoes=(parts||[]).filter(p=>!p.anulada);
    const escala=esc||[];
    let total=0, profissionais=0;
    participacoes.forEach(p=>{
      const diasEscalados=dias.filter(d=>{
        const r=escala.find(x=>String(x.participacao_id)===String(pid(p)) && String(x.evento_dia_id)===String(d.id));
        return !!(r&&r.escalado);
      }).length;
      if(diasEscalados>0){
        profissionais++;
        total += getFuncaoRateForEvent(ev, p.funcao) * diasEscalados;
      }
    });
    return {tipo:'previa', valor:total, profissionais};
  }catch(err){
    console.error('Erro em getEventFinancials:', err);
    return {tipo:'indisponivel', valor:0, profissionais:0};
  }
}

  /* Reage a login/logout só quando NÃO estamos num modo público — os
     links de interesse/status são renderizados uma vez e não dependem
     de sessão, então não devem ser re-renderizados por isso. */
  sb.auth.onAuthStateChange((_evt, sess)=>{
    gestorUnlocked = !!sess;
    if(!isPublicMode()){
      if(gestorUnlocked) renderShell(); else renderLoginScreen();
    }
  });
  events = (await sGet('events')) || [];
  events.forEach(e=>{
    if(!e.status) e.status='aberto';
    /* PROPOSITALMENTE não preenchemos mais "if(!e.dataFim) e.dataFim=e.data"
       aqui. Essa linha mascarava qualquer perda real de dataFim vinda do
       banco, fazendo um evento de vários dias aparecer silenciosamente
       como se fosse de 1 dia só, sem nenhum aviso — e não havia como
       distinguir "eventos antigos sem esse campo" de uma perda real.
       Todo evento salvo por openEventForm() já grava dataFim de forma
       explícita (inclusive igual a "data" quando é mesmo de 1 dia só),
       então esse preenchimento automático nunca deveria ser necessário
       no fluxo atual. formatPeriodo() e openEventForm() já tratam
       dataFim ausente sem quebrar, então não há risco em deixar de
       preencher aqui. */
    if(!e.linkValidoAte) e.linkValidoAte = e.dataFim || e.data;
    if(!e.valoresFuncao) e.valoresFuncao = [];
  });
  clients = (await sGet('clients')) || [];

  /* Modos públicos são identificados e tratados ANTES de qualquer
     verificação de sessão — link de interesse e link de status nunca
     exigem login do funcionário. */
  if(paramModo==='interesse' && paramEvento){
    currentEventId = paramEvento;
    renderPublic();
    return;
  }
  if(paramModo==='status' && paramEvento){
    currentEventId = paramEvento;
    renderPublicStatus();
    return;
  }
  if(paramModo==='cracha' && paramEvento){
    currentEventId = paramEvento;
    renderPublicCracha();
    return;
  }

  /* Fora dos modos públicos, o painel administrativo exige sessão. */
  if(!gestorUnlocked){
    renderLoginScreen();
    return;
  }

  renderShell();
}

/* ================= ETAPA 2 — dados novos (colaboradores/evento_dias/
   participacoes/participacao_dias/presencas) ================= */
async function loadDiasEscalaPresenca(){
  if(!currentEventId){ eventoDias=[]; participacoesNovas=[]; escalaDias=[]; presencasNovas=[]; fechamentoDados=[]; return; }
  const {data:dias,error:errDias}=await sb.from('evento_dias').select('*').eq('evento_id',currentEventId).order('data',{ascending:true});
  if(errDias) console.error('Erro ao consultar evento_dias:', errDias);
  ultimoErroEventoDias = errDias ? (errDias.message||'erro desconhecido') : null;
  eventoDias=dias||[];
  if(diaSelecionadoPresenca==null && eventoDias.length) diaSelecionadoPresenca=eventoDias[0].id;
  if(!gestorUnlocked){ participacoesNovas=[]; escalaDias=[]; presencasNovas=[]; fechamentoDados=[]; return; }
  try{
    const [{data:parts,error:e1},{data:esc,error:e2},{data:pres,error:e3},{data:fech,error:e4}]=await Promise.all([
      sb.rpc('listar_participacoes_evento',{p_evento_id:currentEventId}),
      sb.rpc('listar_escala_evento',{p_evento_id:currentEventId}),
      sb.rpc('listar_presencas_evento',{p_evento_id:currentEventId}),
      sb.rpc('fechamento_evento',{p_evento_id:currentEventId})
    ]);
    if(e1) throw e1; if(e2) throw e2; if(e3) throw e3; if(e4) throw e4;
    participacoesNovas=parts||[]; escalaDias=esc||[]; presencasNovas=pres||[];
    /* Participações anuladas nunca entram no fechamento financeiro —
       filtradas AQUI, num único ponto central, para propagar
       automaticamente para toda tela que lê fechamentoDados
       (Fechamento Financeiro, Impressão p/ Presidência, Aprovação do
       Gestor, impressões) sem precisar alterar cada uma
       separadamente. O check-in/checkout original continua intacto
       em presencasNovas (nunca filtrado) — só o cálculo financeiro
       ignora quem está anulado. Cruza por participacao_id, com
       fallback seguro: se a coluna "anulada" ainda não existir no
       retorno da RPC (antes do SQL desta rodada ser aplicado), o
       filtro não remove ninguém, comportamento idêntico ao atual. */
    const idsAnulados=new Set(participacoesNovas.filter(p=>p.anulada).map(p=>pid(p)));
    fechamentoDados=(fech||[]).filter(f=>!idsAnulados.has(f.participacao_id));
  }catch(err){
    console.error(err);
    participacoesNovas=[]; escalaDias=[]; presencasNovas=[]; fechamentoDados=[];
  }
}
function escaladoNoDia(participacaoId, eventoDiaId){
  const r=escalaDias.find(x=>String(x.participacao_id)===String(participacaoId) && String(x.evento_dia_id)===String(eventoDiaId));
  return !!(r && r.escalado);
}
function presencaDoDia(participacaoId, eventoDiaId){
  return presencasNovas.find(x=>String(x.participacao_id)===String(participacaoId) && String(x.evento_dia_id)===String(eventoDiaId)) || null;
}
/* listar_participacoes_evento pode retornar o identificador da
   participação como "id" ou como "participacao_id" — usar sempre esta
   função em vez de acessar p.participacao_id direto, para não silenciar
   a leitura com undefined quando o nome do campo for outro. */
function pid(p){ return (p.participacao_id!=null) ? p.participacao_id : p.id; }
/* listar_presencas_evento() e fechamento_evento() são RPCs diferentes;
   fechamento_evento() já mostra corretamente o valor em "horas_extras"
   (plural). Se listar_presencas_evento() retornar o campo com outro
   nome (ex: "horas_extras" em vez de "horas_extra"), o Checkout ficava
   sempre achando que não tinha sido informado ainda, mesmo já salvo —
   por isso lê os dois nomes possíveis, sem inventar um cálculo novo. */
function horasExtraDe(pr){ return (pr && pr.horas_extra!=null) ? pr.horas_extra : (pr && pr.horas_extras!=null ? pr.horas_extras : null); }
async function chamarRpcGestor(nome, params){
  try{
    const {data,error}=await sb.rpc(nome, params);
    if(error) throw error;
    return {ok:true, data};
  }catch(err){
    console.error(err);
    showToast('Erro: '+(err.message||'não foi possível concluir a ação.'));
    return {ok:false, error:err};
  }
}

/* Autenticação real do gestor via Supabase Auth (substitui o PIN
   client-side em app_kv). O ponto de entrada na navegação não muda —
   continua sendo o mesmo item "Modo Gestor"/attachLockHandler; só o
   que acontece por trás é diferente agora. */
async function tryUnlockGestor(){
  if(gestorUnlocked) return true;
  const email = prompt('E-mail do gestor:');
  if(!email || !email.trim()) return false;
  const senha = prompt('Senha:');
  if(!senha) return false;
  const {data,error} = await sb.auth.signInWithPassword({email:email.trim(), password:senha});
  if(error){ showToast('Login inválido: '+error.message); return false; }
  gestorUnlocked = !!(data && data.session);
  if(gestorUnlocked){ showToast('Área do gestor desbloqueada.'); await loadDiasEscalaPresenca(); }
  else showToast('Não foi possível entrar.');
  return gestorUnlocked;
}
async function lockGestor(){
  await sb.auth.signOut();
  gestorUnlocked=false;
  participacoesNovas=[]; escalaDias=[]; presencasNovas=[];
  showToast('Área do gestor bloqueada.');
}
function lockScreenHtml(msg){
  return `<div class="empty"><b>Área restrita ao gestor</b>${msg||'Esses dados só ficam visíveis para quem tem a senha do gestor.'}<div style="margin-top:14px;"><button class="btn btn-amber btn-sm" id="btnUnlockGestor">Desbloquear com a senha do gestor</button></div></div>`;
}
function attachLockHandler(onUnlock){
  const btn=document.getElementById('btnUnlockGestor');
  if(btn) btn.onclick=async ()=>{ if(await tryUnlockGestor()) onUnlock(); };
}

async function getEventStats(id){
  if(eventStatsCache[id]) return eventStatsCache[id];
  const ev=events.find(e=>e.id===id);
  const s=(await sGet('staff:'+id))||[]; const it=(await sGet('interessados:'+id))||[];
  const escaladosCount=s.filter(c=>c.escalado).length;
  const valorTotal=s.filter(c=>c.escalado&&c.compareceu).reduce((sum,c)=>sum+calcValor(c,ev),0);
  const semFechamento = s.filter(c=>c.escalado).length===0;
  const pendentesPagamento = s.filter(c=>c.escalado&&c.compareceu&&!c.pago).length;
  const stats={escaladosCount,valorTotal,interessadosCount:it.filter(p=>(p.status||'pendente')==='pendente').length,semFechamento,pendentesPagamento};
  eventStatsCache[id]=stats; return stats;
}

/* ================= PUBLIC INTEREST FORM (no sidebar) ================= */
function renderPublic(alreadySent){
  document.querySelector('.mobile-topbar').style.display='none';

  const root=document.getElementById('shell');
  const ev=currentEvent();

  if(!ev){
    root.innerHTML='<div class="wrap-narrow"><div class="interesse-page"><div class="empty"><b>Evento não encontrado</b> O link pode estar incorreto ou o evento foi removido.</div></div></div>';
    return;
  }

  if(alreadySent){
    root.innerHTML=`<div class="wrap-narrow"><div class="interesse-page"><div class="success-box"><div class="check">✓</div><div class="ev-name">Seu interesse em participar deste evento foi confirmado!</div><div class="ev-meta" style="margin-bottom:0;">Aguarde a confirmação da organização.</div></div></div></div>`;
    return;
  }

  if(ev.linkValidoAte && todayISO() > ev.linkValidoAte){
    root.innerHTML=`<div class="wrap-narrow"><div class="interesse-page"><div class="empty"><b>Link expirado</b> O prazo para registrar interesse neste evento (até ${formatDate(ev.linkValidoAte)}) já passou. Fale com o supervisor caso ainda tenha interesse.</div></div></div>`;
    return;
  }

  root.innerHTML=`
    <div class="wrap-narrow">
      <div class="interesse-page">

        <div class="ev-name">${escapeHtml(ev.evento)}</div>
        <div class="ev-meta">${ev.dataFim && ev.dataFim!==ev.data ? `Data do evento: ${formatDate(ev.data)} a ${formatDate(ev.dataFim)}` : `Data do evento: ${formatDate(ev.data)}`}</div>

        <div class="field">
          <label style="font-size:11px;color:var(--muted);text-transform:uppercase;">CPF</label>
          <input
            type="text"
            id="intCpf"
            placeholder="000.000.000-00"
            maxlength="14"
          >
        </div>

        <button
          class="btn btn-amber"
          id="btnVerificarCpf"
          style="width:100%;padding:12px;"
        >
          Verificar CPF
        </button>

        <div id="resultadoAutorizacao" style="margin-top:16px;"></div>

      </div>
    </div>
  `;

  const intCpfEl=document.getElementById('intCpf');
  intCpfEl.oninput=()=>maskCpfInput(intCpfEl);

  document.getElementById('btnVerificarCpf').onclick=async ()=>{

    const cpf=document.getElementById('intCpf').value.trim();

    if(!cpf){
      showToast('Informe seu CPF.');
      return;
    }

    const cpfLimpo=cpf.replace(/\D/g,'');

    if(cpfLimpo.length!==11){
      showToast('Informe um CPF válido.');
      return;
    }

    const btn=document.getElementById('btnVerificarCpf');
    const resultado=document.getElementById('resultadoAutorizacao');

    btn.disabled=true;
    btn.textContent='Verificando...';

    try{

      const {data,error}=await sb.rpc(
        'verificar_cpf_autorizado',
        {
          p_evento_id: ev.id,
          p_cpf: cpfLimpo
        }
      );

      if(error) throw error;

      const registro=Array.isArray(data) ? data[0] : data;

      if(!registro || registro.autorizado!==true){

        resultado.innerHTML=`
          <div class="empty">
            <b>CPF não autorizado</b><br>
            Este CPF não está autorizado para trabalhar neste evento.
            Entre em contato com o responsável pelo evento.
          </div>
        `;

        btn.disabled=false;
        btn.textContent='Verificar CPF';
        return;
      }

      resultado.innerHTML=`<div class="empty"><b>Verificando dados já cadastrados...</b></div>`;

      /* Fluxo integrado desta rodada: só para Vigilantes (inclusive
         líder, mesma classificação usada em todo o sistema). Consulta
         o Banco de Colaboradores (RPC pública, só leitura) para
         decidir quais campos de crachá ainda faltam — nunca pede de
         novo o que já está completo e válido. Para as demais funções,
         o formulário permanece exatamente como já era. */
      const ehVigilante=baseDaFuncaoDisplay(normalizaFuncaoDisplay(registro.funcao))==='VIGILANTE';
      /* BRIGADISTA EVENTUAL — fluxo NOVO, completamente isolado do
         Vigilante: bloco próprio que renderiza seu formulário, monta
         seu handler e retorna, nunca chegando ao código de Vigilante
         logo abaixo. Zero mistura de variáveis/regras entre os dois.
         Reaproveita buscar_dados_colaborador_banco (RPC genérica, já
         existente, sem nada específico de Vigilante) só para não
         pedir de novo o que já estiver completo. */
      const ehBrigadista=baseDaFuncaoDisplay(normalizaFuncaoDisplay(registro.funcao))==='BRIGADISTA';
      if(ehBrigadista){
        let bancoExistenteBrig=null;
        try{
          const {data:bancoData,error:bancoErr}=await sb.rpc('buscar_dados_colaborador_banco',{p_cpf:cpfLimpo});
          if(bancoErr) throw bancoErr;
          bancoExistenteBrig=Array.isArray(bancoData) ? bancoData[0] : bancoData;
        }catch(bancoErr){
          console.error('Falha ao consultar Banco de Colaboradores (Brigadista):', bancoErr);
        }
        const precisaIdentidadeBrig = !(bancoExistenteBrig && bancoExistenteBrig.identidade);
        const precisaVencimentoBrig = !(bancoExistenteBrig && bancoExistenteBrig.reciclagem && reciclagemValidaAteFinalEvento(bancoExistenteBrig.reciclagem, ev));
        const precisaRegistroBrig   = !(bancoExistenteBrig && bancoExistenteBrig.numero_registro_brigadista);
        const precisaCidadeBrig     = !(bancoExistenteBrig && bancoExistenteBrig.cidade);

        resultado.innerHTML=`
          <div class="success-box">
            <div class="check">✓</div>
            <div class="ev-name">CPF autorizado</div>
            <div class="ev-meta" style="margin-top:10px;"><b>Função autorizada:</b> ${escapeHtml(registro.funcao || '')}</div>
            <div class="field" style="margin-top:16px; text-align:left;">
              <label style="font-size:11px;color:var(--muted);text-transform:uppercase;">Nome completo</label>
              <input type="text" id="brigNome" value="${escapeHtml((bancoExistenteBrig&&bancoExistenteBrig.nome)||registro.nome||'')}" placeholder="Seu nome completo">
            </div>
            <div class="field" style="text-align:left;">
              <label style="font-size:11px;color:var(--muted);text-transform:uppercase;">Celular/WhatsApp (obrigatório a cada evento)</label>
              <input type="text" id="brigTelefone" value="${escapeHtml((bancoExistenteBrig&&bancoExistenteBrig.telefone)?formatTelefone(bancoExistenteBrig.telefone):'')}" placeholder="(00) 0 0000-0000" inputmode="numeric" maxlength="16">
            </div>
            ${precisaIdentidadeBrig?`
            <div class="field" style="text-align:left;">
              <label style="font-size:11px;color:var(--muted);text-transform:uppercase;">RG</label>
              <input type="text" id="brigIdentidade" placeholder="UF-N.NNN.NNN">
            </div>`:''}
            ${precisaVencimentoBrig?`
            <div class="field" style="text-align:left;">
              <label style="font-size:11px;color:var(--muted);text-transform:uppercase;">Data de vencimento do curso</label>
              <input type="date" id="brigVencimento">
            </div>`:''}
            ${precisaRegistroBrig?`
            <div class="field" style="text-align:left;">
              <label style="font-size:11px;color:var(--muted);text-transform:uppercase;">Nº de registro do Brigadista</label>
              <input type="text" id="brigRegistro" placeholder="Ex: F0007596">
            </div>`:''}
            ${precisaCidadeBrig?`
            <div class="field" style="text-align:left;">
              <label style="font-size:11px;color:var(--muted);text-transform:uppercase;">Cidade</label>
              <input type="text" id="brigCidade" placeholder="Sua cidade">

        const brigIdentidadeEl=document.getElementById('brigIdentidade');

        document.getElementById('btnConfirmarParticipacaoBrig').onclick=async ()=>{

          if(precisaIdentidadeBrig){

            if(!identidade){ erroBox.textContent='Informe o RG.'; return; }
            if(!identidadeValida(identidade)){ erroBox.textContent='RG INCOMPLETO OU EM FORMATO INVÁLIDO. USE UF-N.NNN.NNN.'; return; }
          }
          if(precisaVencimentoBrig){
            vencimento=document.getElementById('brigVencimento').value;
            if(!vencimento){ erroBox.textContent='DATA DE VENCIMENTO DO CURSO É OBRIGATÓRIA.'; return; }
          }
          if(precisaRegistroBrig){
            registro_=document.getElementById('brigRegistro').value.trim();
            if(!registro_){ erroBox.textContent='Nº DE REGISTRO DO BRIGADISTA É OBRIGATÓRIO.'; return; }

              if(exErr) throw exErr;

      const precisaIdentidade = ehVigilante && !(bancoExistente && bancoExistente.identidade);

      const precisaReciclagem = ehVigilante && !(bancoExistente && bancoExistente.reciclagem && reciclagemValidaAteFinalEvento(bancoExistente.reciclagem, ev));
      const precisaCidade     = ehVigilante && !(bancoExistente && bancoExistente.cidade);

          <div class="check">✓</div>
          <div class="ev-name">CPF autorizado</div>
          <div class="ev-meta" style="margin-top:10px;"><b>Função autorizada:</b> ${escapeHtml(registro.funcao || '')}</div>
          <div class="field" style="margin-top:16px; text-align:left;">
            <label style="font-size:11px;color:var(--muted);text-transform:uppercase;">Nome completo</label>
            <input type="text" id="intNome" value="${escapeHtml((bancoExistente&&bancoExistente.nome)||registro.nome||'')}" placeholder="Seu nome completo">
          </div>
          <div class="field" style="text-align:left;">
            <label style="font-size:11px;color:var(--muted);text-transform:uppercase;">Celular/WhatsApp (obrigatório a cada evento)</label>
            <input type="text" id="intTelefone" value="${escapeHtml((bancoExistente&&bancoExistente.telefone)?formatTelefone(bancoExistente.telefone):'')}" placeholder="(00) 0 0000-0000" inputmode="numeric" maxlength="16">
          </div>
          ${precisaIdentidade?`
          <div class="field" style="text-align:left;">
            <label style="font-size:11px;color:var(--muted);text-transform:uppercase;">RG</label>
            <input type="text" id="intIdentidade" placeholder="UF-N.NNN.NNN">
          </div>`:''}
          ${precisaReciclagem?`
          <div class="field" style="text-align:left;">
            <label style="font-size:11px;color:var(--muted);text-transform:uppercase;">Data de vencimento da reciclagem/curso</label>
            <input type="date" id="intReciclagem">
          </div>`:''}
          ${precisaCidade?`
          <div class="field" style="text-align:left;">
            <label style="font-size:11px;color:var(--muted);text-transform:uppercase;">Cidade</label>
            <input type="text" id="intCidade" placeholder="Sua cidade">
          </div>`:''}
          ${precisaGrandesEventos?`
          <div class="field" style="text-align:left;">
            <label style="font-size:11px;color:var(--muted);text-transform:uppercase;">Grandes eventos</label>
            <select id="intGrandesEventos">
              <option value="">Selecione</option>
              <option value="sim">Sim</option>
              <option value="nao">Não</option>
            </select>
          </div>`:''}
          ${precisaNumeroDpf?`
          <div class="field" style="text-align:left;">
            <label style="font-size:11px;color:var(--muted);text-transform:uppercase;">Nº DPF</label>
            <input type="text" id="intNumeroDpf" placeholder="1234567/8901">
          </div>`:''}
          <button class="btn btn-amber" id="btnConfirmarParticipacao" style="width:100%;padding:12px;margin-top:10px;">Confirmar participação</button>
          <div id="erroParticipacao" style="margin-top:10px;color:var(--red);font-size:12.5px;"></div>
        </div>
      `;

      btn.style.display='none';

      const intTelefoneEl=document.getElementById('intTelefone');
      intTelefoneEl.oninput=()=>maskTelefoneInput(intTelefoneEl);
      const intNomeEl=document.getElementById('intNome');
      /* Nome do colaborador sempre em CAIXA ALTA — convertido enquanto
         digita, preservando a posição do cursor. */
      intNomeEl.oninput=()=>{
        const pos=intNomeEl.selectionStart;
        intNomeEl.value=intNomeEl.value.toUpperCase();
        intNomeEl.setSelectionRange(pos,pos);
      };
      const intNumeroDpfEl=document.getElementById('intNumeroDpf');
      if(intNumeroDpfEl) intNumeroDpfEl.oninput=()=>maskNumeroDpfInput(intNumeroDpfEl);
      const intIdentidadeEl=document.getElementById('intIdentidade');
      if(intIdentidadeEl) intIdentidadeEl.oninput=()=>maskIdentidadeInput(intIdentidadeEl);

      document.getElementById('btnConfirmarParticipacao').onclick=async ()=>{
        const nome=nomeExibicao(document.getElementById('intNome').value);
        const telefoneDigits=document.getElementById('intTelefone').value.replace(/\D/g,'');
        const erroBox=document.getElementById('erroParticipacao');
        const btnConfirmar=document.getElementById('btnConfirmarParticipacao');
        erroBox.innerHTML='';
        if(telefoneDigits.length!==11){ erroBox.textContent='Informe um telefone celular válido.'; return; }

        /* Campos extras de crachá (só quando exibidos nesta rodada) —
           mesma ordem de validação já usada no link específico de
           crachá: presença -> completude da máscara -> validade da
           reciclagem -> só então salva. RG/Identidade RESTAURADO
           nesta rodada — voltou a ser obrigatório, novo formato
           UF-N.NNN.NNN/UF-NN.NNN.NNN. Nº DPF continua obrigatório. */
        let identidade=null, reciclagem=null, numeroDpf=null;
        if(precisaIdentidade){
          identidade=formatIdentidadeMG(document.getElementById('intIdentidade').value);
          if(!identidade){ erroBox.textContent='Informe o RG.'; return; }
          if(!identidadeValida(identidade)){ erroBox.textContent='RG INCOMPLETO OU EM FORMATO INVÁLIDO. USE UF-N.NNN.NNN.'; return; }
        }
        if(precisaReciclagem){
          reciclagem=document.getElementById('intReciclagem').value;
          if(!reciclagem){ erroBox.textContent='DATA DE VENCIMENTO DA RECICLAGEM/CURSO É OBRIGATÓRIA.'; return; }
          if(!reciclagemValidaAteFinalEvento(reciclagem, ev)){
            const dataFinal=ev.dataFim||ev.data;
            erroBox.innerHTML=`<b>RECICLAGEM FORA DO PRAZO DE VALIDADE</b><br>DATA DE VENCIMENTO DA RECICLAGEM/CURSO: ${formatDate(reciclagem)}<br>O documento precisa continuar válido até ${formatDate(dataFinal)} (fim do evento).`;
            return;
          }
        }
        if(precisaNumeroDpf){
          const numeroDpfDigitado=document.getElementById('intNumeroDpf').value.trim();
          if(!numeroDpfDigitado){ erroBox.textContent='Nº DPF É OBRIGATÓRIO.'; return; }
          numeroDpf=formatNumeroDpfMG(numeroDpfDigitado);
          if(contarDigitos(numeroDpf)<11){ erroBox.textContent='Nº DPF INCOMPLETO. PREENCHA TODOS OS NÚMEROS.'; return; }
        }
        let cidade=null, grandesEventos=null;
        if(precisaCidade){
          cidade=document.getElementById('intCidade').value.trim();
          if(!cidade){ erroBox.textContent='Informe a cidade.'; return; }
        }
        if(precisaGrandesEventos){
          const valorGrandesEventos=document.getElementById('intGrandesEventos').value;
          if(!valorGrandesEventos){ erroBox.textContent='Selecione se participa de grandes eventos.'; return; }
          grandesEventos = valorGrandesEventos==='sim';
        }

        btnConfirmar.disabled=true; btnConfirmar.textContent='Enviando...';
        try{
          const {data:pdata,error:perror}=await sb.rpc('registrar_participacao',{
            p_evento_id: ev.id, p_cpf: cpfLimpo, p_nome: nome, p_telefone: telefoneDigits
          });
          if(perror) throw perror;
          /* Alimenta a Pré-Escala existente (tabela "interessados"), sem
             duplicar: só insere se ainda não houver um registro deste
             CPF neste evento. Inserção direta e pontual (não usa
             sSet/saveInteressados, que apaga e reinsere TODA a lista do
             evento — inadequado aqui, pois rodaria sem o restante da
             lista carregado e apagaria decisões já tomadas pelo gestor).
             Não bloqueia a confirmação por causa disso — a Pré-Escala é
             coadjuvante aqui, o essencial é confirmar a participação e
             o cadastro no Banco (abaixo, que SIM bloqueia). */
          try{
            const {data:existente,error:exErr}=await sb.from('interessados')
              .select('id').eq('evento_id', ev.id).eq('cpf', cpfLimpo).maybeSingle();
            if(exErr) throw exErr;
            if(!existente){
              const {error:insErr}=await sb.from('interessados').insert({
                evento_id: ev.id, nome, cpf: cpfLimpo, telefone: telefoneDigits, funcao: registro.funcao||'', status:'pendente'
              });
              if(insErr) throw insErr;
            }
          }catch(preEscalaErr){
            console.error('Falha ao registrar na Pré-Escala:', preEscalaErr);
          }
          /* Marca em CPFs Autorizados que este colaborador realmente
             concluiu o cadastro pelo link e atualiza o nome completo —
             RPC própria, restrita (só atualiza registro JÁ autorizado).
             Também não bloqueia por conta própria — mas se o passo
             seguinte (Banco de Colaboradores) falhar, o erro geral
             ainda impede a tela de sucesso. */
          try{
            const {error:erroConcluido}=await sb.rpc('marcar_cadastro_concluido_cpf_autorizado',{p_evento_id:ev.id, p_cpf:cpfLimpo, p_nome:nome});
            if(erroConcluido) throw erroConcluido;
          }catch(concluidoErr){
            console.error('Falha ao marcar cadastro concluído em CPFs Autorizados:', concluidoErr);
          }
          /* CORREÇÃO DESTA RODADA — este é o passo que passou a ser
             BLOQUEANTE: antes, se salvar_colaborador_cracha falhasse
             aqui, o erro só ia pro console e a tela mostrava sucesso
             mesmo assim (o colaborador via "confirmado", mas o Banco
             de Colaboradores nunca era realmente atualizado). Agora, o
             erro sobe para o catch externo — só mostramos a tela de
             sucesso se o cadastro no Banco realmente foi salvo.
             Campos não coletados nesta rodada (já completos/válidos no
             Banco) vão como null: o upsert preserva o que existir,
             nunca apaga por causa de um campo vazio — mas os campos
             OBRIGATÓRIOS para o estado final (depois do COALESCE) são
             validados dentro da própria RPC agora (ver SQL entregue). */
          if(ehVigilante){
            const {error:erroBanco}=await sb.rpc('salvar_colaborador_cracha_v3',{
              p_evento_id:ev.id, p_cpf:cpfLimpo, p_nome:nome, p_funcao:registro.funcao, p_telefone:telefoneDigits,
              p_identidade:identidade, p_data_curso:null, p_reciclagem:reciclagem, p_numero_dpf:numeroDpf,
              p_cidade:cidade, p_grandes_eventos:grandesEventos
            });
            if(erroBanco) throw erroBanco;
          } else {
            /* Brigadistas e demais funções também passam a atualizar o
               cadastro básico (nome/telefone/função) no Banco — antes,
               só Vigilante passava por aqui, causa confirmada de vários
               colaboradores ficarem com colaboradores.funcao=NULL. Sem
               pedir nenhum dado extra de crachá (esses continuam
               exclusivos de Vigilante). */
            const {error:erroBancoBasico}=await sb.rpc('salvar_colaborador_cracha_v3',{
              p_evento_id:ev.id, p_cpf:cpfLimpo, p_nome:nome, p_funcao:registro.funcao, p_telefone:telefoneDigits
            });
            if(erroBancoBasico) throw erroBancoBasico;
          }
          renderPublic(true);
        }catch(err){
          console.error('Erro ao confirmar participação:', err);
          erroBox.innerHTML=`<b>NÃO FOI POSSÍVEL CONFIRMAR A PARTICIPAÇÃO</b><br>${formatarErroSupabase(err)}`;
          btnConfirmar.disabled=false; btnConfirmar.textContent='Confirmar participação';
        }
      };

    }catch(error){

      console.error(error);

      resultado.innerHTML=`
        <div class="empty">
          <b>Não foi possível verificar o CPF.</b><br>
          Tente novamente.
        </div>
      `;

      btn.disabled=false;
      btn.textContent='Verificar CPF';
    }
  };
}

/* ================= PUBLIC CRACHÁ (link específico do evento) =================
   Link: ?modo=cracha&evento=ID. Fonte de validação: staff[] (Escala
   Oficial) do evento — NUNCA Pré-Escala/CPFs Autorizados. Depende das
   RPCs 'verificar_cpf_escalado_evento' e 'salvar_colaborador_cracha'
   (anon+authenticated) — ver observação sobre Supabase no relatório
   desta rodada; ainda não criadas no banco. */
function renderPublicCracha(){
  document.querySelector('.mobile-topbar').style.display='none';
  const root=document.getElementById('shell');
  const ev=currentEvent();

  if(!ev){
    root.innerHTML='<div class="wrap-narrow"><div class="interesse-page"><div class="empty"><b>Evento não encontrado</b> O link pode estar incorreto ou o evento foi removido.</div></div></div>';
    return;
  }

  root.innerHTML=`
    <div class="wrap-narrow">
      <div class="interesse-page">
        <div class="ev-name">${escapeHtml(ev.evento)}</div>
        <div class="ev-meta" style="margin-bottom:14px;">Preenchimento de dados para crachá</div>

        <div class="field">
          <label style="font-size:11px;color:var(--muted);text-transform:uppercase;">CPF</label>
          <input type="text" id="crachaCpf" placeholder="000.000.000-00" maxlength="14">
        </div>
        <div id="erroCpfCracha" style="color:var(--red); font-size:13px; margin-bottom:8px;"></div>
        <button class="btn btn-amber" id="btnVerificarCrachaCpf" style="width:100%;padding:12px;">Verificar CPF</button>
        <div id="resultadoCracha" style="margin-top:16px;"></div>
      </div>
    </div>
  `;

  const cpfInp=document.getElementById('crachaCpf');
  cpfInp.oninput=()=>maskCpfInput(cpfInp);

  document.getElementById('btnVerificarCrachaCpf').onclick=async ()=>{
    const erroCpfBox=document.getElementById('erroCpfCracha');
    erroCpfBox.textContent='';
    const cpfLimpo=cpfInp.value.replace(/\D/g,'');
    if(cpfLimpo.length!==11){ erroCpfBox.textContent='CPF INVÁLIDO. VERIFIQUE OS NÚMEROS INFORMADOS.'; return; }

    const btn=document.getElementById('btnVerificarCrachaCpf');
    const resultado=document.getElementById('resultadoCracha');
    btn.disabled=true; btn.textContent='Verificando...';

    try{
      const {data,error}=await sb.rpc('verificar_cpf_escalado_evento',{p_evento_id:ev.id, p_cpf:cpfLimpo});
      if(error) throw error;
      const registro=Array.isArray(data) ? data[0] : data;

      if(!registro || registro.escalado!==true){
        resultado.innerHTML=`<div class="empty"><b>ESTE CPF NÃO ESTÁ NA ESCALA OFICIAL DESTE EVENTO E NÃO PODE REALIZAR O CADASTRO DO CRACHÁ.</b><br>Fale com o responsável pelo evento.</div>`;
        btn.disabled=false; btn.textContent='Verificar CPF';
        return;
      }

      /* Dados já existentes (Escala Oficial e/ou Banco de
         Colaboradores) pré-preenchem o formulário; o colaborador só
         completa o que faltar. Sem foto, sem telefone, sem e-mail,
         sem data de nascimento — só o que o crachá realmente usa. */
      resultado.innerHTML=`
        <div class="success-box">
          <div class="check">✓</div>
          <div class="ev-name">CPF encontrado na escala</div>
          <div class="field" style="margin-top:16px; text-align:left;">
            <label style="font-size:11px;color:var(--muted);text-transform:uppercase;">Nome completo</label>
            <input type="text" id="crachaNome" value="${escapeHtml(registro.nome||'')}" placeholder="Nome completo">
          </div>
          <div class="field" style="text-align:left;">
            <label style="font-size:11px;color:var(--muted);text-transform:uppercase;">RG</label>
            <input type="text" id="crachaIdentidade" value="${escapeHtml(formatIdentidadeMG(registro.identidade||''))}" placeholder="UF-N.NNN.NNN">
          </div>
          <div class="field" style="text-align:left;">
            <label style="font-size:11px;color:var(--muted);text-transform:uppercase;">Data de vencimento da reciclagem/curso</label>
            <input type="date" id="crachaReciclagem" value="${escapeHtml(registro.reciclagem||'')}">
          </div>
          <div class="field" style="text-align:left;">
            <label style="font-size:11px;color:var(--muted);text-transform:uppercase;">Nº DPF</label>
            <input type="text" id="crachaNumeroDpf" value="${escapeHtml(formatNumeroDpfMG(registro.numero_dpf||''))}" placeholder="1234567/8901">
          </div>
          <div id="erroCracha" style="color:var(--red); font-size:13px; margin-top:8px;"></div>
          <button class="btn btn-teal" id="btnSalvarCracha" style="width:100%;padding:12px;margin-top:8px;">Salvar dados do crachá</button>
        </div>
      `;

      const identidadeInp=document.getElementById('crachaIdentidade');
      identidadeInp.oninput=()=>maskIdentidadeInput(identidadeInp);
      const dpfInp=document.getElementById('crachaNumeroDpf');
      dpfInp.oninput=()=>maskNumeroDpfInput(dpfInp);

      const marcarCampo=(el, invalido)=>{ el.style.borderColor = invalido ? 'var(--red)' : ''; };

      document.getElementById('btnSalvarCracha').onclick=async ()=>{
        const nomeEl=document.getElementById('crachaNome');
        const identidadeEl=document.getElementById('crachaIdentidade');
        const reciclagemEl=document.getElementById('crachaReciclagem');
        const numeroDpfEl=document.getElementById('crachaNumeroDpf');
        const erroBox=document.getElementById('erroCracha');
        const btnSalvar=document.getElementById('btnSalvarCracha');
        erroBox.innerHTML='';
        [nomeEl,identidadeEl,reciclagemEl,numeroDpfEl].forEach(el=>marcarCampo(el,false));

        const nome=nomeExibicao(nomeEl.value);
        const identidade=formatIdentidadeMG(identidadeEl.value);
        const reciclagem=reciclagemEl.value;
        const numeroDpf=formatNumeroDpfMG(numeroDpfEl.value);

        /* ORDEM DAS VALIDAÇÕES, TODAS ANTES DE CHAMAR O SUPABASE:
           1) presença dos campos obrigatórios (RG/Identidade
           RESTAURADO nesta rodada; Nº DPF continua obrigatório);
           2) completude do RG e do Nº DPF; 3) validade da Reciclagem
           contra o período do evento (regra direta, sem +2 anos). */
        const faltando=[];
        if(!nome) faltando.push({el:nomeEl, rotulo:'NOME COMPLETO'});
        if(!identidade) faltando.push({el:identidadeEl, rotulo:'RG'});
        if(!reciclagem) faltando.push({el:reciclagemEl, rotulo:'DATA DE VENCIMENTO DA RECICLAGEM/CURSO'});
        if(!numeroDpf) faltando.push({el:numeroDpfEl, rotulo:'Nº DPF'});
        if(faltando.length){
          faltando.forEach(f=>marcarCampo(f.el,true));
          erroBox.innerHTML=`<b>NÃO FOI POSSÍVEL SALVAR OS DADOS</b><br>CORRIJA OS SEGUINTES CAMPOS:<br>${faltando.map(f=>'• '+f.rotulo).join('<br>')}`;
          return;
        }

        const incompletos=[];
        if(!identidadeValida(identidade)){ incompletos.push('RG EM FORMATO INVÁLIDO. USE UF-N.NNN.NNN.'); marcarCampo(identidadeEl,true); }
        if(contarDigitos(numeroDpf)<11){ incompletos.push('Nº DPF INCOMPLETO. PREENCHA TODOS OS NÚMEROS.'); marcarCampo(numeroDpfEl,true); }
        if(incompletos.length){
          erroBox.innerHTML=incompletos.join('<br>');
          return;
        }

        const validacaoReciclagem=validarReciclagemParaEvento(reciclagem, ev);
        if(!validacaoReciclagem.valido){
          marcarCampo(reciclagemEl,true);
          erroBox.innerHTML=`<b>RECICLAGEM FORA DO PRAZO DE VALIDADE</b><br>
            DATA DE VENCIMENTO DA RECICLAGEM/CURSO: ${formatDate(reciclagem)}<br>
            PERÍODO DO EVENTO: ${formatDate(validacaoReciclagem.dataInicial)} ATÉ ${formatDate(validacaoReciclagem.dataFinal)}<br>
            A RECICLAGEM PRECISA TER VENCIMENTO IGUAL OU POSTERIOR AO FINAL DO EVENTO.`;
          return;
        }

        btnSalvar.disabled=true; btnSalvar.textContent='Salvando...';

        try{
          const {error:erroSalvar}=await sb.rpc('salvar_colaborador_cracha_v3',{
            p_evento_id:ev.id, p_cpf:cpfLimpo, p_nome:nome, p_funcao:registro.funcao,
            p_identidade:identidade, p_reciclagem:reciclagem, p_numero_dpf:numeroDpf
          });
          if(erroSalvar) throw erroSalvar;

          /* Mesma marcação de "cadastro concluído" + atualização de
             nome em CPFs Autorizados usada no link principal — não
             bloqueia em caso de falha. */
          try{
            const {error:erroConcluido}=await sb.rpc('marcar_cadastro_concluido_cpf_autorizado',{p_evento_id:ev.id, p_cpf:cpfLimpo, p_nome:nome});
            if(erroConcluido) throw erroConcluido;
          }catch(concluidoErr){
            console.error('Falha ao marcar cadastro concluído em CPFs Autorizados:', concluidoErr);
          }

          resultado.innerHTML=`<div class="success-box"><div class="check">✓</div><div class="ev-name">DADOS SALVOS COM SUCESSO!</div><div class="ev-meta" style="margin-bottom:0;">Seu cadastro para o crachá foi atualizado.</div></div>`;
        }catch(err){
          console.error('Erro ao salvar cadastro do crachá:', err);
          erroBox.innerHTML=`<b>NÃO FOI POSSÍVEL SALVAR O CADASTRO</b><br>${formatarErroSupabase(err)}`;
          btnSalvar.disabled=false; btnSalvar.textContent='Salvar dados do crachá';
        }
      };

    }catch(err){
      console.error('Erro ao verificar CPF do crachá:', err);
      resultado.innerHTML=`<div class="empty"><b>OCORREU UM ERRO AO VERIFICAR O CPF</b><br>${formatarErroSupabase(err)}</div>`;
      btn.disabled=false; btn.textContent='Verificar CPF';
    }
  };
}

/* ================= PUBLIC STATUS CHECK (no sidebar) ================= */
function renderPublicStatus(){
  document.querySelector('.mobile-topbar').style.display='none';
  const root=document.getElementById('shell');
  const ev=currentEvent();
  if(!ev){
    root.innerHTML=`<div class="wrap-narrow"><div class="interesse-page"><div class="empty"><b>Evento não encontrado</b>O link pode estar incorreto ou o evento foi removido.</div></div></div>`;
    return;
  }
  function draw(resultHtml){
    root.innerHTML=`
      <div class="wrap-narrow">
        <div class="interesse-page">
          <div class="ev-name">${escapeHtml(ev.evento)}</div>
          <div class="ev-meta">Consulta de status da convocação</div>
          <div class="field"><label style="font-size:11px; color:var(--muted); text-transform:uppercase;">CPF usado na candidatura</label><input type="text" id="statCpf" placeholder="000.000.000-00"></div>
          <button class="btn btn-amber" id="btnConsultarStatus" style="width:100%; padding:12px;">Consultar</button>
          ${resultHtml||''}
        </div>
      </div>`;
    document.getElementById('btnConsultarStatus').onclick=async ()=>{
      const cpf=document.getElementById('statCpf').value.trim();
      if(!cpf){ showToast('Informe o CPF.'); return; }
      const onlyDigits=s=>(s||'').replace(/\D/g,'');
      const list=(await sGet('interessados:'+currentEventId))||[];
      const found=list.filter(p=>onlyDigits(p.cpf)===onlyDigits(cpf)).pop();
      if(!found){
        draw(`<div class="empty" style="padding-top:20px;"><b>CPF não encontrado</b>Confira se digitou certo ou se já registrou interesse neste evento.</div>`);
        return;
      }
      const status=found.status||'pendente';
      const info = status==='aprovado'
        ? {cor:'var(--teal)', titulo:'Convocação aprovada!', msg:'Você foi confirmado para este evento. Aguarde as orientações do supervisor.'}
        : status==='recusado'
          ? {cor:'var(--red)', titulo:'Convocação não confirmada', msg:'Neste evento sua candidatura não foi aprovada. Fique atento a próximos eventos.'}
          : {cor:'var(--amber)', titulo:'Aguardando avaliação', msg:'Sua candidatura ainda está em análise pelo supervisor.'};
      draw(`<div class="success-box" style="padding-top:20px;"><div class="ev-name" style="color:${info.cor};">${info.titulo}</div><div class="ev-meta" style="margin-bottom:0;">${info.msg}</div></div>`);
    };
  }
  draw();
}

/* ================= LOGIN (acesso ao painel administrativo) =================
   Único ponto de entrada do painel quando não há sessão. Não é usado nos
   modos públicos (?modo=interesse / ?modo=status), que continuam sem login. */
function renderLoginScreen(){
  document.querySelector('.mobile-topbar').style.display='none';
  const root=document.getElementById('shell');
  root.innerHTML=`
    <div class="wrap-narrow">
      <div class="interesse-page">
        <div class="ev-name">Samseg — Gestão de Eventos</div>
        <div class="ev-meta">Acesso restrito ao gestor</div>
        <div class="field" style="text-align:left;">
          <label style="font-size:11px;color:var(--muted);text-transform:uppercase;">E-mail</label>
          <input type="email" id="loginEmail" placeholder="seuemail@exemplo.com" autocomplete="username">
        </div>
        <div class="field" style="text-align:left;">
          <label style="font-size:11px;color:var(--muted);text-transform:uppercase;">Senha</label>
          <input type="password" id="loginSenha" placeholder="Sua senha" autocomplete="current-password">
        </div>
        <button class="btn btn-amber" id="btnLoginSubmit" style="width:100%;padding:12px;">Entrar</button>
        <div id="loginErro" style="margin-top:10px;color:var(--red);font-size:12.5px;"></div>
        <div style="margin-top:16px;font-size:11px;color:var(--muted);">Versão: ${APP_VERSION}</div>
      </div>
    </div>
  `;
  const btn=document.getElementById('btnLoginSubmit');
  const erro=document.getElementById('loginErro');
  const submit=async ()=>{
    const email=document.getElementById('loginEmail').value.trim();
    const senha=document.getElementById('loginSenha').value;
    erro.textContent='';
    if(!email || !senha){ erro.textContent='Informe e-mail e senha.'; return; }
    btn.disabled=true; btn.textContent='Entrando...';
    const {data,error}=await sb.auth.signInWithPassword({email,password:senha});
    if(error){
      erro.textContent = error.message==='Invalid login credentials' ? 'E-mail ou senha inválidos.' : (error.message||'Não foi possível entrar.');
      btn.disabled=false; btn.textContent='Entrar';
      return;
    }
    gestorUnlocked = !!(data && data.session);
    if(gestorUnlocked){ renderShell(); }
    else { erro.textContent='Não foi possível entrar.'; btn.disabled=false; btn.textContent='Entrar'; }
  };
  btn.onclick=submit;
  document.getElementById('loginSenha').addEventListener('keydown',(e)=>{ if(e.key==='Enter') submit(); });
}

/* ================= DASHBOARD ================= */
async function renderDashboard(main){
  main.innerHTML=`<div class="empty">Carregando painel...</div>`;
  const monthEvents = events.filter(e=>e.data && e.data.slice(0,7)===dashMonth);
  eventStatsCache={};
  const stats = await Promise.all(monthEvents.map(e=>getEventStats(e.id)));
  const fins = await Promise.all(monthEvents.map(e=>getEventFinancials(e)));
  const abertos = monthEvents.filter(e=>e.status==='aberto');
  const finalizados = monthEvents.filter(e=>e.status==='finalizado');
  /* CORREÇÃO DESTA RODADA: os totais agora vêm de getEventFinancials
     (Prévia para aberto, Fechamento oficial para finalizado) — nunca
     soma os dois do mesmo evento, porque cada evento cai em exatamente
     uma categoria (seu próprio ev.status decide qual). Antes,
     totalPagar somava st.valorTotal (baseado em staff, divergente do
     fechamento oficial) e totalReceber era sempre zero (não
     calculado). "Receita" ainda não é modelada no sistema (não existe
     valor contratado/faturamento) — mantém-se reservada para quando
     o módulo de Contratos existir; não inventamos esse número agora. */
  const totalPrevia = monthEvents.reduce((s,e,i)=>e.status==='aberto' ? s+fins[i].valor : s, 0);
  const totalFechado = monthEvents.reduce((s,e,i)=>e.status==='finalizado' ? s+fins[i].valor : s, 0);

  const semFechamento = monthEvents.filter((e,i)=>stats[i].semFechamento && e.status==='aberto');
  const pagamentosPendentes = monthEvents.filter((e,i)=>e.status==='finalizado' && stats[i].pendentesPagamento>0);
  const proximosEventos = events.filter(e=>e.data >= todayISO()).sort((a,b)=>a.data<b.data?-1:1).slice(0,5);

  main.innerHTML=`
    <div class="page-head">
      <div><h2>Dashboard</h2><div class="sub">Resumo operacional e financeiro</div></div>
      <input type="month" id="monthPicker" value="${dashMonth}">
    </div>

    <div class="stat-grid">
      <div class="stat-card amber"><div class="label">Eventos em Aberto</div><div class="value">${abertos.length}</div></div>
      <div class="stat-card"><div class="label">Prévia (eventos abertos)</div><div class="value">${maskValor(totalPrevia)}</div></div>
      <div class="stat-card teal"><div class="label">Eventos Finalizados</div><div class="value">${finalizados.length}</div></div>
      <div class="stat-card"><div class="label">Fechado (eventos finalizados)</div><div class="value">${maskValor(totalFechado)}</div></div>
    </div>

    <div class="section-title" style="margin-top:26px;">Alertas</div>
    <div id="alertBox"></div>

    <div class="section-title">Eventos em aberto neste mês</div>
    <div class="event-list" id="eventList"></div>
  `;

  const alertBox=document.getElementById('alertBox');
  let alertsHtml='';
  if(semFechamento.length) alertsHtml+=`<div class="alert-box" data-jump="eventos">Eventos sem fechamento da equipe <span class="n">${semFechamento.length}</span></div>`;
  if(pagamentosPendentes.length) alertsHtml+=`<div class="alert-box" data-jump="pagamentos">Eventos com pagamentos pendentes <span class="n">${pagamentosPendentes.length}</span></div>`;
  if(proximosEventos.length) alertsHtml+=`<div class="alert-box" data-jump="eventos">Eventos próximos da realização <span class="n">${proximosEventos.length}</span></div>`;
  alertBox.innerHTML = alertsHtml || `<div class="card-sub" style="margin-bottom:0;">Nenhum alerta no momento.</div>`;
  alertBox.querySelectorAll('.alert-box').forEach(el=>{
    el.onclick=()=>{ section=el.dataset.jump; renderShell(); };
  });

  const list=document.getElementById('eventList');
  if(abertos.length){
    list.innerHTML = abertos.map((e)=>{
      const i=monthEvents.indexOf(e);
      return eventCardHtml(e, eventStatsCache[e.id], fins[i]);
    }).join('');
    attachEventCardHandlers(list);
  } else {
    list.innerHTML = `<div class="empty"><b>Nenhum evento em aberto neste mês</b>Escolha outro mês ou cadastre um novo evento em "Eventos".</div>`;
  }
  document.getElementById('monthPicker').onchange=(e)=>{ dashMonth=e.target.value; renderDashboard(main); };
}

function eventCardHtml(e, st, fin){
  st = st || {escaladosCount:0, valorTotal:0, interessadosCount:0};
  /* "Total" do card agora vem de getEventFinancials (Prévia para
     evento aberto, Fechamento oficial para finalizado) — não mais do
     cálculo antigo baseado só em staff (st.valorTotal), que podia
     divergir do fechamento real. fin é opcional: se quem chamou não
     buscou (ex: uma tela que só precisa de contagens), mostra "—" em
     vez de um valor potencialmente errado. */
  const rotuloFin = fin ? (fin.tipo==='fechamento' ? 'Fechamento' : fin.tipo==='previa' ? 'Prévia' : 'Indisponível') : null;
  const valorFin = fin && fin.tipo!=='indisponivel' ? maskValor(fin.valor) : (fin ? '—' : maskValor(st.valorTotal));
  return `
    <div class="event-card" data-id="${e.id}">
      <div class="main">
        <div class="cliente">${escapeHtml(e.cliente)} — ${escapeHtml(e.evento)}</div>
        <div class="meta">${formatPeriodo(e)} · <span class="badge ${e.status}">${e.status==='aberto'?'Em aberto':'Finalizado'}</span></div>
      </div>
      <div class="metrics">
        <div class="metric"><div class="l">Interessados</div><div class="v">${st.interessadosCount}</div></div>
        <div class="metric"><div class="l">Escalados</div><div class="v">${st.escaladosCount}</div></div>
        <div class="metric"><div class="l">${rotuloFin||'Total'}</div><div class="v">${valorFin}</div></div>
      </div>
      <div class="actions"><button class="btn btn-ghost btn-sm btn-link-copy" data-id="${e.id}">Link de interesse</button></div>
    </div>`;
}
function attachEventCardHandlers(list){
  list.querySelectorAll('.event-card').forEach(card=>{
    card.onclick=(ev)=>{ if(ev.target.closest('.btn-link-copy')) return; openEvent(card.dataset.id); };
  });
  list.querySelectorAll('.btn-link-copy').forEach(btn=>{
    btn.onclick=(ev)=>{ ev.stopPropagation(); copyText(eventLink(btn.dataset.id)); };
  });
}

      <div style="display:flex;gap:10px;align-items:center;">

    <div id="clientList"></div>
  `;
  document.getElementById('btnNewClient').onclick=()=>openClientForm();
  const list=document.getElementById('clientList');
  const search=document.getElementById('clientSearch');
  function renderClientCards(){
    const filtro=(search.value||'').toLowerCase().trim();
    const filtrados=clients.filter(c=>{
      return !filtro || (c.nome||'').toLowerCase().includes(filtro) || (c.cnpj||'').toLowerCase().includes(filtro);
    });

  if(filtrados.length){
    list.innerHTML = filtrados.map(c=>`
      <div class="client-card" data-id="${c.id}">

          <div class="nome">${escapeHtml(c.nome)}</div>

    list.querySelectorAll('.btn-del-client').forEach(btn=>{

        renderClientes(main);

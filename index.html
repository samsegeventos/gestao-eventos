    list.innerHTML=`<div class="empty"><b>Nenhum cliente cadastrado</b>Cadastre a primeira empresa contratante para agilizar a criação de eventos.</div>`;
  }
  }
  search.oninput=renderClientCards;
  renderClientCards();
}
function openClientForm(existing){
  const nome=prompt('Razão social / nome fantasia:', existing?existing.nome:'');
  if(nome===null) return;
  const cnpj=prompt('CNPJ (opcional):', existing?existing.cnpj:'');
  if(cnpj===null) return;
  const contato=prompt('Contato (telefone/e-mail, opcional):', existing?existing.contato:'');
  if(contato===null) return;
  if(!nome.trim()){ showToast('Informe o nome do cliente.'); return; }
  (async ()=>{
    if(existing){ existing.nome=nome.trim(); existing.cnpj=cnpj.trim(); existing.contato=contato.trim(); }
    else clients.push({id:uid(), nome:nome.trim(), cnpj:cnpj.trim(), contato:contato.trim()});
    await saveClients();
    renderMain();
    showToast('Cliente salvo.');
  })();
}

/* ================= VALORES POR FUNÇÃO (protegido) ================= */
/* Lista padrão de funções pré-carregada SOMENTE em eventos novos (ver
   uso em openEventForm, no ramo de criação). Eventos já existentes
   nunca passam por aqui — o ramo de edição de openEventForm não toca
   em valoresFuncao, então o array que já está salvo no evento
   permanece exatamente como está. Ordem oficial: Coordenador e
   Supervisor primeiro (sem líder — únicas exceções), depois as demais
   funções, cada uma imediatamente seguida da sua versão Líder de
   Equipe. Porteiro/Porteiro Líder de Equipe existiam numa lista
   anterior e foram restaurados aqui — nenhuma função pré-cadastrada
   que já existiu deve ser removida. */
const FUNCOES_PADRAO_NOVO_EVENTO = [
  'COORDENADOR','SUPERVISOR',
  'VIGILANTE','VIGILANTE LÍDER DE EQUIPE',
  'AUX. DE SERVIÇOS GERAIS','AUX. DE SERVIÇOS GERAIS LÍDER DE EQUIPE',
  'BRIGADISTA','BRIGADISTA LÍDER DE EQUIPE',
  'CARREGADOR','CARREGADOR LÍDER DE EQUIPE',
  'PORTEIRO','PORTEIRO LÍDER DE EQUIPE'
];
/* Ordem oficial FIXA dos blocos de função-base, usada em todas as
   abas que agrupam colaboradores (não é ordem alfabética, e não
   depende da ordem em que cada evento cadastrou suas funções —
   assim eventos antigos e novos mostram os blocos na mesma ordem
   sempre que essas funções existirem). Funções fora desta lista
   (cadastradas manualmente) aparecem depois, em ordem alfabética. */
const ORDEM_OFICIAL_FUNCOES_BASE = ['COORDENADOR','SUPERVISOR','VIGILANTE','AUX. DE SERVIÇOS GERAIS','BRIGADISTA','CARREGADOR','PORTEIRO'];
let buscaFuncaoEventoTexto = ''; // estado só de exibição (filtro), não afeta os dados salvos
/* Agrupa visualmente a função "base" com sua variação "... LÍDER DE
   EQUIPE" logo em seguida — só ordenação de exibição, nunca grava
   nada; a lista salva (ev.valoresFuncao) não é tocada, só uma cópia
   é reordenada aqui para desenhar a tela. */
function baseDaFuncaoDisplay(funcaoNorm){
  const sufixo=' LÍDER DE EQUIPE';
  return funcaoNorm.endsWith(sufixo) ? funcaoNorm.slice(0, -sufixo.length) : funcaoNorm;
}
function ordenarValoresFuncaoParaExibicao(lista){
  /* Ordem OFICIAL fixa dos grupos (Coordenador, Supervisor, Vigilante,
     Aux. de Serviços Gerais, Brigadista, Carregador) — não é mais
     alfabética. Funções fora dessa lista oficial (cadastradas
     manualmente) vêm depois, em ordem alfabética entre si. Dentro do
     mesmo grupo, a base continua sempre antes da variação "LÍDER DE
     EQUIPE". */
  return [...lista].sort((a,b)=>{
    const na=normalizaFuncaoDisplay(a.funcao), nb=normalizaFuncaoDisplay(b.funcao);
    const baseA=baseDaFuncaoDisplay(na), baseB=baseDaFuncaoDisplay(nb);
    if(baseA!==baseB){
      const ia=ORDEM_OFICIAL_FUNCOES_BASE.indexOf(baseA), ib=ORDEM_OFICIAL_FUNCOES_BASE.indexOf(baseB);
      if(ia!==-1 && ib!==-1) return ia-ib;
      if(ia!==-1) return -1;
      if(ib!==-1) return 1;
      return baseA.localeCompare(baseB,'pt-BR');
    }
    const aEhLider=na!==baseA, bEhLider=nb!==baseB;
    return (aEhLider?1:0)-(bEhLider?1:0);
  });
}
function renderValoresFuncaoEvento(){
  if(!gestorUnlocked){
    return lockScreenHtml('O valor pago por função neste evento só fica visível para o gestor.');
  }
  const ev = currentEvent();
  const lista = ordenarValoresFuncaoParaExibicao(ev.valoresFuncao || []);
  return `
    <div class="card-title">Valores por função — só neste evento</div>
    <div class="card-sub">Defina quanto cada função recebe por dia trabalhado neste evento. Esses valores valem só para "${escapeHtml(ev.evento)}" — outros eventos podem ter valores diferentes para a mesma função.</div>
    <div class="add-row" style="gap:10px; flex-wrap:wrap;">
      <input type="text" id="buscaFuncaoEvento" placeholder="🔍 Buscar função..." value="${escapeHtml(buscaFuncaoEventoTexto)}" style="flex:1; min-width:200px;">
      <button class="btn btn-amber" id="btnNewFuncaoEvento">+ Nova função para este evento</button>
    </div>
    <div id="listaFuncoesEvento">
    ${lista.length ? lista.map(f=>{
      /* Três estados distintos: sem valor definido nunca preenchido
         (valorDia null/undefined/''); valor explicitamente zero
         (definido, mas não ativa a função — regra existente mantida:
         só valor > 0 ativa); e valor > 0 (ativa). */
      const valorPreenchido = f.valorDia!=null && f.valorDia!=='' && !isNaN(parseFloat(f.valorDia));
      const valorNumerico = valorPreenchido ? parseFloat(f.valorDia) : null;
      const temValor = valorPreenchido && valorNumerico>0;
      const funcaoNorm=(f.funcao||'').trim().toUpperCase().replace(/\s+/g,' ');
      return `
      <div class="client-card compacto ${temValor?'funcao-ativa':''}" data-funcao="${escapeHtml(f.funcao)}" data-funcao-busca="${escapeHtml(funcaoNorm)}">
        <div class="main">
          <div class="nome">${escapeHtml(f.funcao)}</div>
          ${temValor ? `<div class="funcao-ativa-badge">Função ativa</div>` : (valorPreenchido ? `<div class="meta">${brl(valorNumerico)} — não ativa (valor zerado)</div>` : `<div class="meta">Sem valor definido</div>`)}
        </div>

function openFuncaoEventoForm(existing){
  const ev = currentEvent();
  const funcao=prompt('Nome da função (ex: Vigilante):', existing?existing.funcao:'');
  if(funcao===null) return;
  const valorDia=prompt(`Valor pago por dia trabalhado nessa função, só em "${ev.evento}" (R$):`, existing&&existing.valorDia!=null?existing.valorDia:'');
  if(valorDia===null) return;
  if(!funcao.trim() || isNaN(parseFloat(valorDia))){ showToast('Informe a função e um valor numérico.'); return; }
  const funcaoNormalizada=funcao.trim().toUpperCase();
  (async ()=>{
    if(!ev.valoresFuncao) ev.valoresFuncao=[];
    if(existing){
      existing.funcao=funcaoNormalizada; existing.valorDia=parseFloat(valorDia);
    } else {
      /* Normaliza para CAIXA ALTA e evita duplicidade (comparação sem
         diferenciar maiúsculas/minúsculas) antes de adicionar uma
         função nova — cobre tanto as 12 funções padrão quanto
         qualquer outra que o gestor cadastre manualmente. */
      const jaExiste=ev.valoresFuncao.some(f=>f.funcao.trim().toUpperCase()===funcaoNormalizada);
      if(jaExiste){ showToast('Essa função já está cadastrada neste evento.'); return; }
      ev.valoresFuncao.push({funcao:funcaoNormalizada, valorDia:parseFloat(valorDia)});
    }
    await saveEvents();
    renderShell();
    showToast('Valor da função salvo para este evento.');
  })();
}

function renderEventosEncerrados(main){

    const fins=await Promise.all(list.map(e=>getEventFinancials(e)));
    const porMes={};
    list.forEach((e,i)=>{

    attachEventCardHandlers(container);

  monthSel.onchange=refresh;
  buscaInp.oninput=refresh;
  refresh();

function openEventForm(existing){
  let clienteNome = existing ? existing.cliente : '';
  if(clients.length){
    const listagem = clients.map((c,i)=>`${i+1}. ${c.nome}`).join('\n');
    const escolha = prompt(`Escolha o cliente pelo número ou digite um nome novo:\n${listagem}`, clienteNome);
    if(escolha===null) return;
    const idx = parseInt(escolha,10);
    if(!isNaN(idx) && clients[idx-1]) clienteNome = clients[idx-1].nome;
    else clienteNome = escolha.trim();
  } else {
    const c = prompt('Nome do cliente:', clienteNome);
    if(c===null) return;
    clienteNome = c.trim();
  }
  const evento=prompt('Nome do evento:', existing?existing.evento:'');
  if(evento===null) return;
  if(!clienteNome || !evento.trim()){ showToast('Preencha cliente e evento.'); return; }

  const dataInicioDefault = existing ? existing.data : null;
const dataInicio = askDate('Data de início do evento (DD/MM/AAAA):', dataInicioDefault);
if(dataInicio===undefined) return;

const horaInicioDefault = existing ? existing.horaInicio : '';
const horaInicioRaw = prompt('Horário de início do evento (HH:MM):', horaInicioDefault);
if(horaInicioRaw===null) return;
const horaInicio = normalizarHora(horaInicioRaw);

if(!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(horaInicio.trim())){
  showToast('Horário de início inválido. Use HH:MM.');
  return;
}

const dataFimDefault = existing ? existing.dataFim : dataInicio;
const dataFim = askDate(
  'Data de término do evento (DD/MM/AAAA) — deixe igual à data de início se for um único dia:',
  dataFimDefault || dataInicio
);
if(dataFim===undefined) return;

const horaFimDefault = existing ? existing.horaFim : horaInicio;
const horaFimRaw = prompt('Horário de término do evento (HH:MM):', horaFimDefault);
if(horaFimRaw===null) return;
const horaFim = normalizarHora(horaFimRaw);

if(!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(horaFim.trim())){
  showToast('Horário de término inválido. Use HH:MM.');
  return;
}

/* Validação de data/hora completas (não só o horário isolado).
   Monta os dois instantes locais (sem toISOString, para não sofrer
   deslocamento de fuso) e compara a data+hora inteira: um evento que
   termina de madrugada no dia seguinte (ex: 20:00 → 04:00 do dia
   seguinte) é válido; só é inválido quando o fim cai igual ou antes
   do início na linha do tempo real, dias e horas juntos. */
const inicioCompleto = new Date(`${dataInicio}T${horaInicio.trim()}:00`);
const fimCompleto = new Date(`${dataFim}T${horaFim.trim()}:00`);
if(fimCompleto <= inicioCompleto){
  showToast(`A data/hora de término deve ser depois da data/hora de início. (Início: ${isoToBr(dataInicio)} ${horaInicio.trim()} · Término: ${isoToBr(dataFim)} ${horaFim.trim()})`);
  return;
}

/* "Válido até" é um campo separado da data do evento (linkValidoAte),
   guardado à parte de data/dataFim — de propósito, para permitir um
   prazo de inscrição diferente da data do evento. Mas se antes ele
   estava simplesmente acompanhando a data de término (não foi
   customizado à parte), ao editar o evento ele deve continuar
   acompanhando a NOVA data de término automaticamente — senão o link
   fica "preso" numa data antiga já vencida mesmo com o evento
   atualizado, que foi exatamente o problema relatado. */
const linkEstavaAutomatico = existing ? (existing.linkValidoAte === existing.dataFim) : true;
const linkDefault = existing
  ? (linkEstavaAutomatico ? dataFim : existing.linkValidoAte)
  : dataFim;
const linkValidoAte = askDate(
  (existing
    ? `Este é um campo SEPARADO da data do evento. Hoje ele estava ${linkEstavaAutomatico ? 'acompanhando automaticamente a data de término' : 'definido manualmente para ' + formatDate(existing.linkValidoAte)}.\n`
    : ''
  ) + 'Link de convocação (interesse) válido até (DD/MM/AAAA) — após essa data, ninguém mais consegue registrar interesse:',
  linkDefault || dataFim
);
if(linkValidoAte===undefined) return;

(async ()=>{
  if(existing){
    existing.cliente=clienteNome;
    existing.evento=evento.trim();
    existing.data=dataInicio;
    existing.horaInicio=horaInicio.trim();
    existing.dataFim=dataFim;
    existing.horaFim=horaFim.trim();
    existing.linkValidoAte=linkValidoAte;
  } else {
    events.push({
      id:uid(),
      cliente:clienteNome,
      evento:evento.trim(),
      data:dataInicio,
      horaInicio:horaInicio.trim(),
      dataFim:dataFim,
      horaFim:horaFim.trim(),
      linkValidoAte:linkValidoAte,
      status:'aberto',
      valoresFuncao: FUNCOES_PADRAO_NOVO_EVENTO.map(f=>({funcao:f, valorDia:null}))
    });
  }

  const resultado = await saveEvents();
  if(resultado && resultado.ok){
    renderMain();
    showToast('Evento atualizado com sucesso.');
  } else {
    /* Não persistiu: recarrega os eventos direto do Supabase para a
       tela não continuar mostrando uma data que na verdade não foi
       salva (o array local já tinha sido alterado antes da tentativa
       de salvar). Mostra o erro real, sem escondê-lo. */
    events = (await sGet('events')) || events;
    renderMain();
    const msg = (resultado && resultado.error && resultado.error.message) ? resultado.error.message : 'não foi possível salvar. Tente novamente.';
    showToast('Erro ao salvar evento: '+msg);
  }
})();
    }
   
async function deleteCurrentEvent(){
  const ev=currentEvent(); if(!ev) return;
  if(!confirm(`Excluir o evento "${ev.evento}" (${ev.cliente})? Isso também apaga a escala e presença registradas.`)) return;
  const eventosAntes=events;
  events=events.filter(e=>e.id!==currentEventId);
  const resultado=await saveEvents();
  if(resultado && resultado.ok){
    currentEventId=null; section='eventos';
    renderShell();
    showToast('Evento excluído.');
  } else {
    events=eventosAntes; // reverte a exclusão local, já que não foi persistida
    renderShell();
    const msg=(resultado && resultado.error && resultado.error.message) ? resultado.error.message : 'não foi possível excluir. Tente novamente.';
    showToast('Erro ao excluir evento: '+msg);
  }
}

function attachPreEscalaListaHandlers(){
  document.querySelectorAll('.btn-approve').forEach(btn=>{
    btn.onclick=async (e)=>{
      const id=e.target.closest('.interesse-row').dataset.id;
      const p=interessados.find(i=>i.id===id);
      /* BLOQUEIO DE ESCALA POR RECICLAGEM VENCIDA — aplicado aqui
         porque este é um dos pontos reais que fazem staff.push()
         (aprovação da Pré-Escala). Recarrega o Banco de Colaboradores
         antes de checar, para não depender de a aba de Impressão de
         Crachás já ter sido visitada nesta sessão (colaboradoresBanco
         pode estar vazio até então). Só se aplica a função Vigilante
         (qualquer variação) — regra direta, sem +2 anos: a reciclagem
         precisa cobrir até a data final do evento. */
      const cpfNormP=(p.cpf||'').replace(/\D/g,'');
      if((p.funcao||'').trim().toUpperCase().startsWith('VIGILANTE')){
        await loadColaboradoresBanco();
        const colab=buscarColaboradorPorCpf(cpfNormP);
        if(!reciclagemValidaAteFinalEvento(colab&&colab.reciclagem, currentEvent())){
          showToast('Não é possível aprovar: reciclagem do Vigilante vencida ou ausente para a data deste evento.');
          return;
        }
      }
      staff.push({id:uid(), eventId:currentEventId, nome:p.nome, cpf:p.cpf||'', telefone:p.telefone||'', funcao:p.funcao||'', escalado:true, compareceu:false, data:currentEvent().data||'', entrada:'', saida:'', diasTrabalhados:1, pago:false});
      p.status='aprovado';
      await saveStaff(); await saveInteressados();
      subTab='escala';
      renderShell();
      showToast('Convocação aprovada.');
    };
  });
  document.querySelectorAll('.btn-reject').forEach(btn=>{
    btn.onclick=async (e)=>{ const id=e.target.closest('.interesse-row').dataset.id; const p=interessados.find(i=>i.id===id); p.status='recusado'; await saveInteressados(); renderShell(); };
  });
}

function renderAprovacaoGestor(){
  if(!gestorUnlocked){
    return lockScreenHtml('A aprovação do fechamento só fica visível para o gestor.');
  }
  const ev=currentEvent();
  /* Antes esta tela lia staff.filter(c=>c.escalado&&c.compareceu) — um
     campo do pipeline antigo (Controle de Presença), que não é mais
     preenchido por nenhuma tela desde que o Checkout por Dia passou a
     ser a fonte real de presença. Por isso ficava sempre vazia. Agora
     usa fechamentoDados, a mesma fonte já usada por "Fechamento
     Financeiro" — nenhum cálculo novo, só reaproveita o que já vem
     pronto de fechamento_evento(). As duas visualizações
     (Presidência/Gestor) usam a mesma função compartilhada
     renderTabelaFechamentoImpressao — sem duplicar a lógica. Fluxo
     obrigatório desta rodada: Presidência é a visão padrão (sem CPF,
     assinatura ou data) — só depois de "Aprovar fechamento" (mesmo
     status já existente, ev.status) o Fechamento do Gestor (com CPF,
     assinatura e data) fica liberado. */
  if(!fechamentoDados.length) return `<div class="empty"><b>Ainda sem dados de fechamento</b>Registre entrada e saída no Checkout por Dia para liberar a aprovação.</div>`;
  const aprovado=ev.status!=='aberto';

      <button class="btn btn-ghost btn-sm ${aprovacaoVisao==='presidencia'?'active':''}" id="btnVisaoFechamentoPresidencia" style="${aprovacaoVisao==='presidencia'?'background:var(--accent-soft);':''}">FECHAMENTO EVENTO PRESIDÊNCIA / IMPRESSÃO</button>
    </div>

      ? (aprovado

    <div style="margin-top:20px; display:flex; gap:10px; justify-content:flex-end;">

function renderEscalaHorarioDias(){
  if(!gestorUnlocked) return lockScreenHtml('A escala e o horário por dia só ficam visíveis para o gestor.');
  if(!eventoDias.length) return `<div class="empty"><b>Este evento ainda não tem dias gerados</b>Salve novamente o cadastro do evento (data/data fim/horário) para gerar os dias automaticamente.<div class="mono" style="margin-top:10px;font-size:11px;color:var(--muted);">Diagnóstico: evento_id consultado = "${escapeHtml(currentEventId||'')}" · ${ultimoErroEventoDias ? 'erro do Supabase: '+escapeHtml(ultimoErroEventoDias) : 'consulta OK, 0 linhas retornadas (possível RLS bloqueando o papel authenticated)'}</div></div>`;
  if(!participacoesNovas.length) return `<div class="empty"><b>Nenhuma participação confirmada ainda</b>Colaboradores aparecem aqui depois que confirmam sua participação pelo link público (CPF autorizado).</div>`;

  /* Regra definitiva: só quem já foi aprovado (Pré-Escala → Escala
     Oficial) fica disponível para ser escalado por dia — aprovação não
     escala automaticamente nenhum dia específico, só libera a pessoa
     para aparecer aqui. Cruza por CPF com "interessados" (já carregado
     ao abrir o evento). Se o retorno de listar_participacoes_evento não
     trouxer CPF em nenhum registro (campo ausente), mantém a lista
     completa em vez de esconder todo mundo por causa de uma coluna que
     talvez não exista nessa RPC — evita piorar o que já funcionava. */
  const algumTemCpf = participacoesNovas.some(p=>p.cpf);
  let listaExibida = participacoesNovas;
  if(algumTemCpf){
    const cpfsAprovados = new Set(
      interessados.filter(i=>(i.status||'pendente')==='aprovado').map(i=>(i.cpf||'').replace(/\D/g,''))
    );
    listaExibida = participacoesNovas.filter(p=>cpfsAprovados.has((p.cpf||'').replace(/\D/g,'')));
  }
  if(!listaExibida.length){
    return `<div class="empty"><b>Nenhum colaborador aprovado ainda</b>Aprove candidatos na Pré-Escala (Escala Oficial) para eles ficarem disponíveis aqui.</div>`;
  }

  return `
    <div class="card-title">Escala por dia</div>
    <div class="card-sub">Marque em quais dias específicos cada colaborador está previsto para trabalhar. Lista de todos os dias do evento lado a lado — não há um único "dia selecionado" nesta tabela.</div>
    <div class="field" style="max-width:320px;"><label>Buscar</label><input type="text" id="buscaEscalaHorario" placeholder="Buscar por nome ou CPF" value="${escapeHtml(escalaHorarioBusca)}"></div>
    <div id="escalaHorarioLista">${renderEscalaHorarioDiasLista(listaExibida)}</div>
    <div class="card-title" style="margin-top:28px;">Dias do evento — horário</div>
    <div class="card-sub">Horário de cada dia — clique em "Editar" para ajustar um dia específico.</div>
    <table>
      <thead><tr><th>Data</th><th>Início</th><th>Fim</th><th></th></tr></thead>
      <tbody>
        ${eventoDias.map(d=>`
          <tr data-dia-id="${d.id}">
            <td>${formatarDataComDiaSemana(d.data)}</td>
            <td class="mono">${(d.hora_inicio||'').slice(0,5)}</td>
            <td class="mono">${(d.hora_fim||'').slice(0,5)}</td>
            <td><button class="btn btn-ghost btn-sm btn-editar-horario-dia">Editar horário</button></td>
          </tr>`).join('')}
      </tbody>
    </table>
  `;
}
function renderEscalaHorarioDiasLista(listaExibida){
  const listaFiltrada=filtrarPorNomeOuCpf(listaExibida, escalaHorarioBusca, p=>p.nome, p=>p.cpf);
  if(!listaFiltrada.length) return `<div class="empty"><b>Nenhum resultado para essa busca</b></div>`;
  const grupos=agruparPorFuncaoPrincipal(listaFiltrada, p=>p.funcao, p=>p.nome);

  return `

            ${eventoDias.map(d=>`<td style="text-align:center;"><label class="checkbox-wrap"><input type="checkbox" class="chk-escala-dia" data-dia-id="${d.id}" ${escaladoNoDia(pid(p), d.id)?'checked':''}></label></td>`).join('')}

function attachEscalaHorarioHandlers(){
  const buscaEscalaHorarioInp=document.getElementById('buscaEscalaHorario');
  if(buscaEscalaHorarioInp) buscaEscalaHorarioInp.oninput=()=>{
    escalaHorarioBusca=buscaEscalaHorarioInp.value;

    if(lista){
      /* listaExibida precisa ser recalculada aqui com a mesma regra
         (só aprovados) usada na renderização completa — os dados-fonte
         (participacoesNovas/interessados) não mudam entre uma tecla e
         outra, só o texto da busca. */
      const algumTemCpfBusca = participacoesNovas.some(p=>p.cpf);
      let listaExibidaBusca = participacoesNovas;
      if(algumTemCpfBusca){
        const cpfsAprovadosBusca = new Set(interessados.filter(i=>(i.status||'pendente')==='aprovado').map(i=>(i.cpf||'').replace(/\D/g,'')));
        listaExibidaBusca = participacoesNovas.filter(p=>cpfsAprovadosBusca.has((p.cpf||'').replace(/\D/g,'')));
      }
      lista.innerHTML=renderEscalaHorarioDiasLista(listaExibidaBusca);
      attachEscalaHorarioListaHandlers();
    }
  };
  attachEscalaHorarioListaHandlers();
  document.querySelectorAll('.btn-editar-horario-dia').forEach(btn=>{

      const novoInicioRaw=prompt('Horário de início (HH:MM):', (dia.hora_inicio||'').slice(0,5));
      if(novoInicioRaw===null) return;
      const novoInicio=normalizarHora(novoInicioRaw);
      if(!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(novoInicio.trim())){ showToast('Horário de início inválido. Use HH:MM.'); return; }
      const novoFimRaw=prompt('Horário de fim (HH:MM):', (dia.hora_fim||'').slice(0,5));
      if(novoFimRaw===null) return;
      const novoFim=normalizarHora(novoFimRaw);
      if(!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(novoFim.trim())){ showToast('Horário de fim inválido. Use HH:MM.'); return; }
      const r=await chamarRpcGestor('atualizar_horario_dia',{p_evento_dia_id:diaId, p_hora_inicio:novoInicio, p_hora_fim:novoFim});
      if(r.ok){ showToast('Horário atualizado.'); await loadDiasEscalaPresenca(); renderShell(); }
    };
  });
}

function renderCheckoutDiasLista(){

  const escaladosNoDia = participacoesNovas.filter(p=>escaladoNoDia(pid(p), diaId));

  return `
    ${renderResumoQuantidadesFuncao(grupos)}
    <table>
      <thead><tr><th>#</th><th>Colaborador</th><th>Função</th><th>Telefone</th><th>Entrada</th><th>Saída</th><th>Horas adicionais</th><th>Situação</th><th></th></tr></thead>
      <tbody>
        ${linhasComTituloDeGrupo(grupos, 9, (p,numero)=>{
          const pr=presencaDoDia(pid(p), diaId);
          const temEntrada=pr && pr.entrada_ts;
          const temSaida=pr && pr.saida_ts;
          const anulada=!!p.anulada;
          return `<tr data-participacao-id="${pid(p)}" ${anulada?'style="opacity:0.6;"':''}>
            <td class="mono">${numero}</td>
            <td>${escapeHtml(nomeExibicao(p.nome))}</td>

function abrirModalAnularParticipacao(p, pr){

    <div class="modal-box">

        Esta ação informará que o colaborador não participou efetivamente deste evento. A participação será retirada do fechamento financeiro e dos cálculos de pagamento, mas os registros originais de check-in/checkout serão preservados para auditoria — nada é apagado.
      </div>
      <div class="field"><label>Motivo da anulação (obrigatório)</label>
        <textarea id="anularMotivo" rows="3" placeholder="Ex: Funcionário não estava presente no evento. Check-in e checkout registrados por engano." style="width:100%; resize:vertical;"></textarea>
      </div>
      <div id="anularErro" style="color:var(--red); font-size:13px; margin-top:6px;"></div>
      <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:16px;">
        <button class="btn btn-ghost" id="anularCancelar">Cancelar</button>
        <button class="btn btn-danger" id="anularConfirmar" disabled>Anular participação</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const motivoEl=document.getElementById('anularMotivo');
  const btnConfirmar=document.getElementById('anularConfirmar');
  motivoEl.oninput=()=>{ btnConfirmar.disabled = motivoEl.value.trim().length===0; };
  document.getElementById('anularCancelar').onclick=()=>overlay.remove();
  btnConfirmar.onclick=async ()=>{
    const motivo=motivoEl.value.trim();
    if(!motivo) return;
    const erroBox=document.getElementById('anularErro');
    erroBox.innerHTML='';
    btnConfirmar.disabled=true; btnConfirmar.textContent='Anulando...';
    try{
      const {error}=await sb.rpc('anular_participacao_evento',{p_participacao_id:pid(p), p_motivo:motivo});
      if(error) throw error;
      showToast('Participação anulada.');
      overlay.remove();
      await loadDiasEscalaPresenca();

    }catch(err){
      console.error('Erro ao anular participação:', err);
      erroBox.innerHTML=formatarErroSupabase(err);
      btnConfirmar.disabled=false; btnConfirmar.textContent='Anular participação';
    }
  };

function abreviarLider(funcaoReal){
  /* Só exibição, só nesta impressão — nunca altera a função real
     salva nem a chave usada para agrupar. */
  return (funcaoReal||'').replace(/ LÍDER DE EQUIPE\b/, ' LÍDER');
}
function ordenarFuncoesParaPresidencia(chaves){
  /* Ordem oficial das funções BASE; dentro da mesma base, variações
     não-líder vêm antes das variações líder (ordem alfabética/numérica
     entre si em ambos os casos) — cobre tanto "AUX. DE SERVIÇOS GERAIS"
     vs "AUX. DE SERVIÇOS GERAIS 2" quanto múltiplas variações de líder.
     Análise própria (não usa baseDaFuncaoDisplay, que não trata
     variações numeradas) — remove um possível número de variação no
     final ANTES de checar o sufixo de líder, para "AUX. DE SERVIÇOS
     GERAIS 2" ficar reconhecido como base "AUX. DE SERVIÇOS GERAIS". */
  const analisar=(funcaoNorm)=>{
    const semNumero=funcaoNorm.replace(/ \d+$/, '');
    const ehLider=semNumero.endsWith(' LÍDER DE EQUIPE');
    const base=ehLider ? semNumero.slice(0, -' LÍDER DE EQUIPE'.length) : semNumero;
    return {base, ehLider};
  };
  return [...chaves].sort((a,b)=>{
    const na=normalizaFuncaoDisplay(a), nb=normalizaFuncaoDisplay(b);
    const infoA=analisar(na), infoB=analisar(nb);
    if(infoA.base!==infoB.base){
      const ia=ORDEM_OFICIAL_FUNCOES_BASE.indexOf(infoA.base), ib=ORDEM_OFICIAL_FUNCOES_BASE.indexOf(infoB.base);
      if(ia!==-1 && ib!==-1) return ia-ib;
      if(ia!==-1) return -1;
      if(ib!==-1) return 1;
      return infoA.base.localeCompare(infoB.base,'pt-BR');
    }
    if(infoA.ehLider!==infoB.ehLider) return infoA.ehLider?1:-1; // função principal antes do líder
    return na.localeCompare(nb,'pt-BR');
  });
}
function renderResumoPorFuncao(){
  /* "Impressão p/ Presidência" — consolidação por função REAL exata
     (não por função-base): líderes ficam em linha própria, logo
     abaixo da função principal correspondente, porque podem ter
     valor/função diferente. Variações da mesma função com valores
     diferentes (ex: "AUX. DE SERVIÇOS GERAIS 2") também ficam em
     linhas separadas, automaticamente, por já agrupar pela string
     exata da função. Soma valores já calculados pela RPC
     fechamento_evento por colaborador (fechamentoDados) — não

    const g=porFuncao[k];

  const chavesOrdenadas=ordenarFuncoesParaPresidencia(Object.keys(porFuncao));
  const linhas=chavesOrdenadas.map(k=>porFuncao[k]);
  const totais=linhas.reduce((acc,l)=>({
    colaboradores:acc.colaboradores+l.colaboradores, diasTrabalhados:acc.diasTrabalhados+l.diasTrabalhados,
    valorTotal:acc.valorTotal+l.valorTotal, valorAdicional:acc.valorAdicional+l.valorAdicional,
    desconto:acc.desconto+l.desconto, total:acc.total+l.total
  }),{colaboradores:0,diasTrabalhados:0,valorTotal:0,valorAdicional:0,desconto:0,total:0});
  const cabecalhoRepetido=()=>`
    <tr class="linha-cabecalho-impressao"><th colspan="8">

        </tr>

        <tr style="font-weight:700;">

          <td>${brl(totais.total)}</td>
        </tr>
      </tbody>

const DIAS_SEMANA_ABREV = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
function numeroPlano(v){
  const n=Number(v)||0;
  return Number.isInteger(n) ? String(n) : n.toFixed(2).replace('.',',');
}
function periodoImpressao(ev){
  /* Formato específico para o cabeçalho de impressão: "DD/MM/AAAA A
     DD/MM/AAAA" (ou só uma data, se o evento for de um dia só) —
     mesma fonte de dados que já existe (ev.data/ev.dataFim), sem
     inventar nada. formatPeriodo() já existe mas usa "–" em vez de
     "A"; mantive as duas funções separadas para não alterar o que já
     usa formatPeriodo() em outro lugar. */
  if(!ev) return '';
  if(ev.dataFim && ev.dataFim!==ev.data) return `${formatDate(ev.data)} A ${formatDate(ev.dataFim)}`;
  return formatDate(ev.data);
}
const MESES_PT = ['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
function mesReferencia(ev){
  /* Sempre a partir da PRIMEIRA data do evento (ev.data), nunca da
     última — mesmo que o evento cruze a virada do mês/ano. */
  if(!ev || !ev.data) return '';
  const [y,m]=ev.data.split('-');
  return `${MESES_PT[Number(m)-1]}/${y}`;
}
function formatDiaMes(iso){ if(!iso) return ''; const [,m,d]=iso.split('-'); return `${d}/${m}`; }
function formatDiaSomente(iso){ if(!iso) return ''; const [,,d]=iso.split('-'); return d; }
function agruparPorFuncaoExataOrdenada(lista, getFuncao, getNome){
  /* Só para o FECHAMENTO EVENTO PRESIDÊNCIA: aqui o líder forma seu
     PRÓPRIO grupo, logo abaixo do grupo da função principal — ao
     contrário da regra usada em todas as outras telas do sistema
     (onde o líder fica dentro do mesmo grupo). Reaproveita
     ordenarFuncoesParaPresidencia() (já existente) para a ordem dos
     grupos — base antes do líder, seguindo a ordem oficial — e
     abreviarLider() (já existente) para o título do grupo. */
  const grupos={};
  lista.forEach(item=>{
    const norm=normalizaFuncaoDisplay(getFuncao(item)) || 'SEM FUNÇÃO INFORMADA';
    if(!grupos[norm]) grupos[norm]=[];
    grupos[norm].push(item);
  });
  const chavesOrdenadas=ordenarFuncoesParaPresidencia(Object.keys(grupos));
  return chavesOrdenadas.map(k=>{
    const itens=[...grupos[k]].sort((a,b)=>(getNome(a)||'').localeCompare(getNome(b)||'','pt-BR'));
    return {funcao:abreviarLider(k), itens};
  });
}
function funcaoParaImpressaoHTML(funcaoReal){
  /* Só exibição: função líder quebra em duas linhas ("FUNÇÃO" /
     "LÍDER") para melhor aproveitamento de largura na tabela — nunca
     altera a função real salva nos dados. Não usar em telas fora da
     impressão do fechamento (a Impressão p/ Presidência tem sua
     própria regra de abreviação de uma linha só, já implementada). */
  const norm=normalizaFuncaoDisplay(funcaoReal);
  const sufixo=' LÍDER DE EQUIPE';
  if(norm.endsWith(sufixo)) return `${escapeHtml(norm.slice(0,-sufixo.length))}<br>LÍDER`;
  return escapeHtml(norm||'—');
}
function renderTabelaFechamentoImpressao(mostrarCpf, mostrarAssinaturaData, listagemUnica){
  /* Função única compartilhada entre "FECHAMENTO GESTOR / IMPRESSÃO"
     (mostrarCpf=true, mostrarAssinaturaData=true, listagemUnica=false
     — mantém a separação em duas folhas Vigilantes/Grupo Anjos da Paz,
     sem alteração nesta rodada) e "FECHAMENTO EVENTO PRESIDÊNCIA /
     IMPRESSÃO" (mostrarCpf=false, mostrarAssinaturaData=false,
     listagemUnica=true — uma única listagem sequencial, sem separar
     Vigilantes das demais funções) — mesma estrutura, mesma fonte de
     dados (fechamentoDados, presencasNovas, eventoDias), sem
     recalcular nenhum valor financeiro novo e sem duplicar a lógica
     em dois lugares. O valor de cada dia é só o valor/diária da
     função daquele colaborador (repetido dia a dia em que ele
     trabalhou, segundo o registro real do Checkout), seguido das
     horas adicionais daquele dia específico, se houver. Só existe UMA
     coluna de valor ("VALOR" = valor_base) — a coluna "VALOR/DIA" foi
     removida por duplicar essa informação. */
  if(!fechamentoDados.length || !eventoDias.length) return `<div class="empty"><b>Sem dados suficientes para esta visão</b></div>`;
  const ev=currentEvent();
  const ehVigilante=f=>baseDaFuncaoDisplay(normalizaFuncaoDisplay(f.funcao))==='VIGILANTE';
  const vigilantes=fechamentoDados.filter(ehVigilante);
  const demais=fechamentoDados.filter(f=>!ehVigilante(f));
  // Nome + Função [+ CPF] + 1 por dia + Dias + Valor + Adic./Desc./Total [+ Assinatura + Data]
  const colspanDatas=(mostrarCpf?3:2)+eventoDias.length+5+(mostrarAssinaturaData?2:0); // Dias,Valor,Adic,Desc,Total = 5 colunas fixas depois dos dias
  /* Cabeçalho de UMA linha só, repetido em cada página impressa
     (thead nativo, com display:table-header-group): cliente + nome do
     evento + período à esquerda, mês de referência à direita. Os
     títulos "VIGILANTES"/"GRUPO ANJOS DA PAZ" NÃO entram aqui — ficam
     só no título de cada seção (fora da tabela); o cabeçalho da
     página começa direto em cliente + evento. */
  const cabecalhoRepetido=()=>`
    <tr class="linha-cabecalho-impressao"><th colspan="${colspanDatas}">
      <div style="display:flex; justify-content:space-between; align-items:baseline; gap:12px;">
        <span>${ev.cliente?escapeHtml(nomeExibicao(ev.cliente))+' — ':''}${escapeHtml(nomeExibicao(ev.evento))} — ${escapeHtml(periodoImpressao(ev)).toUpperCase()}</span>
        <span>${escapeHtml(mesReferencia(ev))}</span>
      </div>
    </th></tr>`;
  /* colgroup + table-layout:fixed: garante que a largura de cada
     coluna é a MESMA sempre, em qualquer bloco/folha e com qualquer
     quantidade de dias — não depende do conteúdo de cada linha para
     calcular largura, que era a causa do desalinhamento em eventos
     com muitos dias. */
  const colgroup=(()=>{
    const antesDosDias = mostrarCpf ? ['15%','12%','9%'] : ['18%','15%'];             // Nome,Função[,CPF]
    const depoisDosDias = mostrarAssinaturaData
      ? ['4%','8%','7%','7%','8%','15%','7%']    // Dias,Valor,Adic,Desc,Total,Assinatura,Data
      : ['5%','10%','9%','9%','10%'];             // Dias,Valor,Adic,Desc,Total (mais espaço, sem assinatura/data)
    const fixas=[...antesDosDias, ...depoisDosDias];
    const somaFixas=fixas.reduce((s,v)=>s+parseFloat(v),0);
    const larguraDia=eventoDias.length ? ((100-somaFixas)/eventoDias.length).toFixed(2)+'%' : '3%';
    return `<colgroup>
      ${antesDosDias.map(w=>`<col style="width:${w}">`).join('')}
      ${eventoDias.map(()=>`<col style="width:${larguraDia}">`).join('')}
      ${depoisDosDias.map(w=>`<col style="width:${w}">`).join('')}
    </colgroup>`;
  })();
  /* Fonte de referência 11px; eventos com muitos dias reduzem
     moderadamente em vez de cortar/quebrar qualquer informação — o
     navegador ainda permite diminuir a escala de impressão livremente
     por cima disso. */
  const fontePx=Math.max(9, Math.min(11, 11 - Math.max(0, eventoDias.length-8)*0.25)).toFixed(1);
  const gerarTabela=(lista, titulo, funcaoAgrupamento, conteudoExtra)=>{
    const grupos=(funcaoAgrupamento||agruparPorFuncaoPrincipal)(lista, f=>f.funcao, f=>f.nome);
    const totalGrupo=(itens)=>itens.reduce((s,f)=>s+(f.total_receber||0),0);
    return `
    <div class="folha-fechamento">
    ${titulo?`<div class="card-title" style="margin-bottom:6px;">${escapeHtml(titulo)}</div>`:''}
    <table class="tabela-fechamento-datas" style="font-size:${fontePx}px;">
      ${colgroup}
      <thead>
        ${cabecalhoRepetido()}
        <tr>
          <th class="col-nome">NOME</th>
          <th class="col-func-presidencia">FUNÇÃO</th>
          ${mostrarCpf?'<th>CPF</th>':''}
          ${eventoDias.map(d=>`<th class="col-dia">${formatDiaSomente(d.data)}</th>`).join('')}
          <th>DIAS</th>
          <th>VALOR</th>
          <th>ADIC.</th><th>DESC.</th><th>TOTAL</th>
          ${mostrarAssinaturaData?'<th class="col-assinatura">ASSINATURA</th><th class="col-data-manual">DATA</th>':''}
        </tr>
      </thead>
      <tbody>
        ${linhasComTituloDeGrupo(grupos, colspanDatas, (f)=>`
          <tr>
            <td class="col-nome">${escapeHtml(nomeExibicao(f.nome))}</td>
            <td class="col-func-presidencia">${funcaoParaImpressaoHTML(f.funcao)}</td>
            ${mostrarCpf?`<td>${f.cpf?formatCpf(f.cpf):'—'}</td>`:''}
            ${eventoDias.map(d=>{
              const pr=presencaDoDia(f.participacao_id, d.id);
              if(!pr || !pr.entrada_ts) return `<td class="col-dia">-</td>`;
              const he=horasExtraDe(pr);
              return `<td class="col-dia">${f.valor_diaria!=null?numeroPlano(f.valor_diaria):''}${he?` (${he}h)`:''}</td>`;
            }).join('')}
            <td>${f.dias_trabalhados}</td>
            <td>${f.valor_diaria!=null?brl(f.valor_base):'—'}</td>
            <td>${valorOuTraco(f.valor_excedente)}</td>
            <td>${valorOuTraco(f.desconto)}</td>
            <td>${brl(f.total_receber)}</td>
            ${mostrarAssinaturaData?'<td class="col-assinatura"></td><td class="col-data-manual"></td>':''}
          </tr>`, totalGrupo)}
      </tbody>
    </table>
    ${conteudoExtra||''}
    </div>`;
  };
  if(listagemUnica){
    /* Fechamento Evento Presidência: uma única listagem sequencial,
       sem separar Vigilantes das demais funções. Aqui (só aqui) o
       líder forma um grupo PRÓPRIO, logo abaixo da função principal —
       agruparPorFuncaoExataOrdenada() cuida disso; a ordem das
       funções continua a oficial do sistema. Sem quebra de página
       forçada entre grupos — é uma única <table>.
       IMPORTANTE: o resumo final (.totals) é passado como
       conteudoExtra para ficar DENTRO do mesmo .folha-fechamento que
       envolve a tabela — não como elemento irmão depois dela. Isso é
       o que impede a quebra de página forçada entre a listagem e o
       resumo: a regra de impressão .folha-fechamento{page-break-after:
       always} só quebra DEPOIS de todo o bloco (tabela+resumo juntos),
       nunca entre os dois. Antes, .totals ficava como irmão fora da
       .folha-fechamento, o que tirava dela a condição de :last-child
       e reativava a quebra forçada logo após a tabela — exatamente
       onde não devia. */
    const totalGeral=fechamentoDados.reduce((s,f)=>s+(f.total_receber||0),0);
    const resumoFinal=`
      <div class="totals" style="margin-top:10px; page-break-inside:avoid;">
        <div class="item"><div class="label">Total de colaboradores</div><div class="value" style="font-size:16px;">${fechamentoDados.length}</div></div>
        <div class="item"><div class="label">Total a pagar no evento</div><div class="value">${brl(totalGeral)}</div></div>
      </div>`;
    return `
      <div style="margin-bottom:14px;"><button class="btn btn-ghost btn-sm" id="btnPrint">Imprimir / Exportar PDF</button></div>
      ${gerarTabela(fechamentoDados, null, agruparPorFuncaoExataOrdenada, resumoFinal)}
    `;
  }
  return `
    <div style="margin-bottom:14px;"><button class="btn btn-ghost btn-sm" id="${mostrarCpf?'btnPrintFechamentoEvento':'btnPrint'}">Imprimir / Exportar PDF</button></div>
    ${vigilantes.length ? gerarTabela(vigilantes,'VIGILANTES') : ''}
    ${demais.length ? gerarTabela(demais,'GRUPO ANJOS DA PAZ') : ''}
  `;
}
function attachFechamentoHandlers(){
  const btnCol=document.getElementById('btnVisaoColaborador');
  const btnFunc=document.getElementById('btnVisaoFuncao');
  if(btnCol) btnCol.onclick=()=>{ fechamentoVisao='colaborador'; renderShell(); };
  if(btnFunc) btnFunc.onclick=()=>{ fechamentoVisao='funcao'; renderShell(); };
  document.querySelectorAll('.btn-recalcular').forEach(btn=>{
    btn.onclick=async ()=>{
      const tr=btn.closest('tr'); const participacaoId=Number(tr.dataset.participacaoId);
      const novoDesconto=parseFloat(tr.querySelector('.f-desconto').value);
      if(isNaN(novoDesconto) || novoDesconto<0){ showToast('Desconto inválido.'); return; }
      const r=await chamarRpcGestor('atualizar_desconto_participacao',{p_participacao_id:participacaoId, p_desconto:novoDesconto});
      if(r.ok){ showToast('Fechamento recalculado.'); await loadDiasEscalaPresenca(); renderShell(); }
    };
  });
}

/* ================= CPFs AUTORIZADOS (dentro do detalhe do evento) ================= */
function formatCpf(v){
  const d=(v||'').replace(/\D/g,'').slice(0,11);
  if(d.length>9) return d.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/,'$1.$2.$3-$4');
  if(d.length>6) return d.replace(/(\d{3})(\d{3})(\d{1,3})/,'$1.$2.$3');
  if(d.length>3) return d.replace(/(\d{3})(\d{1,3})/,'$1.$2');
  return d;
}
function maskCpfInput(el){ el.value=formatCpf(el.value); }
/* Máscara de celular brasileiro: (DD) 9 NNNN-NNNN, formatada
   progressivamente enquanto digita/cola/apaga. Armazenamento
   continua sendo feito só com os dígitos (ver uso em renderPublic). */
function formatTelefone(v){
  const d=(v||'').replace(/\D/g,'').slice(0,11);
  if(d.length===0) return '';
  if(d.length<=2) return `(${d}`;
  if(d.length<=3) return `(${d.slice(0,2)}) ${d.slice(2)}`;
  if(d.length<=7) return `(${d.slice(0,2)}) ${d.slice(2,3)} ${d.slice(3)}`;
  return `(${d.slice(0,2)}) ${d.slice(2,3)} ${d.slice(3,7)}-${d.slice(7)}`;
}
function maskTelefoneInput(el){ el.value=formatTelefone(el.value); }
/* ================= CRACHÁ: máscaras MG e validações (novo) =================
   Ambas seguem o mesmo padrão de formatX(v)/maskXInput(el) já usado
   por CPF/telefone: strip de tudo que não é dígito (o que também
   resolve "colar valor já formatado" — MG e pontuação são removidos
   e reconstruídos do zero, nunca duplicados) + limite de dígitos +
   reconstrução progressiva da máscara. */
function formatIdentidadeMG(v){
  /* Nome da função preservado por compatibilidade com todos os pontos
     de chamada já existentes. NOVO FORMATO (aprovado nesta rodada):
     UF-N.NNN.NNN ou UF-NN.NNN.NNN — duas letras de UF (qualquer
     estado, nunca fixa MG), traço, e a parte numérica com 7 ou 8
     dígitos. A primeira divisão pode ter 1 ou 2 algarismos — como
     isso é ambíguo enquanto a pessoa ainda está digitando, a regra
     usada é: só quando o total de dígitos chegar a 8 é que se aplica
     o agrupamento de 2 dígitos na primeira parte; com 7 dígitos ou
     menos, agrupa como 1 dígito na primeira parte. Isso reflui
     corretamente assim que o 8º dígito é digitado. */
  const raw=(v||'').toUpperCase();
  const uf=(raw.match(/^[A-Z]{0,2}/)||[''])[0];
  const digits=raw.replace(/[^0-9]/g,'').slice(0,8);
  if(!uf && !digits) return '';
  let out=uf;
  if(!digits) return out;
  if(out) out+='-';
  if(digits.length>=8){
    out+=digits.slice(0,2);
    if(digits.length>2) out+='.'+digits.slice(2,5);
    if(digits.length>5) out+='.'+digits.slice(5,8);
  } else {
    out+=digits.slice(0,1);
    if(digits.length>1) out+='.'+digits.slice(1,4);
    if(digits.length>4) out+='.'+digits.slice(4,7);
  }
  return out;
}
/* Validação de completude do RG — UF de 2 letras + 7 ou 8 dígitos
   (as duas variações do formato aprovado). Usada nos 3 formulários
   que coletam RG, para uma única fonte de verdade da regra. */
function identidadeValida(v){
  const raw=(v||'').toUpperCase();
  const uf=(raw.match(/^[A-Z]{0,2}/)||[''])[0];
  const digits=raw.replace(/[^0-9]/g,'');
  return uf.length===2 && (digits.length===7 || digits.length===8);
}
function maskIdentidadeInput(el){ el.value=formatIdentidadeMG(el.value); }
function formatNumeroDpfMG(v){
  /* Mesmo raciocínio: nome preservado, sigla de UF removida do
     comportamento. */
  const d=(v||'').replace(/\D/g,'').slice(0,11);
  if(!d) return '';
  let out=d.slice(0,7);
  if(d.length>7) out+='/'+d.slice(7,11);
  return out;
}
function maskNumeroDpfInput(el){ el.value=formatNumeroDpfMG(el.value); }
function contarDigitos(valorFormatado){ return (valorFormatado||'').replace(/\D/g,'').length; }
/* Extrai o máximo de informação real de um erro do Supabase/RPC — não
   deixa nenhum erro silencioso. message/details/hint/code, quando
   existirem, todos aparecem para o usuário; nunca só um texto genérico. */
function formatarErroSupabase(err){
  if(!err) return 'MOTIVO: ERRO INESPERADO AO PROCESSAR O CADASTRO.';
  const partes=[];
  if(err.message) partes.push('Motivo: '+err.message);
  if(err.details) partes.push('Detalhes: '+err.details);
  if(err.hint) partes.push('Informação: '+err.hint);
  if(err.code) partes.push('Código: '+err.code);
  if(partes.length) return partes.join('<br>');
  return 'MOTIVO: ERRO INESPERADO AO PROCESSAR O CADASTRO.';
}
/* MUDANÇA APROVADA NESTA RODADA: "reciclagem" passa a representar
   DIRETAMENTE a data de vencimento da reciclagem/curso — não mais
   "quando foi feita" com +2 anos somados por cima. A regra de "+2
   anos" foi removida por decisão explícita; não deve mais ser usada
   em nenhum fluxo. Regra única, daqui em diante, em todo o sistema:
   a reciclagem cobre um evento quando reciclagem >= data final do
   evento (cobre o evento inteiro, do início ao fim). Comparação por
   string ISO (YYYY-MM-DD), que já ordena cronologicamente sem
   precisar de objetos Date/fuso horário. somaDoisAnosIso() foi
   deixada de propósito (não apagada) só por segurança arquitetural,
   mas não é mais chamada por nenhuma destas duas funções. */
function somaDoisAnosIso(isoDate){
  const [y,m,d]=isoDate.split('-');
  const anoDestino=Number(y)+2;
  const bissexto=(a)=>(a%4===0 && a%100!==0) || a%400===0;
  if(m==='02' && d==='29' && !bissexto(anoDestino)){
    return `${String(anoDestino).padStart(4,'0')}-02-28`;
  }
  return `${String(anoDestino).padStart(4,'0')}-${m}-${d}`;
}
function validarReciclagemParaEvento(dataReciclagemIso, ev){
  const dataInicial=ev.data;
  const dataFinal=ev.dataFim || ev.data;
  const valido=!!dataReciclagemIso && dataReciclagemIso>=dataFinal;
  return {valido, dataInicial, dataFinal};
}
/* Mesma regra, usada no link principal do evento para Vigilantes —
   antes tinha uma interpretação diferente (via somaDoisAnosIso), o
   que criava duas interpretações de "reciclagem" convivendo ao mesmo
   tempo no sistema. Unificado agora: as duas funções usam
   exatamente a mesma regra, só a assinatura de retorno é diferente
   (mantida para não obrigar mudança nos pontos que já consomem cada
   uma). */
function reciclagemValidaAteFinalEvento(dataReciclagemIso, ev){
  if(!dataReciclagemIso) return false;
  const dataFinal=ev.dataFim || ev.data;
  return dataReciclagemIso >= dataFinal;
}
/* Status visual (Fase 5 do pedido) — vermelho/amarelo/verde, comparado
   com a data de hoje (não com o evento). Usado no Banco de
   Colaboradores. "hoje" e "hoje+15" calculados em string ISO local,
   sem depender de fuso horário do navegador para a COMPARAÇÃO em si
   (a obtenção do "hoje" local já é a mesma usada em todo o sistema). */
function corStatusReciclagem(dataIso){
  if(!dataIso) return {cor:'cinza', rotulo:'Sem data cadastrada'};
  const hoje=new Date();
  const hojeIso=`${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,'0')}-${String(hoje.getDate()).padStart(2,'0')}`;
  const d15=new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate()+15);
  const d15Iso=`${d15.getFullYear()}-${String(d15.getMonth()+1).padStart(2,'0')}-${String(d15.getDate()).padStart(2,'0')}`;
  if(dataIso < hojeIso) return {cor:'vermelho', rotulo:'Vencida'};
  if(dataIso <= d15Iso) return {cor:'amarelo', rotulo:'Próxima do vencimento'};
  return {cor:'verde', rotulo:'Válida'};
}

/* ================= BANCO DE COLABORADORES (novo) =================
   Cadastro central e permanente de colaboradores, independente de
   evento — identificado por CPF único. Depende da RPC
   'listar_colaboradores_banco' (authenticated) — ver observação sobre
   Supabase no relatório desta rodada; ainda não criada no banco. */
async function loadColaboradoresBanco(){
  if(!gestorUnlocked){ colaboradoresBanco=[]; return; }
  const {data,error}=await sb.rpc('listar_colaboradores_banco',{});
  if(error){ console.error(error); colaboradoresBanco=[]; return; }
  colaboradoresBanco=data||[];
  /* CORREÇÃO CRÍTICA (2ª rodada, ajustada conforme diagnóstico
     confirmado) — a classificação por histórico de participações
     (abaixo) sozinha deixava colaboradores recém-cadastrados pelo
     Banco (que ainda nunca participaram de nenhum evento) presos em
     "Demais Funções", mesmo com colaboradores.funcao já preenchida
     como VIGILANTE/BRIGADISTA — dando a falsa impressão de que o
     cadastro "não salvou". A classificação agora combina as duas
     fontes com OU: histórico de participações (para quem já
     trabalhou, mesmo com funcao=NULL) OU a função cadastrada agora
     (para quem acabou de ser cadastrado e ainda não participou de
     nada). AJUSTE desta rodada: teste por PREFIXO ("começa com
     VIGILANTE"/"começa com BRIGADISTA"), não mais igualdade exata —
     mesma regra já usada por listar_categorias_colaboradores (LIKE
     'VIGILANTE%'/'BRIGADISTA%'), agora aplicada de forma consistente
     também para colaboradores.funcao. Cobre "VIGILANTE NOTURNO",
     "VIGILANTE PATRIMONIAL", "BRIGADISTA LÍDER DE EQUIPE" etc., não só
     as duas variações fixas de antes. */
  colaboradoresBanco.forEach(c=>{
    const funcaoNorm=normalizaFuncaoDisplay(c.funcao);
    c._ehVigilantePorFuncao = funcaoNorm.startsWith('VIGILANTE');
    c._ehBrigadistaPorFuncao = funcaoNorm.startsWith('BRIGADISTA');
  });
  /* Classificação nas subabas passou a ser baseada no HISTÓRICO REAL
     de participações (public.participacoes), não mais em
     colaboradores.funcao — porque confirmamos que várias pessoas têm
     colaboradores.funcao=NULL mesmo já tendo participado como
     Vigilante/Brigadista em algum evento. RPC nova, só leitura,
     agregando por CPF normalizado (ignora participações anuladas).
     Falha aqui não bloqueia a tela: todo mundo cai em "Demais Funções"
     como comportamento seguro, igual ao que já existia antes desta
     correção. */
  try{
    const {data:categorias,error:errCat}=await sb.rpc('listar_categorias_colaboradores',{});
    if(errCat) throw errCat;
    const porCpf={};
    (categorias||[]).forEach(cat=>{ porCpf[String(cat.cpf||'').replace(/\D/g,'')]=cat; });
    colaboradoresBanco.forEach(c=>{
      const cat=porCpf[String(c.cpf||'').replace(/\D/g,'')];
      c._ehVigilante=!!(cat && cat.eh_vigilante) || c._ehVigilantePorFuncao;
      c._ehBrigadista=!!(cat && cat.eh_brigadista) || c._ehBrigadistaPorFuncao;
    });
  }catch(errCat){
    console.error('Falha ao consultar histórico de participações para classificação:', errCat);
    colaboradoresBanco.forEach(c=>{ c._ehVigilante=c._ehVigilantePorFuncao; c._ehBrigadista=c._ehBrigadistaPorFuncao; });
  }
}
/* Um mesmo CPF pode pertencer a mais de uma subaba (ex: já trabalhou
   como Vigilante em um evento e Brigadista em outro) — por isso isto
   não é mais uma classificação exclusiva (não existe mais uma função
   que devolve "a" categoria de alguém), e sim um teste de
   pertencimento por subaba. "Demais Funções" é quem não pertence a
   nenhuma das duas. */
function colaboradorNaSubaba(c, subaba){
  if(subaba==='vigilantes') return !!c._ehVigilante;
  if(subaba==='brigadistas') return !!c._ehBrigadista;
  return !c._ehVigilante && !c._ehBrigadista;
}
function buscarColaboradorPorCpf(cpf){
  const norm=String(cpf||'').replace(/\D/g,'');
  return colaboradoresBanco.find(c=>String(c.cpf||'').replace(/\D/g,'')===norm) || null;
}
function filtrarColaboradoresBanco(lista){
  /* CORREÇÃO DESTA RODADA — antes só considerava nome/CPF (com OU
     entre eles); os outros 4 filtros já existiam na interface e
     tinham handlers corretos, mas eram ignorados aqui. Agora os 6
     filtros existentes são combinados com E: cada filtro preenchido
     restringe mais a lista. Nenhum filtro preenchido = lista
     completa (limpar filtros restaura tudo). NOVO NESTA RODADA:
     filtro de cidade em lista suspensa (comparação exata, já que vem
     de uma lista de valores já existentes no banco) — combinado com
     E junto de todos os demais, inclusive o filtro de cidade em
     texto livre já existente (os dois podem estar preenchidos ao
     mesmo tempo, cada um restringindo mais a lista). */
  const buscaTexto=colaboradoresBuscaNome.trim().toLowerCase();
  const buscaCpfDigits=colaboradoresBuscaCpf.replace(/\D/g,'');
  const buscaTelDigits=colaboradoresBuscaTelefone.replace(/\D/g,'');
  const buscaCidade=colaboradoresBuscaCidade.trim().toLowerCase();
  return lista.filter(c=>{
    if(buscaTexto && !(c.nome||'').toLowerCase().includes(buscaTexto)) return false;
    if(buscaCpfDigits && !String(c.cpf||'').replace(/\D/g,'').includes(buscaCpfDigits)) return false;
    if(buscaTelDigits && !String(c.telefone||'').replace(/\D/g,'').includes(buscaTelDigits)) return false;
    if(buscaCidade && !(c.cidade||'').toLowerCase().includes(buscaCidade)) return false;
    if(colaboradoresBuscaCidadeDropdown && (c.cidade||'').trim()!==colaboradoresBuscaCidadeDropdown) return false;
    if(colaboradoresBuscaGrandesEventos==='sim' && c.grandes_eventos!==true) return false;
    if(colaboradoresBuscaGrandesEventos==='nao' && c.grandes_eventos!==false) return false;
    if(colaboradoresBuscaSituacaoReciclagem && corStatusReciclagem(c.reciclagem).cor!==colaboradoresBuscaSituacaoReciclagem) return false;
    return true;
  });
}
/* Classificação por subaba — reaproveita exatamente a mesma
   normalização/base já usada em todo o sistema (baseDaFuncaoDisplay +
   normalizaFuncaoDisplay), então "VIGILANTE LÍDER DE EQUIPE" continua
   caindo em Vigilantes sem nenhuma lógica nova. Nada aqui altera a
   função armazenada — só decide em qual subaba o colaborador aparece. */
function renderBancoColaboradores(main){
  const contagens={vigilantes:0, brigadistas:0, demais:0};
  colaboradoresBanco.forEach(c=>{
    if(colaboradorNaSubaba(c,'vigilantes')) contagens.vigilantes++;
    if(colaboradorNaSubaba(c,'brigadistas')) contagens.brigadistas++;
    if(colaboradorNaSubaba(c,'demais')) contagens.demais++;
  });
  /* NOVO NESTA RODADA — filtro de Cidade em lista suspensa, no topo,
     junto do filtro de texto livre já existente (preservado). Lista
     as cidades cadastradas em TODO o Banco (não só da subaba ativa),
     sem normalização destrutiva: o texto vem exatamente como está
     gravado no banco, só remove duplicatas EXATAS (mesma grafia) e
     ordena alfabeticamente. Se houver "Belo Horizonte" e
     "belo horizonte" cadastrados como textos diferentes, aparecem
     como 2 opções distintas — decisão deliberada, para não decidir
     por conta própria qual é a grafia "certa". */
  const cidadesUnicas=[...new Set(colaboradoresBanco.map(c=>(c.cidade||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  main.innerHTML=`
    <div class="card-title">Banco de Colaboradores</div>
    <div class="card-sub">Cadastro central e permanente — um único registro por CPF, reaproveitado em todos os eventos em que a pessoa trabalhar. Também alimentado automaticamente pelos links públicos dos eventos.</div>
    <div class="panel">

        <div class="field"><label>Filtrar por cidade (lista)</label>
          <select id="buscaColaboradorCidadeDropdown">
            <option value="" ${colaboradoresBuscaCidadeDropdown===''?'selected':''}>Todas as cidades</option>
            ${cidadesUnicas.map(cid=>`<option value="${escapeHtml(cid)}" ${colaboradoresBuscaCidadeDropdown===cid?'selected':''}>${escapeHtml(cid)}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="add-row" style="align-items:center; flex-wrap:wrap;">
        <div class="field"><label>Buscar por nome</label><input type="text" id="buscaColaboradorNome" placeholder="Nome" value="${escapeHtml(colaboradoresBuscaNome)}"></div>
        <div class="field"><label>Buscar por CPF</label><input type="text" id="buscaColaboradorCpf" placeholder="000.000.000-00" maxlength="14" value="${escapeHtml(colaboradoresBuscaCpf)}"></div>
        <div class="field"><label>Telefone</label><input type="text" id="buscaColaboradorTelefone" placeholder="(00) 0 0000-0000" maxlength="16" value="${escapeHtml(colaboradoresBuscaTelefone)}"></div>
        <div class="field"><label>Cidade</label><input type="text" id="buscaColaboradorCidade" placeholder="Cidade" value="${escapeHtml(colaboradoresBuscaCidade)}"></div>
        <div class="field"><label>Grandes eventos</label>
          <select id="buscaColaboradorGrandesEventos">
            <option value="" ${colaboradoresBuscaGrandesEventos===''?'selected':''}>Todos</option>
            <option value="sim" ${colaboradoresBuscaGrandesEventos==='sim'?'selected':''}>Sim</option>
            <option value="nao" ${colaboradoresBuscaGrandesEventos==='nao'?'selected':''}>Não</option>
          </select>
        </div>
        <div class="field"><label>Situação da reciclagem</label>
          <select id="buscaColaboradorSituacaoReciclagem">
            <option value="" ${colaboradoresBuscaSituacaoReciclagem===''?'selected':''}>Todas</option>
            <option value="vermelho" ${colaboradoresBuscaSituacaoReciclagem==='vermelho'?'selected':''}>Vencida</option>
            <option value="amarelo" ${colaboradoresBuscaSituacaoReciclagem==='amarelo'?'selected':''}>Próxima do vencimento</option>
            <option value="verde" ${colaboradoresBuscaSituacaoReciclagem==='verde'?'selected':''}>Válida</option>
          </select>
        </div>
        ${gestorUnlocked ? `<button class="btn btn-amber" id="btnNovoColaboradorBanco" style="align-self:flex-end;">+ Novo Colaborador</button>` : ''}
      </div>
      ${!gestorUnlocked ? lockScreenHtml('O Banco de Colaboradores só fica visível para o gestor.') : `
      <div class="subtabs" style="margin-top:6px;">
        <div class="subtab ${colaboradoresSubaba==='vigilantes'?'active':''}" data-subaba="vigilantes">Vigilantes<span class="count">${contagens.vigilantes}</span></div>
        <div class="subtab ${colaboradoresSubaba==='brigadistas'?'active':''}" data-subaba="brigadistas">Brigadistas<span class="count">${contagens.brigadistas}</span></div>
        <div class="subtab ${colaboradoresSubaba==='demais'?'active':''}" data-subaba="demais">Demais Funções<span class="count">${contagens.demais}</span></div>
      </div>
      <div id="colaboradoresBancoLista">${renderListaColaboradoresBanco()}</div>
      `}
    </div>
  `;
  attachBancoColaboradoresHandlers();
}
function renderListaColaboradoresBanco(){
  const daSubaba=colaboradoresBanco.filter(c=>colaboradorNaSubaba(c,colaboradoresSubaba));
  const lista=filtrarColaboradoresBanco(daSubaba);
  if(!lista.length){
    const buscaAtiva=colaboradoresBuscaNome.trim()||colaboradoresBuscaCpf.trim()||colaboradoresBuscaTelefone.trim()||colaboradoresBuscaCidade.trim()||colaboradoresBuscaGrandesEventos||colaboradoresBuscaSituacaoReciclagem||colaboradoresBuscaCidadeDropdown;
    return `<div class="empty"><b>${buscaAtiva?'Nenhum resultado para essa busca':'Nenhum colaborador nesta categoria ainda'}</b>${buscaAtiva?'':'Cadastre manualmente ou aguarde o preenchimento pelo link do evento.'}</div>`;

  /* NOVO NESTA RODADA — coluna FUNÇÃO adicionada logo antes de NOME
     nas 3 tabelas (mostra a função real cadastrada, nunca um texto
     genérico). Também nesta rodada: bloco próprio de "Demais Funções"
     (antes misturado com o de Vigilante) — colunas FUNÇÃO, NOME, CPF,
     RG, CIDADE, TELEFONE, sem GE/DPF/reciclagem/registro, já que

  if(colaboradoresSubaba==='brigadistas'){

              <td>${escapeHtml(c.cidade||'—')}</td>
              <td>${escapeHtml(c.numero_registro_brigadista||'—')}</td>

              <td><button class="btn btn-ghost btn-sm btn-editar-colaborador-banco">Editar</button></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    `;
  }

  if(colaboradoresSubaba==='demais'){
    return `
      <table>
        <thead><tr><th>#</th><th>Função</th><th>Nome</th><th>CPF</th><th>RG</th><th>Cidade</th><th>Telefone</th><th></th></tr></thead>
        <tbody>
          ${nomesOrdenados.map((c,i)=>`
            <tr data-cpf="${c.cpf}">
              <td class="mono">${i+1}</td>
              <td>${escapeHtml(c.funcao||'—')}</td>
              <td>${escapeHtml(nomeExibicao(c.nome))}</td>
              <td class="mono">${formatCpf(c.cpf)}</td>
              <td>${escapeHtml(c.identidade||'—')}</td>
              <td>${escapeHtml(c.cidade||'—')}</td>
              <td class="mono">${c.telefone?formatTelefone(c.telefone):'—'}</td>
              <td><button class="btn btn-ghost btn-sm btn-editar-colaborador-banco">Editar</button></td>
            </tr>`).join('')}
        </tbody>
      </table>
    `;
  }

  /* Ordem de colunas (Vigilantes): Função, Nome, CPF, RG, Data de
     Vencimento da Reciclagem/Curso (com cor de status), Cidade,
     Grandes Eventos, Nº DPF, Telefone. "Data do curso" não aparece
     mais — data_curso continua intacta no banco, só deixou de ser
     coletada/exibida. */
  return `
    <table>
      <thead><tr><th>#</th><th>Função</th><th>Nome</th><th>CPF</th><th>RG</th><th>Data de vencimento da reciclagem/curso</th><th>Cidade</th><th>Grandes eventos</th><th>Nº DPF</th><th>Telefone</th><th></th></tr></thead>
      <tbody>
        ${nomesOrdenados.map((c,i)=>{
          const status=corStatusReciclagem(c.reciclagem);
          return `
          <tr data-cpf="${c.cpf}">

            <td>${escapeHtml(c.funcao||'—')}</td>
            <td>${escapeHtml(nomeExibicao(c.nome))}</td>
            <td class="mono">${formatCpf(c.cpf)}</td>
            <td>${escapeHtml(c.identidade||'—')}</td>

function attachBancoColaboradoresHandlers(){
  const inpNome=document.getElementById('buscaColaboradorNome');
  const inpCpf=document.getElementById('buscaColaboradorCpf');
  const inpTelefone=document.getElementById('buscaColaboradorTelefone');
  const inpCidade=document.getElementById('buscaColaboradorCidade');
  const selCidadeDropdown=document.getElementById('buscaColaboradorCidadeDropdown');
  const selGrandesEventos=document.getElementById('buscaColaboradorGrandesEventos');
  const selSituacaoReciclagem=document.getElementById('buscaColaboradorSituacaoReciclagem');
  const atualizarLista=()=>{
    const lista=document.getElementById('colaboradoresBancoLista');
    if(lista){ lista.innerHTML=renderListaColaboradoresBanco(); attachColaboradoresBancoListaHandlers(); }
  };
  if(inpNome) inpNome.oninput=()=>{ colaboradoresBuscaNome=inpNome.value; atualizarLista(); };
  if(inpCpf) inpCpf.oninput=(e)=>{ maskCpfInput(e.target); colaboradoresBuscaCpf=inpCpf.value; atualizarLista(); };
  if(inpTelefone) inpTelefone.oninput=(e)=>{ maskTelefoneInput(e.target); colaboradoresBuscaTelefone=inpTelefone.value; atualizarLista(); };
  if(inpCidade) inpCidade.oninput=()=>{ colaboradoresBuscaCidade=inpCidade.value; atualizarLista(); };
  if(selCidadeDropdown) selCidadeDropdown.onchange=()=>{ colaboradoresBuscaCidadeDropdown=selCidadeDropdown.value; atualizarLista(); };
  if(selGrandesEventos) selGrandesEventos.onchange=()=>{ colaboradoresBuscaGrandesEventos=selGrandesEventos.value; atualizarLista(); };
  if(selSituacaoReciclagem) selSituacaoReciclagem.onchange=()=>{ colaboradoresBuscaSituacaoReciclagem=selSituacaoReciclagem.value; atualizarLista(); };
  document.querySelectorAll('.subtab[data-subaba]').forEach(t=>{
    t.onclick=()=>{ colaboradoresSubaba=t.dataset.subaba; renderShell(); };
  });
  const btnNovo=document.getElementById('btnNovoColaboradorBanco');
  if(btnNovo) btnNovo.onclick=()=>abrirFormularioColaboradorBanco(null, colaboradoresSubaba==='brigadistas', colaboradoresSubaba==='demais');
  attachColaboradoresBancoListaHandlers();
}
/* Edição reativada nesta rodada (antes desabilitada por pedido de uma
   rodada anterior). O formulário e a RPC upsert_colaborador_banco já
   existiam — só reconectados à interface. */
function attachColaboradoresBancoListaHandlers(){
  document.querySelectorAll('.btn-editar-colaborador-banco').forEach(btn=>{
    btn.onclick=()=>{
      const cpf=btn.closest('tr').dataset.cpf;
      abrirFormularioColaboradorBanco(buscarColaboradorPorCpf(cpf));
    };
  });
}
/* ================= NOVO/EDITAR COLABORADOR (gestor) =================

   existente, o CPF fica travado (não se muda a identidade de um

   novo). Depende da RPC 'upsert_colaborador_banco' (authenticated) —

   criada no banco. */
function abrirFormularioColaboradorBanco(existente, forcarBrigadista, forcarDemais){

  /* NOVO NESTA RODADA — quando o botão + Novo Colaborador é clicado

     cadastro novo, nunca a edição), o campo Função continua existindo

     existente) mas fica oculto e pré-fixado em BRIGADISTA — o gestor
     não vê nem escolhe função nesse caso. Na edição, ou quando aberto
     fora da aba Brigadistas, o campo aparece exatamente como sempre.
     forcarDemais (NOVO): clicado dentro da aba Demais Funções — o

      </div>

      <div class="field"><label>CPF</label><input type="text" id="fcbCpf" maxlength="14" placeholder="000.000.000-00" value="${existente?formatCpf(existente.cpf):''}" ${ehEdicao?'disabled':''}></div>
      <div class="field"><label>RG</label><input type="text" id="fcbIdentidade" placeholder="UF-N.NNN.NNN" value="${escapeHtml(existente?formatIdentidadeMG(existente.identidade||''):'')}"></div>

      </div>

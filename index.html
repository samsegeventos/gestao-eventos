  `;
  document.body.appendChild(overlay);

  const cpfEl=document.getElementById('fcbCpf');
  if(cpfEl) cpfEl.oninput=()=>maskCpfInput(cpfEl);
  const identidadeEl=document.getElementById('fcbIdentidade');
  identidadeEl.oninput=()=>maskIdentidadeInput(identidadeEl);
  const dpfEl=document.getElementById('fcbNumeroDpf');
  dpfEl.oninput=()=>maskNumeroDpfInput(dpfEl);
  const telEl=document.getElementById('fcbTelefone');
  telEl.oninput=()=>maskTelefoneInput(telEl);
  const nomeEl=document.getElementById('fcbNome');
  nomeEl.oninput=()=>{ const pos=nomeEl.selectionStart; nomeEl.value=nomeEl.value.toUpperCase(); nomeEl.setSelectionRange(pos,pos); };
  const funcaoSel=document.getElementById('fcbFuncao');
  const funcaoOutra=document.getElementById('fcbFuncaoOutra');
  const camposVigilante=document.getElementById('fcbCamposVigilante');
  const camposBrigadista=document.getElementById('fcbCamposBrigadista');
  const campoReciclagemWrap=document.getElementById('fcbCampoReciclagemWrap');
  const labelReciclagem=document.getElementById('fcbLabelReciclagem');
  /* 3 vias — Vigilante (prefixo VIGILANTE, cobre "VIGILANTE",
     "VIGILANTE LÍDER DE EQUIPE", "VIGILANTE NOTURNO" etc.): mostra
     Grandes Eventos/DPF/reciclagem, rótulo original da data.
     Brigadista (prefixo BRIGADISTA): mostra Nº Registro Brigadista e
     reciclagem, rótulo "Data de vencimento do curso". Demais Funções
     (nem um nem outro, inclusive "Outra função" com texto livre que
     não comece com nenhum dos dois prefixos): esconde Grandes
     Eventos/DPF/Nº Registro Brigadista E também a Data de Vencimento
     — só Nome/CPF/RG/Cidade/Telefone. Mesma regra de prefixo usada
     na classificação das abas (loadColaboradoresBanco), para nunca
     discordar de onde o colaborador vai aparecer depois de salvo. */
  const atualizarCamposPorFuncao=()=>{
    const funcaoAtual = funcaoSel.value==='__outra__' ? funcaoOutra.value.trim() : funcaoSel.value;
    const funcaoAtualNorm = normalizaFuncaoDisplay(funcaoAtual);
    const ehVig = funcaoAtualNorm.startsWith('VIGILANTE');
    const ehBrig = funcaoAtualNorm.startsWith('BRIGADISTA');
    camposVigilante.style.display = ehVig ? '' : 'none';
    camposBrigadista.style.display = ehBrig ? '' : 'none';
    campoReciclagemWrap.style.display = (ehVig||ehBrig) ? '' : 'none';
    labelReciclagem.textContent = ehBrig ? 'Data de vencimento do curso' : 'Data de vencimento da reciclagem/curso';
  };
  funcaoSel.onchange=()=>{ funcaoOutra.style.display = funcaoSel.value==='__outra__' ? 'block' : 'none'; atualizarCamposPorFuncao(); };
  funcaoOutra.oninput=atualizarCamposPorFuncao; // texto livre de "Outra função" também decide os campos (ex.: digitar "Vigilante" manualmente)
  atualizarCamposPorFuncao(); // aplica o estado inicial certo já na abertura (novo cadastro ou edição)

  document.getElementById('fcbCancelar').onclick=()=>overlay.remove();

  document.getElementById('fcbSalvar').onclick=async ()=>{
    const erroBox=document.getElementById('fcbErro');
    erroBox.innerHTML='';
    const funcao = funcaoSel.value==='__outra__' ? funcaoOutra.value.trim() : funcaoSel.value;
    const nome=nomeExibicao(nomeEl.value);
    const cpfLimpo=cpfEl.value.replace(/\D/g,'');
    const identidade=formatIdentidadeMG(identidadeEl.value);
    const reciclagem=document.getElementById('fcbReciclagem').value;
    const numeroDpf=formatNumeroDpfMG(dpfEl.value);
    const cidade=document.getElementById('fcbCidade').value.trim();
    /* AJUSTE DESTA RODADA — mesma regra de prefixo usada na
       classificação das abas (startsWith, não igualdade exata), para
       o formulário nunca discordar de onde o colaborador vai
       aparecer depois de salvo (ex.: "VIGILANTE NOTURNO" digitado em
       "Outra função" agora é reconhecido como Vigilante aqui também,
       não só na listagem). */
    const funcaoNormSalvar=normalizaFuncaoDisplay(funcao);
    const ehVig = funcaoNormSalvar.startsWith('VIGILANTE');
    const ehBrig = funcaoNormSalvar.startsWith('BRIGADISTA');
    const ehDemais = !ehVig && !ehBrig;
    const grandesEventosValor = ehVig ? document.getElementById('fcbGrandesEventos').value : '';
    const telefoneDigits=telEl.value.replace(/\D/g,'');
    const numeroRegistroBrigadista = ehBrig ? document.getElementById('fcbNumeroRegistroBrigadista').value.trim() : '';

    /* Campos obrigatórios do Novo Colaborador (também na edição) —
       RG/Identidade sempre obrigatório nos 3 casos. Validação
       client-side aqui; a mesma regra também passa a existir na RPC
       (backend), para que não seja possível contornar salvando por
       outro caminho. 3 VIAS NESTA RODADA: Vigilante (GE/DPF/data
       obrigatórios, upsert_colaborador_banco); Brigadista (Nº Registro
       Brigadista/data obrigatórios, upsert_colaborador_banco_brigadista_v1);
       Demais Funções (NOVO — só Nome/CPF/RG/Cidade/Telefone, sem
       data/GE/DPF/registro, upsert_colaborador_banco_demais_v1 —
       nenhuma das duas RPCs existentes é tocada). */
    if(!funcao){ erroBox.textContent='Selecione a função.'; return; }
    if(!nome){ erroBox.textContent='Informe o nome completo.'; return; }
    if(cpfLimpo.length!==11){ erroBox.textContent='CPF INVÁLIDO. VERIFIQUE OS NÚMEROS INFORMADOS.'; return; }
    if(!ehEdicao && buscarColaboradorPorCpf(cpfLimpo)){
      erroBox.textContent='Este CPF já está cadastrado no Banco de Colaboradores. Use "Editar" na listagem em vez de criar um novo.';
      return;
    }
    if(!identidade){ erroBox.textContent='Informe o RG.'; return; }
    if(!identidadeValida(identidade)){ erroBox.textContent='RG EM FORMATO INVÁLIDO. USE UF-N.NNN.NNN.'; return; }
    if(!telefoneDigits){ erroBox.textContent='Informe o telefone.'; return; }
    if(!cidade){ erroBox.textContent='Informe a cidade.'; return; }
    if(ehDemais){
      // Nome/CPF/RG/Cidade/Telefone já validados acima — nada mais exigido para Demais Funções
    } else if(ehBrig){
      if(!reciclagem){ erroBox.textContent='Informe a data de vencimento do curso.'; return; }
      if(!numeroRegistroBrigadista){ erroBox.textContent='Informe o Nº Registro Brigadista.'; return; }
    } else {
      if(!reciclagem){ erroBox.textContent='Informe a data de vencimento da reciclagem/curso.'; return; }
      if(grandesEventosValor===''){ erroBox.textContent='Selecione se participa de grandes eventos.'; return; }
      if(!numeroDpf){ erroBox.textContent='Informe o Nº DPF.'; return; }
      if(contarDigitos(numeroDpf)<11){ erroBox.textContent='Nº DPF INCOMPLETO. PREENCHA TODOS OS NÚMEROS.'; return; }
    }
    const grandesEventos=grandesEventosValor==='sim';

    const btnSalvar=document.getElementById('fcbSalvar');
    btnSalvar.disabled=true; btnSalvar.textContent='Salvando...';
    try{
      let r;
      if(ehBrig){
        r = await chamarRpcGestor('upsert_colaborador_banco_brigadista_v1',{
          p_cpf:cpfLimpo, p_nome:nome, p_telefone:telefoneDigits||null,
          p_identidade:identidade||null, p_reciclagem:reciclagem||null,
          p_numero_registro_brigadista:numeroRegistroBrigadista||null, p_cidade:cidade||null
        });
      } else if(ehDemais){
        r = await chamarRpcGestor('upsert_colaborador_banco_demais_v1',{
          p_cpf:cpfLimpo, p_nome:nome, p_funcao:funcao, p_telefone:telefoneDigits||null,
          p_identidade:identidade||null, p_cidade:cidade||null
        });
      } else {
        r = await chamarRpcGestor('upsert_colaborador_banco',{
          p_cpf:cpfLimpo, p_nome:nome, p_funcao:funcao, p_telefone:telefoneDigits||null,
          p_identidade:identidade||null, p_data_curso:null, p_reciclagem:reciclagem||null,
          p_numero_dpf:numeroDpf||null, p_cidade:cidade||null, p_grandes_eventos:grandesEventos
        });
      }
      if(!r.ok) throw r.error;
      showToast('Dados atualizados com sucesso.');
      overlay.remove();
      /* Propaga nome/telefone (únicos campos cadastrais também
         armazenados em staff/interessados) para os eventos onde este
         CPF já aparece — nunca mexe em função, escala, presença,
         check-in/checkout ou valores. Só roda para edição de
         colaborador já existente (um cadastro novo, por definição,
         ainda não está em nenhum evento). Não bloqueia o fluxo em
         caso de falha — o cadastro no Banco já foi salvo com sucesso. */
      if(ehEdicao){
        try{
          const {error:erroPropagacao}=await sb.rpc('propagar_dados_colaborador',{p_cpf:cpfLimpo, p_nome:nome, p_telefone:telefoneDigits||null});
          if(erroPropagacao) throw erroPropagacao;
        }catch(propErr){
          console.error('Falha ao propagar dados cadastrais para os eventos:', propErr);
        }
      }
      await loadColaboradoresBanco();
      renderShell();
    }catch(err){
      console.error('Erro ao salvar colaborador no Banco:', err);
      erroBox.innerHTML=formatarErroSupabase(err);
      btnSalvar.disabled=false; btnSalvar.textContent='Salvar';
    }
  };
}
/* ================= IMPRESSÃO DE CRACHÁS (novo, dentro do evento) =================
   Fonte da lista de escalados: staff[] (Escala Oficial) — nunca a
   Pré-Escala. Fonte dos dados cadastrais: colaboradoresBanco (Banco
   de Colaboradores), casado por CPF. */
const CAMPOS_OBRIGATORIOS_CRACHA = ['nome','cpf','identidade','data_curso','reciclagem','numero_dpf']; // fácil de ajustar depois — sem foto, sem telefone, sem e-mail, sem data de nascimento
/* NOVO — campos obrigatórios equivalentes para Brigadista, paralelos
   aos de Vigilante (constante acima, intocada). Sem numero_dpf (não
   se aplica), com numero_registro_brigadista no lugar. */
const CAMPOS_OBRIGATORIOS_CRACHA_BRIGADISTA = ['nome','cpf','identidade','reciclagem','numero_registro_brigadista'];
function statusCrachaColaboradorBrigadista(cadastro){
  if(!cadastro) return {completo:false, faltando:['todos os dados (colaborador ainda não preencheu o formulário)']};
  const rotulos={nome:'nome', cpf:'CPF', identidade:'identidade', reciclagem:'vencimento do curso', numero_registro_brigadista:'Nº de registro'};
  const faltando=CAMPOS_OBRIGATORIOS_CRACHA_BRIGADISTA.filter(campo=>!cadastro[campo]).map(campo=>rotulos[campo]);
  return {completo:faltando.length===0, faltando};
}
function statusCrachaColaborador(cadastro){
  if(!cadastro) return {completo:false, faltando:['todos os dados (colaborador ainda não preencheu o formulário)']};
  const rotulos={nome:'nome', cpf:'CPF', identidade:'identidade', data_curso:'data do curso', reciclagem:'reciclagem', numero_dpf:'Nº DPF'};
  const faltando=CAMPOS_OBRIGATORIOS_CRACHA.filter(campo=>!cadastro[campo]).map(campo=>rotulos[campo]);
  return {completo:faltando.length===0, faltando};
}
function renderImpressaoCrachas(){
  if(!gestorUnlocked) return lockScreenHtml('A impressão de crachás só fica visível para o gestor.');
  const ev=currentEvent();
  /* Impressão de Crachás — Vigilante (SEÇÃO INTOCADA, mesma lógica de
     sempre: baseDaFuncaoDisplay+normalizaFuncaoDisplay, Vigilante
     Líder de Equipe incluído automaticamente, Escala Oficial como
     única fonte). NOVO nesta rodada: a seção de Brigadista foi
     adicionada como um bloco totalmente paralelo mais abaixo — para
     isso o "return" antecipado de antes (quando não havia Vigilante
     escalado) foi removido e virou uma variável de controle
     (semVigilantes), porque agora a tela pode ter conteúdo de
     Brigadista mesmo sem nenhum Vigilante escalado, e vice-versa. */
  const ehVigilante=s=>baseDaFuncaoDisplay(normalizaFuncaoDisplay(s.funcao))==='VIGILANTE';
  const escalados=staff.filter(s=>s.escalado && ehVigilante(s));
  const linkCracha=`${location.origin}${location.pathname}?modo=cracha&evento=${ev.id}`;
  const semVigilantes = escalados.length===0;
  let secaoVigilante;
  if(semVigilantes){
    secaoVigilante = `
      <div class="card-sub">Nenhum vigilante escalado ainda — confirme colaboradores em "Escala Oficial" primeiro. Esta seção mostra só a função Vigilante (inclusive Vigilante Líder de Equipe).</div>
    `;
  } else {
    const linhas=escalados.map(s=>{
      const cadastro=buscarColaboradorPorCpf(s.cpf);
      const status=statusCrachaColaborador(cadastro);
      return {staff:s, cadastro, status};
    });
    const completos=linhas.filter(l=>l.status.completo);
    secaoVigilante = `
      <div class="add-row" style="align-items:center;">
        <input type="text" readonly value="${escapeHtml(linkCracha)}" style="flex:1; min-width:240px;" id="inputLinkCracha">
        <button class="btn btn-amber" id="btnCopiarLinkCracha">Link para cadastro do crachá</button>
      </div>
      <table style="margin-top:16px;">
        <thead><tr><th><input type="checkbox" id="chkSelecionarTodosCracha"></th><th>Nome</th><th>Função</th><th>CPF</th><th>Status</th></tr></thead>
        <tbody>
          ${linhas.map(l=>`
            <tr data-cpf="${l.staff.cpf||''}">
              <td><input type="checkbox" class="chk-cracha-item" ${l.status.completo?'':'disabled'} ${crachaSelecionados.has(l.staff.cpf)?'checked':''}></td>
              <td>${escapeHtml(nomeExibicao(l.staff.nome))}</td>
              <td>${escapeHtml(l.staff.funcao||'—')}</td>
              <td class="mono">${l.staff.cpf?formatCpf(l.staff.cpf):'—'}</td>
              <td>
                ${l.status.completo
                  ? `<span class="badge pago">Dados completos</span>`
                  : `<span class="badge pendente">Pendente</span> <span style="font-size:11px;color:var(--muted);">faltando: ${escapeHtml(l.status.faltando.join(', '))}</span>`}
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
      <div style="margin-top:16px; display:flex; align-items:center; gap:12px;">
        <button class="btn btn-teal" id="btnImprimirCrachas" ${completos.length?'':'disabled'}>Imprimir crachás</button>
        <span style="font-size:12px;color:var(--muted);">${completos.length} de ${escalados.length} colaborador(es) com dados completos</span>
      </div>
    `;
  }

  /* ================= BRIGADISTA — SEÇÃO NOVA, INDEPENDENTE =================
     Mesma estrutura da seção de Vigilante acima, mas com seu próprio
     filtro (ehBrigadista), seu próprio Set de seleção
     (crachaSelecionadosBrigadista), e sua própria função de status
     (statusCrachaColaboradorBrigadista). Não compartilha nada com a
     seção de Vigilante além do layout visual (mesmas classes CSS já
     existentes — table, badge, btn, etc., todas genéricas). */
  const ehBrigadista=s=>baseDaFuncaoDisplay(normalizaFuncaoDisplay(s.funcao))==='BRIGADISTA';
  const escaladosBrig=staff.filter(s=>s.escalado && ehBrigadista(s));
  let secaoBrigadista;
  if(escaladosBrig.length===0){
    secaoBrigadista = `
      <div class="card-sub">Nenhum brigadista escalado ainda — confirme colaboradores em "Escala Oficial" primeiro. Esta seção mostra só a função Brigadista.</div>
    `;
  } else {
    const linhasBrig=escaladosBrig.map(s=>{
      const cadastro=buscarColaboradorPorCpf(s.cpf);
      const status=statusCrachaColaboradorBrigadista(cadastro);
      return {staff:s, cadastro, status};
    });
    const completosBrig=linhasBrig.filter(l=>l.status.completo);
    secaoBrigadista = `
      <div class="add-row" style="align-items:center;">
        <input type="text" readonly value="${escapeHtml(linkCracha)}" style="flex:1; min-width:240px;" id="inputLinkCrachaBrigadista">
        <button class="btn btn-amber" id="btnCopiarLinkCrachaBrigadista">Link para cadastro do crachá</button>
      </div>
      <table style="margin-top:16px;">
        <thead><tr><th><input type="checkbox" id="chkSelecionarTodosCrachaBrigadista"></th><th>Nome</th><th>Função</th><th>CPF</th><th>Status</th></tr></thead>
        <tbody>
          ${linhasBrig.map(l=>`
            <tr data-cpf="${l.staff.cpf||''}">
              <td><input type="checkbox" class="chk-cracha-item-brigadista" ${l.status.completo?'':'disabled'} ${crachaSelecionadosBrigadista.has(l.staff.cpf)?'checked':''}></td>
              <td>${escapeHtml(nomeExibicao(l.staff.nome))}</td>
              <td>${escapeHtml(l.staff.funcao||'—')}</td>
              <td class="mono">${l.staff.cpf?formatCpf(l.staff.cpf):'—'}</td>
              <td>
                ${l.status.completo
                  ? `<span class="badge pago">Dados completos</span>`
                  : `<span class="badge pendente">Pendente</span> <span style="font-size:11px;color:var(--muted);">faltando: ${escapeHtml(l.status.faltando.join(', '))}</span>`}
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
      <div style="margin-top:16px; display:flex; align-items:center; gap:12px;">
        <button class="btn btn-teal" id="btnImprimirCrachasBrigadista" ${completosBrig.length?'':'disabled'}>Imprimir crachás de Brigadistas</button>
        <span style="font-size:12px;color:var(--muted);">${completosBrig.length} de ${escaladosBrig.length} colaborador(es) com dados completos</span>
      </div>
    `;
  }

  return `
    <div class="card-title">Impressão de crachás</div>
    <div class="card-sub">Lista vem da Escala Oficial. Envie o link abaixo para cada colaborador completar os dados do crachá — os dados ficam salvos no Banco de Colaboradores e são reaproveitados em outros eventos.</div>
    <div class="section-title" style="margin-top:20px;">Vigilantes</div>
    ${secaoVigilante}
    <div class="section-title" style="margin-top:28px;">Brigadistas Eventuais</div>
    ${secaoBrigadista}
  `;
}
/* ================= JANELA REAL DE IMPRESSÃO DE CRACHÁS =================
   Monta um documento HTML próprio (sem menu, sem abas, sem tabela
   administrativa, sem nenhum elemento do painel) numa nova aba/janela
   via window.open() e aciona a impressão do navegador. Layout físico
   FIXO, sem escala/zoom/transform nenhum:
   - Cada conjunto (frente+verso lado a lado) = 190mm x 65mm exatos.
   - Frente = 95mm x 65mm | Verso = 95mm x 65mm (linha de dobra
     discreta exatamente na divisão dos 95mm).
   - A4 retrato, margem 12mm/10mm/13mm/10mm (topo/direita/baixo/esq.)
     → área útil = 190mm x 272mm; 4 conjuntos de 65mm = 260mm,
     sobrando exatamente 12mm para os 3 espaços de corte entre eles
     (gap:4mm) — matemática batendo com o pedido (nenhum valor
     arredondado "no olho").
   - Mais de 4 selecionados: agrupa em blocos de 4, cada bloco é uma
     página própria (page-break-after), nunca reduz nem corta.
   Logo real da Samseg (arquivo enviado, embutido em base64 — funciona
   dentro da janela em branco sem depender de hospedagem externa),
   proporção original preservada via width fixo + height:auto (nunca

function abrirJanelaImpressaoCrachas(selecionados){
  const CRACHAS_POR_PAGINA=4;
  const grupos=[];
  for(let i=0;i<selecionados.length;i+=CRACHAS_POR_PAGINA){
    grupos.push(selecionados.slice(i,i+CRACHAS_POR_PAGINA));
  }

  const conjuntoHtml=(s)=>{
    const cad=buscarColaboradorPorCpf(s.cpf);
    const nome=nomeExibicao(s.nome);
    return `
      <div class="conjunto-cracha">
        <div class="face-frente">
          <div class="frente-topo">
            <div class="frente-logo-wrap"><img class="frente-logo" src="data:image/png;base64,${LOGO_SAMSEG_BASE64}" alt="SAMSEG"></div>
            <div class="frente-foto-espaco"></div>
          </div>
          <div class="frente-titulo">SEGURANÇA EVENTUAL</div>
          <div class="frente-nome">NOME: ${escapeHtml(nome)}</div>
        </div>
        <div class="face-verso">
          <div class="verso-header">
            <div>VÁLIDO SOMENTE EM EVENTOS DO GRUPO ANJOS DA PAZ</div>
            <div class="verso-header-empresa">SAMSEG SEGURANÇA PRIVADA</div>
          </div>
          <div class="verso-grid">
            <div class="verso-cel"><b>IDENTIDADE:</b><span>${escapeHtml(formatIdentidadeMG(cad.identidade||''))}</span></div>
            <div class="verso-cel"><b>CPF:</b><span>${formatCpf(cad.cpf)}</span></div>
            <div class="verso-cel"><b>VENC. RECICLAGEM/CURSO:</b><span>${cad.reciclagem?formatDate(cad.reciclagem):''}</span></div>
            <div class="verso-cel"><b>Nº DPF:</b><span>${escapeHtml(formatNumeroDpfMG(cad.numero_dpf||''))}</span></div>
          </div>
          <div class="verso-assinatura">
            <div class="verso-assinatura-linha"></div>
            <div class="verso-responsavel-nome" style="font-style:italic;">JOHN ALEXANDRE SILVA</div>
            <div class="verso-responsavel">RESPONSÁVEL LEGAL</div>
          </div>
        </div>
      </div>`;
  };

  const paginasHtml=grupos.map(grupo=>`
    <div class="pagina-crachas">
      ${grupo.map(conjuntoHtml).join('')}
    </div>`).join('');

  abrirJanelaComPaginasDeCrachas(paginasHtml);
}
/* EXTRAÍDO NESTA RODADA (implementação do Brigadista) — wrapper
   HTML/CSS/window.open, idêntico ao que já existia dentro de
   abrirJanelaImpressaoCrachas, sem nenhuma mudança de conteúdo, só
   isolado para ser reaproveitado também por
   abrirJanelaImpressaoCrachasBrigadista (nova). O CSS é genérico
   (classes .conjunto-cracha/.face-frente/.verso-grid/etc., sem nada
   específico de Vigilante ou Samseg), por isso é seguro reaproveitar
   sem duplicar centenas de linhas. */
function abrirJanelaComPaginasDeCrachas(paginasHtml){
  const html=`<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Crachás</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0; padding:0; font-family:'Inter',Arial,sans-serif; background:#fff;}
  @page{ size: A4 portrait; margin: 12mm 10mm 13mm 10mm; }
  /* Área útil da página (190mm x 272mm) — 4 conjuntos de 65mm cada
     (260mm) + gap:4mm (3 espaços = 12mm) fecham exatamente os 272mm,
     sem sobra e sem necessidade de nenhuma escala automática. */
  .pagina-crachas{width:190mm; display:flex; flex-direction:column; gap:4mm; page-break-after:always;}
  .pagina-crachas:last-child{page-break-after:auto;}
  .conjunto-cracha{width:190mm; height:65mm; display:flex; border:1px solid #000; page-break-inside:avoid; overflow:hidden;}
  .face-frente,.face-verso{width:95mm; height:65mm; padding:3mm; display:flex; flex-direction:column; overflow:hidden;}
  .face-frente{border-right:1px dashed #999;} /* linha discreta de dobra, exatamente nos 95mm */
  /* ---- FRENTE ----
     Área da foto fixa em 3cm x 4cm (30mm x 40mm), como pedido. A logo
     (uma só, nunca duplicada) fica no espaço branco ao lado da foto —
     "frente-logo-wrap" tem a MESMA altura da área da foto (40mm) e
     centraliza a logo dentro dela, o que alinha automaticamente o
     centro vertical da logo com o centro vertical da foto, sem
     precisar calcular isso manualmente. Logo maior que antes (52mm de
     largura), sempre com height:auto — nunca estica nem deforma. */
  .frente-topo{display:flex; align-items:center; justify-content:space-between; height:40mm;}
  .frente-logo-wrap{flex:1; height:40mm; display:flex; align-items:center; justify-content:center;}
  .frente-logo{width:52mm; height:auto; display:block;} /* proporção original preservada — nunca distorcida */
  .frente-foto-espaco{width:30mm; height:40mm; border:1px dashed #666; flex-shrink:0;}
  .frente-titulo{text-align:center; font-weight:700; font-size:14px; letter-spacing:0.4px; margin-top:auto; text-transform:uppercase;}
  .frente-nome{font-weight:700; font-size:12px; text-align:center; word-break:break-word; line-height:1.25; margin-top:2mm; text-transform:uppercase;}
  /* ---- VERSO ----
     Fonte 12px em tudo. "SAMSEG SEGURANÇA PRIVADA" em white-space:nowrap
     para nunca quebrar em duas linhas. Espaço visual entre o
     cabeçalho e a grade de informações (margin-bottom no header).
     grid-template-rows:repeat(3,1fr) garante matematicamente que as
     3 linhas (Identidade/Data do Curso, CPF/Reciclagem, Nº DPF) têm
     EXATAMENTE a mesma altura — não é um valor aproximado, é a
     própria grade que reparte o espaço disponível em partes iguais. */
  .verso-header{text-align:center; font-weight:800; font-size:12px; line-height:1.5; border-bottom:1px solid #000; padding-bottom:2mm; margin-bottom:4mm;}
  .verso-header-empresa{white-space:nowrap;}
  .verso-grid{display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(2,1fr); border:1px solid #000; flex:1;}
  .verso-cel{border:1px solid #000; padding:1.5mm 2mm; font-size:12px; display:flex; flex-direction:column; justify-content:center; gap:1mm; overflow:hidden;}
  .verso-cel.verso-dpf{grid-column:1 / 3;}
  .verso-cel span{font-size:12px; font-weight:600;}
  .verso-assinatura{margin-top:auto; padding-top:2mm; display:flex; flex-direction:column; align-items:center;}
  .verso-assinatura-linha{border-top:1px solid #000; width:70%; margin-bottom:2mm;}
  .verso-responsavel-nome{text-align:center; font-size:11px; margin-bottom:0.5mm;}
  .verso-responsavel{text-align:center; font-weight:700; font-size:12px; letter-spacing:0.4px;}
  @media print{
    body{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
  }
</style>
</head>
<body>
  ${paginasHtml}
</body>
</html>`;

  const janela=window.open('', '_blank');
  if(!janela){
    throw new Error('O navegador bloqueou a abertura da janela de impressão. Permita pop-ups para este site e tente novamente.');
  }
  janela.document.open();
  janela.document.write(html);
  janela.document.close();
  janela.onload=()=>{ janela.focus(); janela.print(); };
}

/* Helper genérico de busca por nome/CPF, reutilizado nas abas que
   ainda não tinham busca própria (Pré-Escala, Escala Oficial, Escala
   & Horário por Dia, Checkout por Dia) — mesma regra da busca já
   existente em CPFs Autorizados/Banco de Colaboradores: ignora
   maiúsculas/minúsculas e pontuação, localiza parte do nome ou do
   CPF. Só filtra a exibição — nunca altera o array original. */
function filtrarPorNomeOuCpf(lista, busca, getNome, getCpf){
  const termo=(busca||'').trim();
  if(!termo) return lista;
  const termoLower=termo.toLowerCase();
  const termoDigits=termo.replace(/\D/g,'');
  return lista.filter(item=>{
    const nome=(getNome(item)||'').toLowerCase();
    const cpf=(getCpf(item)||'').replace(/\D/g,'');
    const matchNome = nome.includes(termoLower);
    const matchCpf = termoDigits.length>0 && cpf.includes(termoDigits);
    return matchNome || matchCpf;
  });
}
function filtrarCpfsAutorizados(){
  const buscaDigits=cpfsAutorizadosBusca.replace(/\D/g,'');
  const buscaTexto=cpfsAutorizadosBusca.trim().toLowerCase();
  return cpfsAutorizadosLista.filter(c=>{
    if(!cpfsAutorizadosBusca.trim()) return true;
    const matchCpf = buscaDigits && (c.cpf||'').includes(buscaDigits);
    const matchNome = (c.nome||'').toLowerCase().includes(buscaTexto);
    return matchCpf || matchNome;
  });
}

  const cpfInp=document.getElementById('novoCpfAut');

  const txtFuncao=document.getElementById('novaFuncaoAutTexto');
  if(cpfInp) cpfInp.oninput=(e)=>{
    maskCpfInput(e.target);
    /* Trocar/editar o CPF nunca pode manter uma função de uma
       consulta anterior — sempre volta para "sem seleção", exigindo
       escolha manual de novo. */
    if(selFuncao) selFuncao.value='';
    if(txtFuncao){ txtFuncao.value=''; if(selFuncao) txtFuncao.style.display='none'; }
  };
  const nomeAutInp=document.getElementById('novoNomeAut');
  if(nomeAutInp) nomeAutInp.oninput=()=>{
    const pos=nomeAutInp.selectionStart;
    nomeAutInp.value=nomeAutInp.value.toUpperCase();
    nomeAutInp.setSelectionRange(pos,pos);
  };
  const buscaInp=document.getElementById('buscaCpfAutorizado');
  if(buscaInp) buscaInp.oninput=(e)=>{

    // o próprio input de busca, para não perder o foco a cada tecla.
    cpfsAutorizadosBusca=e.target.value;
    const tabela=document.getElementById('cpfsAutorizadosTabela');
    if(tabela){
      tabela.innerHTML=renderCpfsAutorizadosLista(filtrarCpfsAutorizados());

  };
  if(selFuncao && txtFuncao){
    selFuncao.onchange=()=>{ txtFuncao.style.display = selFuncao.value==='__outra__' ? '' : 'none'; };
  }
  const btnAdd=document.getElementById('btnAddCpfAut');
  if(btnAdd) btnAdd.onclick=async ()=>{
    const cpf=document.getElementById('novoCpfAut').value.trim();
    const nome=nomeExibicao(document.getElementById('novoNomeAut').value);
    /* Se existem funções cadastradas no evento (Valores por Função),
       usa o dropdown com os nomes padronizados — evita "Vigilante"
       vs "VIGILANTE " vs "vigilante" viraram funções diferentes. Só
       cai no texto livre se o gestor escolher "+ Outra função" ou se
       o evento ainda não tem nenhuma função cadastrada. */
    let funcao;
    if(selFuncao){
      funcao = selFuncao.value==='__outra__' ? txtFuncao.value.trim() : selFuncao.value;
    } else {
      funcao = txtFuncao.value.trim();
    }
    if(!cpf){ showToast('Informe o CPF.'); return; }
    if(!funcao){ showToast('Informe a função.'); return; }
    const r=await chamarRpcGestor('upsert_cpf_autorizado',{p_evento_id:currentEventId, p_cpf:cpf, p_nome:nome||null, p_funcao:funcao});
    if(r.ok){ showToast('CPF autorizado.'); await loadCpfsAutorizadosEvento(); renderShell(); }
  };
  attachCpfsAutorizadosRowHandlers();
}

async function collectPayments(){
  const finalizedEvents = events.filter(e=>e.status==='finalizado');
  const rows=[];
  for(const ev of finalizedEvents){
    const s=(await sGet('staff:'+ev.id))||[];
    s.filter(c=>c.escalado&&c.compareceu).forEach(c=>{
      rows.push({eventoId:ev.id, evento:ev.evento, cliente:ev.cliente, data:c.data, staffId:c.id, nome:c.nome, entrada:c.entrada, saida:c.saida, valor:calcValor(c,ev), pago:!!c.pago, dataPagamento:c.dataPagamento||''});
    });
  }
  return rows;
}

      <div class="spacer"></div>
    </div>
    <div class="section-title">Pendentes</div>
    <div id="pendTable"></div>
    <div class="section-title">Histórico de pagamentos</div>
    <div id="pagoTable"></div>
  `;

  function applyFilters(list){
    const nome=document.getElementById('fNome').value.trim().toLowerCase();
    const eventoId=document.getElementById('fEvento').value;
    const de=document.getElementById('fDe').value;
    const ate=document.getElementById('fAte').value;
    return list.filter(r=>{
      if(nome && !r.nome.toLowerCase().includes(nome)) return false;
      if(eventoId && r.eventoId!==eventoId) return false;
      if(de && r.data && r.data<de) return false;
      if(ate && r.data && r.data>ate) return false;
      return true;
    });
  }

  function drawTables(){
    const filtered=applyFilters(rows);
    const pendentes=filtered.filter(r=>!r.pago);
    const pagos=filtered.filter(r=>r.pago);

    document.getElementById('pendTable').innerHTML = pendentes.length ? `
      <div class="add-row" style="justify-content:flex-end;">
        <button class="btn btn-teal btn-sm" id="btnPagarSelecionados">Registrar pagamento dos selecionados</button>
      </div>
      <table>
        <thead><tr><th><input type="checkbox" id="chkAll"></th><th>Nome</th><th>Evento</th><th>Cliente</th><th>Data</th><th>Valor</th><th>Status</th></tr></thead>
        <tbody>
          ${pendentes.map(r=>`
            <tr data-eventoid="${r.eventoId}" data-staffid="${r.staffId}">
              <td><input type="checkbox" class="chk-pay"></td>
              <td>${escapeHtml(nomeExibicao(r.nome))}</td>
              <td>${escapeHtml(r.evento)}</td>
              <td>${escapeHtml(r.cliente)}</td>
              <td class="mono">${r.data?formatDate(r.data):'—'}</td>
              <td class="mono">${brl(r.valor)}</td>
              <td><span class="badge pendente">Pendente</span></td>
            </tr>`).join('')}
        </tbody>
      </table>` : `<div class="empty" style="padding:20px;"><b>Nenhum pagamento pendente</b>Tudo certo com os filtros atuais.</div>`;

    document.getElementById('pagoTable').innerHTML = pagos.length ? `
      <table>
        <thead><tr><th>Nome</th><th>Evento</th><th>Data do evento</th><th>Valor</th><th>Pago em</th></tr></thead>
        <tbody>
          ${pagos.map(r=>`<tr>
            <td>${escapeHtml(nomeExibicao(r.nome))}</td><td>${escapeHtml(r.evento)}</td>
            <td class="mono">${r.data?formatDate(r.data):'—'}</td><td class="mono">${brl(r.valor)}</td>
            <td class="mono">${r.dataPagamento?formatDate(r.dataPagamento):'—'}</td></tr>`).join('')}
        </tbody>
      </table>` : `<div class="empty" style="padding:20px;"><b>Nenhum pagamento registrado ainda</b></div>`;

    const chkAll=document.getElementById('chkAll');
    if(chkAll) chkAll.onchange=(e)=>{ document.querySelectorAll('.chk-pay').forEach(c=>c.checked=e.target.checked); };

    const btnPagar=document.getElementById('btnPagarSelecionados');
    if(btnPagar) btnPagar.onclick=async ()=>{
      const selected=[...document.querySelectorAll('.chk-pay:checked')].map(c=>c.closest('tr'));
      if(!selected.length){ showToast('Selecione ao menos um colaborador.'); return; }
      const byEvent={};
      selected.forEach(tr=>{
        const eid=tr.dataset.eventoid, sid=tr.dataset.staffid;
        (byEvent[eid]=byEvent[eid]||[]).push(sid);
      });
      for(const eid in byEvent){
        const s=(await sGet('staff:'+eid))||[];
        s.forEach(c=>{ if(byEvent[eid].includes(c.id)){ c.pago=true; c.dataPagamento=todayISO(); } });
        await sSet('staff:'+eid, s);
      }
      showToast('Pagamento registrado.');
      renderPagamentos(main);
    };
  }

  document.getElementById('fNome').oninput=drawTables;
  document.getElementById('fEvento').onchange=drawTables;
  document.getElementById('fDe').onchange=drawTables;
  document.getElementById('fAte').onchange=drawTables;
  drawTables();
}

/* ================= RELATÓRIOS ================= */
async function renderRelatorios(main){
  main.innerHTML=`<div class="empty">Carregando relatórios...</div>`;
  const monthEvents=events.filter(e=>e.data && e.data.slice(0,7)===dashMonth);
  eventStatsCache={};
  const stats=await Promise.all(monthEvents.map(e=>getEventStats(e.id)));
  const fins=await Promise.all(monthEvents.map(e=>getEventFinancials(e)));
  /* CORREÇÃO DESTA RODADA: total do mês separado em Prévia (eventos
     abertos) e Fechado (eventos finalizados) — nunca somados como um
     único número, porque são categorias diferentes e cada evento cai
     em só uma delas (definido pelo próprio ev.status). Substitui o
     cálculo antigo (stats[i].valorTotal, baseado só em staff). */
  const totalPrevia=monthEvents.reduce((s,e,i)=>e.status==='aberto' ? s+fins[i].valor : s, 0);
  const totalFechado=monthEvents.reduce((s,e,i)=>e.status==='finalizado' ? s+fins[i].valor : s, 0);
  const totalProfissionais=fins.reduce((s,f)=>s+(f.profissionais||0),0);
  main.innerHTML=`
    <div class="page-head"><div><h2>Relatórios</h2><div class="sub">Visão gerencial — eventos, clientes e financeiro do período</div></div>
      <input type="month" id="relMonth" value="${dashMonth}"></div>
    <div class="toolbar">
      <input type="text" id="relBusca" placeholder="Buscar por evento ou cliente" style="flex:1; min-width:220px;">
      <div class="spacer"></div>
    </div>
    <div class="stat-grid" style="margin-bottom:20px;">
      <div class="stat-card"><div class="label">Eventos no mês</div><div class="value">${monthEvents.length}</div></div>
      <div class="stat-card"><div class="label">Profissionais envolvidos</div><div class="value">${totalProfissionais}</div></div>
      <div class="stat-card amber"><div class="label">Prévia (abertos)</div><div class="value">${maskValor(totalPrevia)}</div></div>
      <div class="stat-card teal"><div class="label">Fechado (finalizados)</div><div class="value">${maskValor(totalFechado)}</div></div>
    </div>
    <div id="relTableWrap"></div>
  `;
  const buscaInp=document.getElementById('relBusca');
  function draw(){
    const termo=(buscaInp.value||'').trim().toLowerCase().replace(/\s+/g,' ');
    const idxFiltrados=monthEvents.map((e,i)=>i).filter(i=>{
      if(!termo) return true;
      const titulo=`${monthEvents[i].cliente||''} ${monthEvents[i].evento||''}`.toLowerCase().replace(/\s+/g,' ');
      return titulo.includes(termo);
    });
    const wrap=document.getElementById('relTableWrap');
    if(!idxFiltrados.length){ wrap.innerHTML=`<div class="empty"><b>Nenhum evento encontrado</b>Ajuste a busca ou o mês.</div>`; return; }
    wrap.innerHTML=`
      <table>
        <thead><tr><th>Cliente</th><th>Evento</th><th>Data</th><th>Status</th><th>Profissionais</th><th>Valor</th><th></th></tr></thead>
        <tbody>
          ${idxFiltrados.map(i=>{
            const e=monthEvents[i], fin=fins[i];
            const rotulo=fin.tipo==='fechamento'?'Fechamento':fin.tipo==='previa'?'Prévia':'—';
            return `<tr>
              <td>${escapeHtml(e.cliente)}</td><td>${escapeHtml(e.evento)}</td><td class="mono">${formatPeriodo(e)}</td>
              <td><span class="badge ${e.status}">${e.status==='aberto'?'Em aberto':'Finalizado'}</span></td>
              <td class="mono">${fin.profissionais}</td>
              <td class="mono">${fin.tipo!=='indisponivel'?maskValor(fin.valor):'—'} <span style="color:var(--muted);font-size:11px;">${rotulo}</span></td>
              <td><button class="btn btn-ghost btn-sm btn-abrir-rel" data-id="${e.id}">Abrir</button></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`;
    wrap.querySelectorAll('.btn-abrir-rel').forEach(btn=>{
      btn.onclick=async ()=>{ currentEventId=btn.dataset.id; await loadStaffForCurrent(); await loadInteressadosForCurrent(); await loadDiasEscalaPresenca(); section='evento'; subTab='aprovacao'; renderShell(); };
    });
  }
  buscaInp.oninput=draw;
  document.getElementById('relMonth').onchange=(e)=>{ dashMonth=e.target.value; renderRelatorios(main); };
  draw();
}

/* ================= DETAIL HANDLERS ================= */
function attachDetailHandlers(){
  const linkBtn=document.getElementById('btnCopyLink');
  if(linkBtn) linkBtn.onclick=()=>copyText(eventLink(currentEventId));
  const linkBtnStatus=document.getElementById('btnCopyLinkStatus');
  if(linkBtnStatus) linkBtnStatus.onclick=()=>copyText(eventLinkStatus(currentEventId));

  const buscaPreEscalaInp=document.getElementById('buscaPreEscala');
  if(buscaPreEscalaInp) buscaPreEscalaInp.oninput=()=>{
    // Nunca recriar o próprio campo de busca — só atualiza o container
    // da listagem filtrada, para não perder o foco a cada tecla.
    preEscalaBusca=buscaPreEscalaInp.value;
    const lista=document.getElementById('preEscalaLista');
    if(lista){ lista.innerHTML=renderPreEscalaLista(); attachPreEscalaListaHandlers(); }
  };
  const buscaEscalaOficialInp=document.getElementById('buscaEscalaOficial');
  if(buscaEscalaOficialInp) buscaEscalaOficialInp.oninput=()=>{
    escalaOficialBusca=buscaEscalaOficialInp.value;
    const lista=document.getElementById('escalaOficialLista');
    if(lista){ lista.innerHTML=renderEscalaOficialLista(); attachEscalaOficialListaHandlers(); }
  };

  const btnNewFuncaoEvento=document.getElementById('btnNewFuncaoEvento');
  if(btnNewFuncaoEvento) btnNewFuncaoEvento.onclick=()=>openFuncaoEventoForm();
  document.querySelectorAll('.btn-del-funcao-evento').forEach(btn=>{
    btn.onclick=async (e)=>{
      const nome=e.target.closest('.client-card').dataset.funcao;
      if(!confirm(`Excluir o valor de "${nome}" neste evento? Colaboradores com essa função ficarão sem valor cadastrado aqui.`)) return;
      const ev=currentEvent();
      ev.valoresFuncao=(ev.valoresFuncao||[]).filter(f=>f.funcao!==nome);
      await saveEvents();
      renderShell();
    };
  });
  const buscaFuncaoInput=document.getElementById('buscaFuncaoEvento');
  if(buscaFuncaoInput){
    /* Filtro é só manipulação de DOM (mostra/esconde cartões) — de
       propósito, sem chamar renderShell() a cada tecla, para não
       perder o foco/cursor do campo de busca enquanto o gestor digita. */
    buscaFuncaoInput.oninput=()=>{ buscaFuncaoEventoTexto=buscaFuncaoInput.value; filtrarFuncoesEvento(); };
    filtrarFuncoesEvento();
  }
  document.querySelectorAll('.input-valor-funcao-direto').forEach(inp=>{
    inp.onchange=async ()=>{
      const nome=inp.closest('.client-card').dataset.funcao;
      const ev=currentEvent();
      const entry=(ev.valoresFuncao||[]).find(f=>f.funcao===nome);
      if(!entry) return;
      const bruto=inp.value.trim();
      if(bruto===''){ entry.valorDia=null; }
      else{
        const novoValor=parseFloat(bruto);
        if(isNaN(novoValor) || novoValor<0){ showToast('Informe um valor numérico válido.'); inp.value=entry.valorDia!=null?entry.valorDia:''; return; }
        entry.valorDia=novoValor;
      }
      const r=await saveEvents();
      if(r && r.ok){ renderShell(); }
      else{ showToast('Erro ao salvar valor: '+(r && r.error && r.error.message ? r.error.message : 'tente novamente.')); }
    };
  });

  attachPreEscalaListaHandlers();

  const btnAdd=document.getElementById('btnAddStaff');
  if(btnAdd) btnAdd.onclick=async ()=>{
    /* CORREÇÃO DESTA RODADA — antes, cadastro manual só fazia
       staff.push()+saveStaff(), gravando só em eventos.dados.staff.
       Isso deixava a pessoa "visível" na Escala Oficial, mas sem
       nenhuma linha em participacoes — por isso ela nunca aparecia em
       Escala/Horário por Dia, Checkout, Fechamento ou Aprovação (que
       dependem de participacoes, uma estrutura totalmente separada de
       staff). Agora o cadastro manual percorre exatamente o mesmo
       caminho de quem entra pelo link, reaproveitando as RPCs já
       existentes, na ordem: colaboradores -> cpfs_autorizados ->
       participacoes -> staff. Nenhuma lógica paralela nova — só
       chamadas às RPCs que já existem e já fazem isso para o fluxo
       público. */
    const nome=nomeExibicao(document.getElementById('newNome').value.trim());
    const cpfLimpo=document.getElementById('newCpf').value.replace(/\D/g,'');
    const telefoneDigits=document.getElementById('newTelefone').value.replace(/\D/g,'');
    const funcao=document.getElementById('newFuncao').value.trim();

    if(!nome){ showToast('Informe o nome do colaborador.'); return; }
    if(cpfLimpo.length!==11){ showToast('Informe um CPF válido (11 números).'); return; }
    if(telefoneDigits.length!==11){ showToast('Informe um telefone válido — a participação no evento exige telefone.'); return; }
    if(!funcao){ showToast('Informe a função.'); return; }

    /* BLOQUEIO DE ESCALA POR RECICLAGEM VENCIDA — checado ANTES de
       qualquer chamada RPC, para nunca deixar estado parcial (colaborador
       criado mas barrado no staff). Diferente do bloqueio da Pré-Escala:
       aqui só bloqueia se HOUVER reciclagem cadastrada no Banco E ela
       estiver vencida para este evento — ausência de reciclagem NÃO
       bloqueia, porque o cadastro manual de Vigilante incompleto (sem
       RG/reciclagem/etc.) já foi aprovado explicitamente em rodada
       anterior. Recarrega o Banco para não depender de a aba de
       Impressão de Crachás já ter sido visitada. */
    if(funcao.trim().toUpperCase().startsWith('VIGILANTE')){
      await loadColaboradoresBanco();
      const colabExistente=buscarColaboradorPorCpf(cpfLimpo);
      if(colabExistente && colabExistente.reciclagem && !reciclagemValidaAteFinalEvento(colabExistente.reciclagem, currentEvent())){
        showToast('Não é possível escalar: reciclagem deste Vigilante está vencida para a data deste evento.');
        return;
      }
    }

    btnAdd.disabled=true; btnAdd.textContent='Cadastrando...';
    try{
      /* PASSO 3 — Banco de Colaboradores. Cadastro MANUAL usa a RPC
         ORIGINAL (sem _v2), de propósito — ela nunca teve validação de
         completude para Vigilante, então aceita um cadastro
         inicialmente incompleto (identidade/curso/reciclagem/DPF/
         cidade/grandes_eventos ficam NULL para um CPF novo, ou
         preservados como já estavam para um CPF existente — essa RPC
         nunca toca nessas colunas além do que for enviado). O fluxo
         público continua usando _v2 (inalterado em todos os seus 3
         pontos de chamada), que continua exigindo Vigilante completo. */
      const {error:erroBanco}=await sb.rpc('salvar_colaborador_cracha',{
        p_cpf:cpfLimpo, p_nome:nome, p_funcao:funcao, p_telefone:telefoneDigits
      });
      if(erroBanco) throw erroBanco;

      /* PASSO 4 — CPF Autorizado no evento atual. Mesma RPC já usada
         pela aba CPFs Autorizados — se o CPF já estiver autorizado
         para este evento, ela atualiza; nunca duplica. */
      const rCpfAut=await chamarRpcGestor('upsert_cpf_autorizado',{p_evento_id:currentEventId, p_cpf:cpfLimpo, p_nome:nome, p_funcao:funcao});
      if(!rCpfAut.ok) throw (rCpfAut.error || new Error('Não foi possível autorizar o CPF para este evento.'));

      /* PASSO 5 — Participação real, mesma RPC do fluxo público. Ela
         já verifica cpfs_autorizados internamente (que acabamos de
         garantir no passo anterior) e usa a função de lá. */
      const {error:erroPart}=await sb.rpc('registrar_participacao',{
        p_evento_id:currentEventId, p_cpf:cpfLimpo, p_nome:nome, p_telefone:telefoneDigits
      });
      if(erroPart) throw erroPart;

      /* PASSO 5.5 — Pré-Escala já nasce APROVADA aqui, diferente do
         fluxo público (que nasce 'pendente' e depende do clique
         "Aprovar"). Faz sentido: o próprio ato do gestor cadastrar
         manualmente já É a aprovação — não tem sentido pedir uma
         segunda aprovação de algo que o gestor acabou de decidir.
         Mesmo padrão de acesso à tabela já usado no fluxo público
         (sb.from('interessados')), sem nenhuma RPC nova. Upsert manual
         por evento_id+cpf: atualiza se já existir (ex: reenvio do
         mesmo CPF), insere se não existir — nunca duplica. É esta
         etapa que faz o colaborador aparecer em "Escala e Horário por
         Dia" (que filtra por interessados.status==='aprovado'). */
      const {data:interessadoExistente,error:exIntErr}=await sb.from('interessados')
        .select('id').eq('evento_id', currentEventId).eq('cpf', cpfLimpo).maybeSingle();
      if(exIntErr) throw exIntErr;
      if(interessadoExistente){
        const {error:updIntErr}=await sb.from('interessados')
          .update({nome, telefone: telefoneDigits, funcao, status:'aprovado'})
          .eq('id', interessadoExistente.id);
        if(updIntErr) throw updIntErr;
      } else {
        const {error:insIntErr}=await sb.from('interessados').insert({
          evento_id: currentEventId, nome, cpf: cpfLimpo, telefone: telefoneDigits, funcao, status:'aprovado'
        });
        if(insIntErr) throw insIntErr;
      }

      /* PASSO 6/7 — só chega aqui se os passos críticos deram certo:
         mantém a Escala Oficial funcionando exatamente como antes. */
      staff.push({id:uid(), eventId:currentEventId, nome, cpf:cpfLimpo, telefone:telefoneDigits, funcao, escalado:true, compareceu:false, data:currentEvent().data||'', entrada:'', saida:'', diasTrabalhados:1, pago:false});
      await saveStaff();

      /* PASSO 8 — recarrega participações/escala/presença/fechamento
         para refletir a nova participação imediatamente, sem precisar
         trocar de aba manualmente. */
      await loadDiasEscalaPresenca();
      renderShell();
      showToast('Colaborador cadastrado e vinculado ao evento com sucesso.');
    }catch(err){
      console.error('Erro ao cadastrar colaborador manualmente:', err);
      showToast('Não foi possível concluir o cadastro: '+formatarErroSupabase(err).replace(/<br>/g,' — ').replace(/<[^>]+>/g,''));
      btnAdd.disabled=false; btnAdd.textContent='+ Adicionar manualmente';
    }
  };
  const btnNotifyAll=document.getElementById('btnNotifyAll');
  if(btnNotifyAll) btnNotifyAll.onclick=()=>{
    const ev=currentEvent();
    const alvos=staff.filter(c=>c.telefone && c.telefone.trim());
    if(!alvos.length){ showToast('Nenhum colaborador com telefone cadastrado.'); return; }
    if(!confirm(`Isso vai abrir ${alvos.length} aba(s) do WhatsApp, uma por colaborador. Em cada uma, você só precisa clicar em "Enviar". Continuar?`)) return;
    alvos.forEach((c,i)=>{
      let numero=(c.telefone||'').replace(/\D/g,'');
      if(numero.length===10 || numero.length===11) numero='55'+numero; // adiciona DDI Brasil se a pessoa não colocou
      const texto=encodeURIComponent(`Olá ${c.nome}, você foi convocado(a) para o evento "${ev.evento}" (${formatPeriodo(ev)}). Aguardamos você!`);
      setTimeout(()=>window.open(`https://wa.me/${numero}?text=${texto}`,'_blank'), i*400);
    });
  };
  attachEscalaOficialListaHandlers();
  document.querySelectorAll('.stamp-toggle').forEach(el=>{
    el.onclick=async (e)=>{ const id=e.target.closest('tr').dataset.id; const c=staff.find(s=>s.id===id); c.compareceu=!c.compareceu; if(c.compareceu){ if(!c.data) c.data=currentEvent().data||''; if(c.diasTrabalhados==null) c.diasTrabalhados=1; } await saveStaff(); renderShell(); };
  });
  ['f-data','f-entrada','f-saida','f-dias'].forEach(cls=>{
    document.querySelectorAll('.'+cls).forEach(inp=>{
      inp.onchange=async (e)=>{ const id=e.target.closest('tr').dataset.id; const c=staff.find(s=>s.id===id); const field=cls==='f-data'?'data':cls==='f-entrada'?'entrada':cls==='f-saida'?'saida':'diasTrabalhados'; c[field]=e.target.value; await saveStaff(); renderShell(); };
    });
  });
  const btnPrint=document.getElementById('btnPrint');
  if(btnPrint) btnPrint.onclick=()=>window.print();
  const btnPrintFechamentoEvento=document.getElementById('btnPrintFechamentoEvento');
  if(btnPrintFechamentoEvento) btnPrintFechamentoEvento.onclick=()=>window.print();
  const btnVisaoFechamentoGestor=document.getElementById('btnVisaoFechamentoGestor');
  if(btnVisaoFechamentoGestor) btnVisaoFechamentoGestor.onclick=()=>{
    /* Guarda também no JS (não só o atributo disabled do HTML) — o
       bloqueio não pode ser contornado nem se o disabled falhar por
       algum motivo. */
    const ev=currentEvent();
    if(!ev || ev.status==='aberto'){
      showToast('Aprove e encerre o Fechamento Evento Presidência antes de liberar a impressão do Fechamento do Gestor.');
      return;
    }
    aprovacaoVisao='gestor'; renderShell();
  };
  const btnVisaoFechamentoPresidencia=document.getElementById('btnVisaoFechamentoPresidencia');
  if(btnVisaoFechamentoPresidencia) btnVisaoFechamentoPresidencia.onclick=()=>{ aprovacaoVisao='presidencia'; renderShell(); };
  const btnAprovar=document.getElementById('btnAprovar');
  if(btnAprovar) btnAprovar.onclick=async ()=>{
    if(!confirm('Confirma o fechamento da equipe? Após aprovar, o evento fica disponível na área de Pagamentos.')) return;
    currentEvent().status='finalizado';
    await saveEvents();
    renderShell();
    showToast('Fechamento aprovado.');
  };
  const btnReabrir=document.getElementById('btnReabrir');
  if(btnReabrir) btnReabrir.onclick=async ()=>{
    currentEvent().status='aberto';
    await saveEvents();
    renderShell();
    showToast('Evento reaberto para ajustes.');
  };
}

/* ================= INIT ================= */
loadAll();
</script>
